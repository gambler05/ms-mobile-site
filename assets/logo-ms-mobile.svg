<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" role="img" aria-label="MS MOBILE">
  <title>MS MOBILE</title>
  <!-- Corps du téléphone -->
  <rect x="12" y="10" width="276" height="480" rx="54" fill="#1c1c1c"/>
  <!-- Écran -->
  <path fill="#ffffff" d="M36 62a26 26 0 0 1 26-26h176a26 26 0 0 1 26 26v294H36Z"/>
  <!-- Encoche -->
  <path fill="#1c1c1c" d="M112 36h76v12a14 14 0 0 1-14 14h-48a14 14 0 0 1-14-14Z"/>
  <!-- Haut-parleur -->
  <rect x="110" y="76" width="80" height="8" rx="4" fill="#1c1c1c"/>
  <!-- Monogramme -->
  <text x="150" y="196" fill="#1c1c1c" font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
        font-size="128" font-weight="900" text-anchor="middle" letter-spacing="-2">M</text>
  <text x="150" y="300" fill="#1c1c1c" font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
        font-size="128" font-weight="900" text-anchor="middle">S</text>
  <text x="150" y="342" fill="#1c1c1c" font-family="Arial,Helvetica,sans-serif"
        font-size="44" font-weight="600" text-anchor="middle" letter-spacing="2">MOBILE</text>
  <!-- Cycle de réparation : deux flèches en anneau -->
  <g fill="none" stroke="#e3131b" stroke-width="17" stroke-linecap="butt">
    <path d="M96.8 414.6A54 54 0 0 1 203.2 414.6"/>
    <path d="M203.2 433.4A54 54 0 0 1 96.8 433.4"/>
  </g>
  <g fill="#e3131b">
    <path d="M0-15L23 0L0 15Z" transform="translate(203.2 414.6) rotate(80)"/>
    <path d="M0-15L23 0L0 15Z" transform="translate(96.8 433.4) rotate(260)"/>
  </g>
  <!-- Clé plate : mâchoire ouverte tracée au trait, lisible même en 24 px -->
  <g transform="translate(150 424) rotate(40)">
    <rect x="-7.5" y="-30" width="15" height="56" rx="7.5" fill="#ffffff"/>
    <path d="M6.5-36.6A13 13 0 1 1-6.5-36.6" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="butt"/>
  </g>
</svg>

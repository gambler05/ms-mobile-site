<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>VERTIGE — Reel 02</title>
<style>
@font-face{font-family:"JBM";font-weight:500;src:url(../reel-01/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"JBM";font-weight:700;src:url(../reel-01/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2")}
html,body{margin:0;background:#000}
canvas{display:block;width:1080px;height:1920px}
body.preview canvas{width:auto;height:100vh;margin:0 auto}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ============================================================
   VERTIGE — Reel 02 « 1 000 € par jour »
   Moteur déterministe : renderFrame(n) dessine l'image n (30 i/s).
   Ouvrir avec ?preview pour une lecture temps réel.
   ============================================================ */
const W = 1080, H = 1920, FPS = 30, DURATION = 31.0;
const C = { ink:'#0A0A0F', ink2:'#14141C', ivory:'#F3EEE3', red:'#FF4A1C', mist:'#8B8B99', graphite:'#2A2A33' };
const DISPLAY = '"Inter Display","Inter",sans-serif', MONO = '"JBM",monospace';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d');

/* ---------- repères temporels (secondes) ---------- */
const TL = {
  hookQ: 1.5,
  fall1: [2.8, 4.4],  sub1: 5.1,  out1: 6.75,
  q2: 7.0, zeros2: 7.5, silence2: 9.1,
  fall2: [9.4, 12.4], sub2: 13.2, out2: 14.75,
  q3: 15.0, zeros3: 15.5, silence3: 17.2,
  fall3: [17.6, 22.6], sub3: 23.5,
  pix1: 25.0, pix2: 26.2,
  end: 28.0, word: 28.7, tag: 29.25, cta: 29.7,
};
const PEEL = Array.from({ length: 13 }, (_, k) => .9 + 1.75 * (1 - Math.exp(-k / 4)) / (1 - Math.exp(-3)));  // un billet par « jour », de plus en plus vite
/* ---------- profondeurs (en jours) : fortune ÷ 1 000 € par jour ---------- */
const YR = 365.2425, MONTH = YR / 12;
const T1 = 1e3, T2 = 1e6, T3 = 1e9, F0 = 0.02;
const XR = 200, YF = 1040, AN = 700;

/* ---------- utilitaires ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, t0, d) => clamp((t - t0) / d);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eIn = x => x * x * x;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const nbsp = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const font = (w, s, fam = DISPLAY) => `${w} ${s}px ${fam}`;
const LS = v => { if ('letterSpacing' in ctx) ctx.letterSpacing = v; };
function fit(text, w, fam, maxW, maxS, ls = 0) { ctx.font = font(w, 100, fam); LS('0px'); const m = ctx.measureText(text).width + ls * text.length; return Math.min(maxS, 100 * maxW / m); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

/* ---------- caméra ---------- */
function fallOf(t) {
  const segs = [[TL.fall1, F0, T1, 4.5], [TL.fall2, T1, T2, 6], [TL.fall3, T2, T3, 7.5]];
  for (const [[a, b], f0, f1, G] of segs) if (t >= a && t < b) return { u: (t - a) / (b - a), f0, f1, G };
  return null;
}
function cam(t) {
  const f = fallOf(t);
  if (f) { const e = eio(f.u); return { F: f.f0 * Math.pow(f.f1 / f.f0, e), g: 1 + f.G * Math.pow(Math.sin(Math.PI * e), 2), falling: true, u: f.u }; }
  const F = t < TL.fall1[0] ? F0 : t < TL.fall2[0] ? T1 : t < TL.fall3[0] ? T2 : T3;
  return { F, g: 1, falling: false, u: 0 };
}
const yOf = (d, c) => YF + AN * c.g * (d / c.F - 1);

/* ---------- grain, poussières, billets ---------- */
const grain = document.createElement('canvas'); grain.width = 360; grain.height = 640;
{ const g = grain.getContext('2d'), id = g.createImageData(360, 640), r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }
const DUST = (() => { const r = rng(42); return Array.from({ length: 90 }, () => ({ x: r() * W, p: r(), z: .35 + r() * 1.4, s: 1 + r() * 2 })); })();
const BILLS = (() => { const r = rng(2026); return Array.from({ length: 44 }, () => ({ x: 260 + r() * 860, p: r(), z: .35 + r() * 1.35, a0: r() * 6.28, sp: .6 + r() * 1.6, tilt: (r() - .5) * 1.1, red: r() < .14 })).sort((a, b) => a.z - b.z); })();

function background(t, c) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const depth = clamp(Math.log10(c.F / F0) / Math.log10(T3 / F0));
  const g = ctx.createRadialGradient(W * .5, YF, 60, W * .5, YF, 1300);
  g.addColorStop(0, `rgba(${Math.round(34 + 30 * depth)},${Math.round(30 + 4 * depth)},${Math.round(46 - 14 * depth)},1)`);
  g.addColorStop(1, 'rgba(10,10,15,1)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function speedOf(t, c) { return (Math.log(c.F) - Math.log(cam(t - 1 / FPS).F)) * FPS; }
function dust(t, c, alpha) {
  const L = Math.log(c.F), v = speedOf(t, c);
  for (const p of DUST) {
    let ph = (p.p - L * p.z * .16 - t * .004 * p.z) % 1; if (ph < 0) ph += 1;
    const y = ph * (H + 300) - 150, len = Math.min(520, 4 + Math.abs(v) * p.z * 95);
    ctx.globalAlpha = alpha * (.08 + .26 * (p.z / 1.75)) * (c.falling ? 1 : .55);
    ctx.fillStyle = C.ivory; ctx.fillRect(p.x, y, p.s * (c.falling ? .8 : 1), len);
  }
  ctx.globalAlpha = 1;
}
// billets en 2.5D : ils tournent sur eux-mêmes et s'étirent avec la vitesse de chute
function billShape(w, h, detail) {
  rr(ctx, -w / 2, -h / 2, w, h, h * .09); ctx.stroke();
  if (detail) { ctx.beginPath(); ctx.arc(-w * .26, 0, h * .24, 0, 7); ctx.stroke(); ctx.fillRect(w * .02, -h * .12, w * .32, h * .07); ctx.fillRect(w * .02, h * .06, w * .2, h * .07); }
}
function bills(t, c, alpha) {
  if (alpha <= 0) return;
  const L = Math.log(c.F), v = Math.abs(speedOf(t, c));
  for (const b of BILLS) {
    let ph = (b.p - L * b.z * .13 - t * .012 * b.z) % 1; if (ph < 0) ph += 1;
    const y = ph * (H + 500) - 250, w = 118 * b.z, h = 60 * b.z;
    const flip = Math.cos(b.a0 + t * b.sp + L * b.z * 2.2), stretch = 1 + Math.min(1.6, v * b.z * .4);
    const a = alpha * (.10 + .30 * (b.z / 1.7));
    ctx.strokeStyle = ctx.fillStyle = b.red ? C.red : C.ivory; ctx.lineWidth = Math.max(1.5, 2.2 * b.z);
    const ghosts = c.falling ? 3 : 1;
    for (let gI = ghosts - 1; gI >= 0; gI--) {
      ctx.save(); ctx.globalAlpha = a / (1 + gI * 1.6);
      ctx.translate(b.x, y + gI * v * b.z * 26); ctx.rotate(b.tilt + Math.sin(t * .7 + b.a0) * .12);
      ctx.scale(1, (Math.abs(flip) < .06 ? .06 : flip) * (gI ? 1 : 1) * stretch);
      billShape(w, h, b.z > .9 && gI === 0); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- la règle ---------- */
const UNITS = [
  { d: 1 / 1440, m: 60, f: k => `−${k} MIN` }, { d: 1 / 24, m: 24, f: k => `−${k} H` }, { d: 1, m: 1e9, f: k => `−${k} J` },
  { d: MONTH, m: 12, f: k => `−${k} MOIS` },
  { d: YR, m: 10, f: k => `−${k} AN${k > 1 ? 'S' : ''}` }, { d: 10 * YR, m: 10, f: k => `−${nbsp(k * 10)} ANS` },
  { d: 100 * YR, m: 10, f: k => `−${nbsp(k * 100)} ANS` }, { d: 1e3 * YR, m: 10, f: k => `−${nbsp(k * 1e3)} ANS` },
  { d: 1e4 * YR, m: 10, f: k => `−${nbsp(k * 1e4)} ANS` }, { d: 1e5 * YR, m: 10, f: k => `−${nbsp(k * 1e5)} ANS` },
  { d: 1e6 * YR, m: 10, f: k => `−${nbsp(k * 1e6)} ANS` },
];
function ruler(c, alpha, labels) {
  const k = AN * c.g / c.F, y0 = yOf(0, c);
  ctx.strokeStyle = C.ivory; ctx.fillStyle = C.ivory; ctx.lineCap = 'butt';
  ctx.globalAlpha = alpha * .9; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(XR, Math.max(-10, y0)); ctx.lineTo(XR, H + 10); ctx.stroke();
  const dMin = Math.max(0, c.F * (1 + (-60 - YF) / (AN * c.g))), dMax = c.F * (1 + (H + 60 - YF) / (AN * c.g));
  for (const u of UNITS) {
    const sp = u.d * k; if (sp < 7 || sp > 5000) continue;
    if (u.d === 1 && sp < 16) continue;                      // les mois prennent le relais des jours
    const a = clamp((sp - 7) / 26), len = lerp(16, 86, clamp(sp / 260)), la = clamp((sp - 52) / 30);
    const k0 = Math.max(1, Math.ceil(dMin / u.d)), k1 = Math.floor(dMax / u.d);
    for (let i = k0; i <= k1; i++) {
      if (sp < 40 && i % u.m === 0) continue;
      const y = yOf(i * u.d, c);
      ctx.globalAlpha = alpha * a * .85; ctx.lineWidth = sp > 150 ? 3 : 2;
      ctx.beginPath(); ctx.moveTo(XR, y); ctx.lineTo(XR + len, y); ctx.stroke();
      if (labels && la > 0) { ctx.globalAlpha = Math.min(1, alpha * (c.falling ? 3 : 1)) * la * .7; ctx.font = font(500, 21, MONO); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(u.f(i), XR - 18, y); }
    }
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function landmark(c, years, label, alpha, shown) {
  const y = yOf(years * YR, c); if (y < 200 || y > H - 380) return;
  const a = alpha * clamp((y - 200) / 160) * clamp((H - 380 - y) / 160) * clamp(Math.abs(y - (YF - 70)) / 90 - 1.4);
  ctx.globalAlpha = a; ctx.strokeStyle = C.ivory; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(XR, y); ctx.lineTo(XR + 150, y); ctx.stroke();
  ctx.beginPath(); ctx.arc(XR, y, 7, 0, 7); ctx.fillStyle = C.ink; ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ivory; ctx.font = font(800, 44); ctx.fillText(label, XR + 170, y + 4);
  ctx.fillStyle = C.mist; ctx.font = font(500, 24, MONO); ctx.fillText(shown ?? `≈ −${nbsp(years)} ANS`, XR + 172, y + 42);
  ctx.globalAlpha = 1;
}
function marker(c, d, alpha) { const y = yOf(d, c); if (y < -30 || y > H + 30) return; ctx.globalAlpha = alpha; ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(XR, y, 9, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
function glowDot(x, y, r, a = 1) {
  const g = ctx.createRadialGradient(x, y, r * .5, x, y, r * 5.5); g.addColorStop(0, 'rgba(255,74,28,.55)'); g.addColorStop(1, 'rgba(255,74,28,0)');
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 5.5, 0, 7); ctx.fill();
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
}

/* ---------- typographie cinétique ---------- */
function kinetic(text, x, y, fnt, t, t0, o = {}) {
  const per = o.per ?? .028, dur = o.dur ?? .42, out = o.out ?? 1e9, col = o.color ?? C.ivory;
  if (t < t0) return 0;
  const eo = eIn(prog(t, out, .32)); if (eo >= 1) return 0;
  ctx.font = fnt; ctx.textBaseline = 'alphabetic'; LS(o.ls ?? '0px');
  let n = 0;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i]; if (ch === ' ') continue;
    const cx = x + ctx.measureText(text.slice(0, i)).width;
    const p = prog(t, t0 + n * per, dur), e = eBack(p); n++;
    if (p <= 0) continue;
    const cw = ctx.measureText(ch).width;
    ctx.save();
    ctx.globalAlpha = (o.alpha ?? 1) * clamp(p * 3) * (1 - eo);
    ctx.translate(cx + cw / 2, y + (1 - e) * (o.rise ?? 70) - eo * (260 + n * 14));
    ctx.scale(lerp(o.s0 ?? 1.25, 1, eOut(p)) * (1 - eo * .25), lerp(o.s0 ?? 1.25, 1, eOut(p)) * (1 + eo * 1.6));
    ctx.fillStyle = col; ctx.fillText(ch, -cw / 2, 0);
    ctx.restore();
  }
  const w = ctx.measureText(text).width; LS('0px'); ctx.globalAlpha = 1; return w;
}
function wipe(text, x, y, fnt, t, t0, o = {}) {
  if (t < t0) return; const out = o.out ?? 1e9, eo = eIn(prog(t, out, .28)); if (eo >= 1) return;
  ctx.font = fnt; LS(o.ls ?? '0px');
  const w = ctx.measureText(text).width, p = eOut5(prog(t, t0, .55)), sz = parseFloat(fnt.match(/(\d+(\.\d+)?)px/)[1]);
  ctx.save(); ctx.globalAlpha = (o.alpha ?? 1) * (1 - eo); ctx.translate(0, -eo * 120);
  ctx.beginPath(); ctx.rect(x - 4, y - sz * 1.1, (w + 8) * p, sz * 1.5); ctx.clip();
  ctx.fillStyle = o.color ?? C.ivory; ctx.fillText(text, x + (1 - p) * -24, y);
  ctx.restore();
  if (p < 1) { ctx.globalAlpha = 1 - p; ctx.fillStyle = C.red; ctx.fillRect(x + (w + 8) * p, y - sz * .95, 6, sz * 1.15); ctx.globalAlpha = 1; }
  LS('0px');
}
// grand chiffre : écrasement, écho vermillon, puis reflet lumineux qui le traverse
function slam(text, x, y, fnt, t, t0, o = {}) {
  if (t < t0) return; const out = o.out ?? 1e9, eo = eIn(prog(t, out, .3)); if (eo >= 1) return;
  const p = prog(t, t0, .38), e = eBack(p), s = lerp(1.9, 1, e), A = (o.alpha ?? 1);
  ctx.save(); ctx.font = fnt; LS(o.ls ?? '0px'); ctx.globalAlpha = A * clamp(p * 4) * (1 - eo);
  ctx.translate(x, y - eo * 300); ctx.scale(s * (1 - eo * .2), s * (1 + eo * 1.4));
  if (p < 1) { ctx.fillStyle = C.red; ctx.globalAlpha *= .8; ctx.fillText(text, (1 - p) * 26, 0); ctx.globalAlpha = A * clamp(p * 4); }
  ctx.fillStyle = o.color ?? C.ivory; ctx.fillText(text, 0, 0);
  const w = ctx.measureText(text).width; ctx.restore();
  const sp = prog(t, t0 + .34, .75);
  if (sp > 0 && sp < 1 && eo === 0) {
    const sz = parseFloat(fnt.match(/(\d+(\.\d+)?)px/)[1]);
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalCompositeOperation = 'source-over'; octx.clearRect(0, 0, W, H);
    octx.font = fnt; if ('letterSpacing' in octx) octx.letterSpacing = o.ls ?? '0px'; octx.fillStyle = '#fff'; octx.fillText(text, x, y);
    const bx = x - 160 + (w + 320) * eio(sp), g = octx.createLinearGradient(bx - 110, 0, bx + 110, sz * .5);
    g.addColorStop(0, 'rgba(255,74,28,0)'); g.addColorStop(.5, 'rgba(255,120,70,1)'); g.addColorStop(1, 'rgba(255,74,28,0)');
    octx.globalCompositeOperation = 'source-in'; octx.fillStyle = g; octx.fillRect(0, 0, W, H);
    ctx.globalAlpha = A * .9; ctx.drawImage(off, 0, 0);
  }
  LS('0px'); ctx.globalAlpha = 1;
}

/* ---------- logo ---------- */
function logo(cx, cy, size, p) {
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; ctx.strokeStyle = C.ivory;
  let y = cy - size * .52, s = size;
  for (let i = 0; i < 4; i++) {
    const q = eOut5(clamp(p * 4 - i * .75)); if (q > 0) {
      const hw = s * .5, hh = s * .46;
      ctx.globalAlpha = q; ctx.lineWidth = Math.max(3, s * .13);
      ctx.beginPath(); ctx.moveTo(cx - hw, y - (1 - q) * 80); ctx.lineTo(cx, y + hh - (1 - q) * 80); ctx.lineTo(cx + hw, y - (1 - q) * 80); ctx.stroke();
    }
    y += s * .40; s *= .58;
  }
  ctx.globalAlpha = 1;
}
function logoMini(cx, cy, size, col) {
  ctx.strokeStyle = col; ctx.lineJoin = 'miter'; let y = cy - size * .52, s = size;
  for (let i = 0; i < 3; i++) { ctx.lineWidth = Math.max(2, s * .13); ctx.beginPath(); ctx.moveTo(cx - s * .5, y); ctx.lineTo(cx, y + s * .46); ctx.lineTo(cx + s * .5, y); ctx.stroke(); y += s * .40; s *= .58; }
}
const logoDot = () => ({ x: 540, y: 700 + 300 * .62, r: 300 * .075 });

/* ---------- compteurs pendant la chute ---------- */
function depthText(F) {
  if (F < 1 / 24) return `−${Math.max(1, Math.round(F * 1440))} MIN`;
  if (F < 1) return `−${Math.round(F * 24)} H`;
  if (F < 60) return `−${Math.round(F)} J`;
  if (F < YR * 1.5) return `−${Math.round(F / MONTH)} MOIS`;
  const y = F / YR; return y < 2 ? '−2 ANS' : `−${nbsp(y < 1000 ? y : y < 1e5 ? Math.round(y / 10) * 10 : Math.round(y / 1e3) * 1e3)} ANS`;
}
function spentText(F) { const v = Math.max(20, F * 1000), m = Math.pow(10, Math.max(0, Math.floor(Math.log10(v)) - 2)); return nbsp(Math.round(v / m) * m) + ' €'; }

/* ---------- le billet de l'accroche ---------- */
const CARD = { x: 540, y: 815, w: 860, h: 330 };
function card(t) {
  const o0 = TL.fall1[0] - .12, eo = eIn(prog(t, o0, .32)); if (eo >= 1) return;
  const p = prog(t, -.14, .5), e = eBack(p);
  // billets dépensés : ils se détachent et s'envolent, de plus en plus vite
  let spent = 0;
  PEEL.forEach((tk, k) => {
    if (t < tk) return; spent++;
    const q = prog(t, tk, .6); if (q >= 1) return;
    ctx.save(); ctx.globalAlpha = (1 - q) * .85 * (1 - eo);
    ctx.translate(CARD.x + (k % 2 ? 1 : -1) * q * 90, CARD.y - eIn(q) * 1050 - q * 120); ctx.rotate((k % 2 ? 1 : -1) * q * .45);
    ctx.scale(1 - q * .25, Math.cos(q * Math.PI * 1.6) || .05);
    ctx.strokeStyle = q < .25 ? C.red : C.ivory; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 4;
    billShape(CARD.w, CARD.h, true); ctx.restore();
  });
  // le billet principal (rotation 3D à l'entrée)
  const kick = spent ? Math.exp(-(t - PEEL[spent - 1]) * 14) : 0;
  ctx.save(); ctx.globalAlpha = clamp(p * 4 + .35) * (1 - eo);
  ctx.translate(CARD.x, CARD.y - eo * 520 + kick * 10); ctx.scale(lerp(1.12, 1, e) * (1 - eo * .2), Math.max(.04, e) * (1 + eo * 1.3));
  ctx.fillStyle = 'rgba(20,20,28,.92)'; rr(ctx, -CARD.w / 2, -CARD.h / 2, CARD.w, CARD.h, 30); ctx.fill();
  ctx.strokeStyle = C.ivory; ctx.lineWidth = 5; ctx.stroke();
  ctx.globalAlpha *= .45; ctx.lineWidth = 2; rr(ctx, -CARD.w / 2 + 18, -CARD.h / 2 + 18, CARD.w - 36, CARD.h - 36, 16); ctx.stroke();
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(-CARD.w / 2 + 150, 0, 62 + i * 14, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = clamp(p * 4 + .35) * (1 - eo);
  logoMini(-CARD.w / 2 + 150, -4, 74, C.ivory); ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(-CARD.w / 2 + 150, 44, 7, 0, 7); ctx.fill();
  ctx.fillStyle = C.mist; ctx.font = font(500, 20, MONO); LS('3px'); ctx.fillText('VERTIGE · 1000', CARD.w / 2 - 232, -CARD.h / 2 + 52); ctx.fillText('N°02', -CARD.w / 2 + 40, CARD.h / 2 - 36); LS('0px');
  const fs = fit('1 000 €', 900, DISPLAY, 540, 190); ctx.font = font(900, fs); LS('-4px'); ctx.fillStyle = C.ivory; ctx.fillText('1 000 €', -CARD.w / 2 + 270, 62); LS('0px');
  ctx.restore();
  // compteur de jours
  if (spent) {
    ctx.globalAlpha = (1 - eo); ctx.textAlign = 'right'; ctx.font = font(700, 28, MONO); LS('3px');
    ctx.fillStyle = C.mist; ctx.fillText(`JOUR ${spent}`, 970, 602);
    ctx.fillStyle = C.red; ctx.fillText(`−${nbsp(spent * 1000)} €`, 970 - 190, 602);
    ctx.textAlign = 'left'; LS('0px'); ctx.globalAlpha = 1;
  }
}

/* ============================================================
   IMAGE
   ============================================================ */
function renderFrame(n) { draw(n / FPS); }
function draw(t) {
  const c = cam(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  let sx = 0, sy = 0, land = null;

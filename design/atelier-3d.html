<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MS MOBILE — Atelier 3D</title>
<meta name="theme-color" content="#07080b">
<style>
/* ============================================================
   Atelier 3D — poste de pilotage
   Fichier autonome : aucune dépendance, la scène 3D est rendue
   par un petit moteur logiciel sur canvas.
   ============================================================ */

:root {
  --bg: #07080b;
  --bg-deep: #05060a;
  --panel: rgba(17, 19, 26, .78);
  --panel-solid: #11131a;
  --card: rgba(28, 31, 41, .66);
  --card-hover: rgba(38, 42, 55, .78);
  --line: rgba(255, 255, 255, .07);
  --line-strong: rgba(255, 255, 255, .13);
  --ink: #f3f5f9;
  --ink-2: #99a1b3;
  --ink-3: #646d81;

  --blue: #3b82f6;
  --green: #10d18a;
  --purple: #a855f7;
  --orange: #f59e0b;
  --cyan: #22d3ee;

  --radius: 16px;
  --radius-sm: 12px;
  --font: "Outfit", "Poppins", "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 2px 6px rgba(0, 0, 0, .4), 0 18px 48px rgba(0, 0, 0, .55);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body::before {
  /* Halo d'ambiance : la lumière vient de la scène, pas de l'interface. */
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(900px 600px at 50% 78%, rgba(16, 209, 138, .10), transparent 62%),
    radial-gradient(700px 500px at 22% 18%, rgba(59, 130, 246, .08), transparent 60%),
    radial-gradient(700px 520px at 82% 24%, rgba(168, 85, 247, .07), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

h1, h2, h3 { margin: 0; letter-spacing: -.015em; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

/* -------------------- Ossature -------------------- */

.cockpit {
  position: relative;
  z-index: 1;
  height: 100%;
  display: grid;
  grid-template-columns: 312px minmax(0, 1fr) 348px;
  gap: 14px;
  padding: 14px;
}

.panel {
  background: var(--panel);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--line);
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.panel-head {
  padding: 20px 20px 14px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex: none;
}
.panel-head h2 { font-size: 1.32rem; letter-spacing: -.03em; }
.panel-head .sub { font-size: .82rem; color: var(--ink-3); margin-top: 3px; }

.scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; flex: 1; padding: 0 14px 14px; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .1); border-radius: 8px; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* -------------------- Sélecteur de services -------------------- */

.service {
  width: 100%;
  text-align: left;
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 14px;
  align-items: center;
  padding: 14px;
  margin-bottom: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.service:hover { background: var(--card-hover); transform: translateY(-1px); }
.service:focus-visible { outline: 2px solid var(--accent, var(--blue)); outline-offset: 2px; }
.service[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, transparent), transparent 62%),
    var(--card-hover);
}

.service-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
  color: var(--accent);
}
.service-icon svg { width: 24px; height: 24px; fill: currentColor; }

.service-body { min-width: 0; }
.service-name { display: block; font-weight: 600; font-size: 1.02rem; letter-spacing: -.01em; }
.service-desc {
  display: block;
  font-size: .82rem; color: var(--ink-3); margin: 1px 0 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pill {
  display: inline-block;
  font-size: .78rem; font-weight: 600;
  padding: 3px 11px; border-radius: 20px;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent);
}

/* -------------------- Performance atelier -------------------- */

.perf {
  flex: none;
  margin: 0 14px 14px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
}
.perf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.perf-head span:first-child { font-size: .88rem; color: var(--ink-2); }
.perf-delta { font-weight: 700; color: var(--green); font-size: .95rem; }
.track { height: 7px; border-radius: 8px; background: rgba(255, 255, 255, .08); margin: 12px 0 14px; overflow: hidden; }
.track i {
  display: block; height: 100%; border-radius: 8px;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  transition: width .9s cubic-bezier(.2, .8, .2, 1);
}
.perf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.perf-cell {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 10px; text-align: center; background: rgba(255, 255, 255, .02);
}
.perf-cell b { display: block; font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
.perf-cell span { font-size: .78rem; color: var(--ink-3); }

/* -------------------- Scène -------------------- */

.stage {
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 20%, #0c0f16 0%, var(--bg-deep) 70%);
  min-height: 0;
}
.stage-canvas { position: absolute; inset: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#scene:active { cursor: grabbing; }

.kpi-row {
  position: absolute; top: 16px; left: 16px; right: 16px;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
  pointer-events: none;
}
.kpi {
  background: rgba(13, 15, 21, .82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.kpi-label { font-size: .84rem; color: var(--ink-2); max-width: 8.5em; }
.kpi-chip {
  width: 34px; height: 34px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  color: var(--accent);
}
.kpi-chip svg { width: 17px; height: 17px; fill: currentColor; }
.kpi-value {
  font-size: 2.1rem; font-weight: 700; letter-spacing: -.035em; line-height: 1.15;
  margin-top: 10px; font-variant-numeric: tabular-nums;
}
.kpi-foot { font-size: .8rem; color: var(--ink-3); margin-top: 2px; }
.kpi-foot.up { color: var(--green); }

.workshop {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  width: min(560px, calc(100% - 36px));
  background: rgba(13, 15, 21, .86);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
.workshop h3 { display: flex; align-items: center; gap: 10px; font-size: 1.16rem; }
.live-dot {
  width: 13px; height: 13px; border-radius: 50%; background: var(--green); flex: none;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 22%, transparent);
  animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--green) 6%, transparent); } }
.workshop p { color: var(--ink-2); font-size: .9rem; margin: 10px 0 14px; }

.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 12px; font-size: .9rem; }
.bar-row:last-child { margin-bottom: 0; }
.bar-row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.bar-track { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar-track i { display: block; height: 100%; border-radius: 6px; background: var(--accent); transition: width .8s cubic-bezier(.2, .8, .2, 1); }

/* -------------------- Commandes -------------------- */

.live {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .78rem; font-weight: 600;
  padding: 5px 12px; border-radius: 20px;
  background: rgba(255, 255, 255, .06); border: 1px solid var(--line-strong); color: var(--ink-2);
}
.live::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green);
  animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: .25; } }

.order {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  padding: 15px 16px;
  margin-bottom: 11px;
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
  animation: rise .4s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.order:hover { background: var(--card-hover); border-color: var(--line-strong); transform: translateY(-1px); }
.order-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.order-ref { font-size: .84rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tag { font-size: .74rem; font-weight: 600; padding: 3px 11px; border-radius: 20px; white-space: nowrap; }
.tag-done { background: rgba(16, 209, 138, .14); color: var(--green); }
.tag-run { background: rgba(245, 158, 11, .15); color: var(--orange); }
.tag-diag { background: rgba(59, 130, 246, .16); color: #7dabff; }
.order-device { font-weight: 600; font-size: 1.04rem; letter-spacing: -.012em; margin-top: 10px; }
.order-what { color: var(--ink-2); font-size: .88rem; margin-top: 2px; }
.order-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
  font-size: .86rem; color: var(--ink-3);
}
.order-price { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

.panel-foot { flex: none; padding: 0 14px 14px; }
.btn-wide {
  width: 100%; padding: 14px; border-radius: var(--radius);
  background: rgba(255, 255, 255, .05); border: 1px solid var(--line-strong);
  font-weight: 600; letter-spacing: -.01em;
  transition: background .18s ease, transform .18s ease;
}
.btn-wide:hover { background: rgba(255, 255, 255, .1); transform: translateY(-1px); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* -------------------- Adaptation à la largeur -------------------- */

@media (max-width: 1400px) {
  .cockpit { grid-template-columns: 280px minmax(0, 1fr) 310px; }
  .kpi-value { font-size: 1.8rem; }
}

@media (max-width: 1180px) {
  html, body { overflow: auto; }
  .cockpit { grid-template-columns: 300px minmax(0, 1fr); height: auto; min-height: 100%; }
  .stage { min-height: 560px; }
  .panel-right { grid-column: 1 / -1; max-height: 560px; }
}

@media (max-width: 860px) {
  .cockpit { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px; }
  .panel-left, .panel-right { max-height: none; }
  /* Plus de superposition : chaque bloc prend sa place, la scène reste visible. */
  .stage {
    order: -1; min-height: 0; display: flex; flex-direction: column; gap: 12px;
    padding: 12px; background: none; border: none; border-radius: 0;
  }
  .stage-canvas {
    position: relative; inset: auto; height: 300px; border-radius: 18px;
    overflow: hidden; border: 1px solid var(--line);
    background: radial-gradient(120% 90% at 50% 20%, #0c0f16 0%, var(--bg-deep) 70%);
  }
  .kpi-row { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .workshop { position: static; transform: none; width: auto; }
  .scroll, .panel-head, .perf { overflow: visible; }
}

@media (max-width: 560px) {
  body { font-size: 14px; }
  .kpi-row { top: 12px; left: 12px; right: 12px; gap: 8px; }
  .kpi { padding: 11px 12px; }
  .kpi-value { font-size: 1.5rem; margin-top: 6px; }
  .kpi-chip { width: 28px; height: 28px; border-radius: 9px; }
  .kpi-label { font-size: .76rem; }
  .kpi-foot { font-size: .72rem; }
  .stage-canvas { height: 260px; }
  .workshop { padding: 14px; }
  .workshop p { font-size: .84rem; }
  .service { grid-template-columns: 44px 1fr; gap: 11px; padding: 11px; }
  .service-icon { width: 44px; height: 44px; border-radius: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .live-dot, .live::before { animation: none; }
  .order { animation: none; }
}
</style>
</head>

    { ref: '#TC-2849', status: 'Diagnostic', tag: 'diag', device: 'PlayStation 5',     what: 'Problème de surchauffe',   client: 'K. Martin',    price: '—',     service: 'ps' },
    { ref: '#TC-2850', status: 'En cours',   tag: 'run',  device: 'Xbox Series X',     what: 'Lecteur disque bloqué',    client: 'A. Rossi',     price: '149 €', service: 'xbox' },
    { ref: '#TC-2851', status: 'Terminé',    tag: 'done', device: 'iPhone 13',         what: 'Connecteur de charge',     client: 'S. Bernard',   price: '89 €',  service: 'phone' },
    { ref: '#TC-2852', status: 'Diagnostic', tag: 'diag', device: 'Dell XPS 15',       what: 'Ne démarre plus',          client: 'Ent. Colibri', price: '—',     service: 'pc' },
  ];

  const $ = (sel) => document.querySelector(sel);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let selected = null;

  /* ============================================================
     Interface
     ============================================================ */

  function renderServices() {

      '<button type="button" class="service" data-service="' + s.id + '" aria-pressed="false" style="--accent:' + s.accent + '">'

  function renderKpis() {

  function renderBars(active) {

      return '<div class="bar-row" style="--accent:' + r.accent + '">'

  function renderOrders(filter) {
    const list = filter ? ORDERS.filter((o) => o.service === filter) : ORDERS;
    const shown = list.length ? list : ORDERS;

  /** Compteurs qui montent : les chiffres s'installent au lieu d'apparaître. */
  function countUp() {
    document.querySelectorAll('[data-count]').forEach((el) => {
      const target = parseFloat(el.dataset.count);
      const suffix = el.dataset.suffix || '';
      const decimals = String(target).includes('.') ? 1 : 0;
      if (reduced) { el.textContent = format(target, decimals) + suffix; return; }
      const started = performance.now();
      const duration = 1100;
      const step = (now) => {
        const t = Math.min(1, (now - started) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = format(target * eased, decimals) + suffix;
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  function format(n, decimals) {
    const value = decimals ? n.toFixed(1).replace('.', ',') : Math.round(n).toString();
    return decimals ? value : value.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function selectService(id) {
    selected = selected === id ? null : id;
    document.querySelectorAll('[data-service]').forEach((el) => {
      el.setAttribute('aria-pressed', String(el.dataset.service === selected));
    });
    const service = SERVICES.find((s) => s.id === selected);
    $('#workshop-text').textContent = service
      ? 'Caméra focalisée sur « ' + service.name + ' » : ' + service.open + ' appareils en cours. Cliquez de nouveau pour revenir à la vue d’ensemble.'
      : 'Visualisez vos appareils en cours de réparation. Cliquez sur un service pour focaliser la caméra 3D.';
    renderBars(selected === 'xbox' ? 'ps' : selected);
    renderOrders(selected);
    focusCamera();
  }

  /* ============================================================
     Scène 3D — moteur logiciel, sans dépendance.
     Projection perspective, tri des faces par profondeur,
     éclairage plat, brouillard au loin.
     ============================================================ */

  const canvas = $('#scene');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  const cam = {
    yaw: -0.55, pitch: 0.34, dist: 12.2, height: 1.25,
    targetYaw: -0.55, targetPitch: 0.34, targetDist: 12.2, targetHeight: 1.25,
    px: 0, pz: 0, targetPx: 0, targetPz: 0,
    drag: null, mouseX: 0, mouseY: 0,
  };

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /** Monde -> écran. Renvoie null derrière la caméra. */
  function project(p) {
    const x = p.x - cam.px, y = p.y - cam.height, z = p.z - cam.pz;
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const rx = x * cy - z * sy;
    const rz = x * sy + z * cy;
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const ry = y * cp - rz * sp;
    const depth = y * sp + rz * cp + cam.dist;
    if (depth < 0.2) return null;
    const f = (H * 0.82) / depth;
    return { x: W / 2 + rx * f, y: H / 2 - ry * f, depth: depth, scale: f };
  }

  /* ---------- Construction des maillages ---------- */

  function box(cx, cy, cz, w, h, d, color, opts) {
    const o = opts || {};
    const hw = w / 2, hh = h / 2, hd = d / 2;
    const corners = [
      [-hw, -hh, -hd], [hw, -hh, -hd], [hw, hh, -hd], [-hw, hh, -hd],
      [-hw, -hh, hd], [hw, -hh, hd], [hw, hh, hd], [-hw, hh, hd],
    ].map((c) => {
      let x = c[0], y = c[1], z = c[2];
      if (o.tilt) { // rotation autour de X, pour l'écran du portable
        const ct = Math.cos(o.tilt), st = Math.sin(o.tilt);
        const ny = y * ct - z * st, nz = y * st + z * ct;
        y = ny; z = nz;
      }
      if (o.spin) {
        const cs = Math.cos(o.spin), ss = Math.sin(o.spin);
        const nx = x * cs - z * ss, nz = x * ss + z * cs;
        x = nx; z = nz;
      }
      return { x: cx + x, y: cy + y, z: cz + z };
    });
    const quads = [
      [0, 1, 2, 3, [0, 0, -1]], [5, 4, 7, 6, [0, 0, 1]],
      [4, 0, 3, 7, [-1, 0, 0]], [1, 5, 6, 2, [1, 0, 0]],
      [3, 2, 6, 7, [0, 1, 0]], [4, 5, 1, 0, [0, -1, 0]],
    ];
    return quads.map((q, i) => ({
      pts: [corners[q[0]], corners[q[1]], corners[q[2]], corners[q[3]]],
      normal: rotateNormal(q[4], o),
      color: (o.faceColors && o.faceColors[i]) || color,
      glow: o.glowFaces && o.glowFaces.indexOf(i) > -1 ? (o.glowColor || color) : null,
    }));
  }

  function rotateNormal(n, o) {
    let x = n[0], y = n[1], z = n[2];
    if (o.tilt) { const c = Math.cos(o.tilt), s = Math.sin(o.tilt); const ny = y * c - z * s, nz = y * s + z * c; y = ny; z = nz; }
    if (o.spin) { const c = Math.cos(o.spin), s = Math.sin(o.spin); const nx = x * c - z * s, nz = x * s + z * c; x = nx; z = nz; }
    return { x: x, y: y, z: z };
  }

  /** Disque horizontal : sert aux aérations et aux platines lumineuses. */
  function disc(cx, cy, cz, radius, color, opts) {
    const o = opts || {};
    const pts = [];
    for (let a = 0; a < Math.PI * 2 - 0.001; a += Math.PI / 14) {
      pts.push({ x: cx + Math.cos(a) * radius, y: cy, z: cz + Math.sin(a) * radius });
    }
    // `decal` : le disque repose sur une face. Sans biais de profondeur, le tri
    // le renverrait derrière elle et il disparaîtrait.
    return [{ pts: pts, normal: { x: 0, y: 1, z: 0 }, color: color, glow: o.glow || null, noCull: true, decal: true }];
  }

  /** Un appareil par service, posé sur le cercle de l'atelier. */
  const RADIUS = 4.15;

  function devicePosition(service, t) {
    const angle = service.angle + t * 0.1;
    return { angle: angle, x: Math.cos(angle) * RADIUS, z: Math.sin(angle) * RADIUS };
  }

  function buildDevice(service, t) {
    const pos = devicePosition(service, t);
    const angle = pos.angle;
    const cx = pos.x;
    const cz = pos.z;
    const lifted = selected === service.id;
    const bob = reduced ? 0 : Math.sin(t * 1.1 + service.angle) * 0.07;
    const cy = 1.15 + bob + (lifted ? 0.5 : 0);
    // En focus, l'appareil se présente de trois-quarts et s'y tient : une
    // rotation continue le fige parfois de profil, où il ne se lit plus.
    const spin = -angle + Math.PI / 2 + (lifted ? 0.58 : 0);
    const faces = [];
    const A = service.accent;

    if (service.id === 'phone') {
      // Corps sombre, écran allumé, bloc caméra en relief.
      faces.push.apply(faces, box(cx, cy, cz, 1.06, 2.08, 0.15, '#39414f',
        { spin: spin, glowFaces: [0, 1], glowColor: A, faceColors: { 0: '#0f2a57', 1: '#0f2a57' } }));
      faces.push.apply(faces, box(cx - Math.sin(spin) * 0.10, cy + 0.66, cz - Math.cos(spin) * 0.10,
        0.40, 0.40, 0.07, '#2a3140', { spin: spin }));
    } else if (service.id === 'pc') {
      // Base, charnière, écran incliné vers l'arrière.
      faces.push.apply(faces, box(cx, cy - 0.62, cz, 2.5, 0.13, 1.72, '#414a59',
        { spin: spin, faceColors: { 4: '#4b5566' } }));
      const back = 0.79;
      faces.push.apply(faces, box(cx - Math.sin(spin) * back, cy + 0.22, cz - Math.cos(spin) * back,
        2.5, 1.62, 0.11, '#39414f',
        { spin: spin, tilt: -0.34, glowFaces: [0, 1], glowColor: A, faceColors: { 0: '#07352b', 1: '#07352b' } }));
    } else if (service.id === 'ps') {
      // Coeur noir encadré de deux panneaux blancs.
      faces.push.apply(faces, box(cx, cy, cz, 0.54, 2.22, 1.45, '#20242e',
        { spin: spin, glowFaces: [4], glowColor: A }));
      [-0.45, 0.45].forEach((side) => {
        faces.push.apply(faces, box(cx + Math.cos(spin) * side, cy + 0.06, cz - Math.sin(spin) * side,
          0.23, 2.32, 1.58, '#eceef4', { spin: spin, faceColors: { 5: '#b9bfcd' } }));
      });
    } else if (service.id === 'tablet') {
      faces.push.apply(faces, box(cx, cy, cz, 1.38, 1.94, 0.12, '#3d4553',
        { spin: spin, glowFaces: [0, 1], glowColor: A, faceColors: { 0: '#0b3a45', 1: '#0b3a45' } }));
    } else {
      // Tour sombre, aération circulaire verte sur le dessus.
      faces.push.apply(faces, box(cx, cy, cz, 1.05, 1.96, 1.05, '#2b313d',
        { spin: spin, faceColors: { 4: '#353c49' } }));
      faces.push.apply(faces, disc(cx, cy + 1.01, cz, 0.38, '#2e3d1c', { glow: A }));
    }
    return { faces: faces, cx: cx, cz: cz, accent: A, lifted: lifted };
  }

  /* ---------- Dessin ---------- */

  function shade(hex, amount) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, ((n >> 16) & 255) * amount));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 255) * amount));
    const b = Math.max(0, Math.min(255, (n & 255) * amount));
    return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
  }

  const LIGHT = { x: -0.42, y: 0.82, z: -0.38 };

  const ARENA = 7.4;

  function drawGrid() {
    const STEP = 1.2;
    ctx.lineWidth = 1;
    for (let i = -ARENA; i <= ARENA + 0.01; i += STEP) {
      for (let axis = 0; axis < 2; axis++) {
        // La ligne est découpée et bornée au disque : le sol est une arène,
        // pas une grille qui fuit vers un horizon confus.
        const span = Math.sqrt(Math.max(0, ARENA * ARENA - i * i));
        if (span < 0.2) continue;
        let started = false;
        ctx.beginPath();
        for (let u = -span; u <= span + 0.01; u += 0.6) {
          const p = project(axis ? { x: i, y: 0, z: u } : { x: u, y: 0, z: i });
          if (!p) { started = false; continue; }
          if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
        }
        const fade = 1 - Math.abs(i) / (ARENA * 1.1);
        ctx.strokeStyle = 'rgba(130,170,215,' + (0.05 + fade * 0.13).toFixed(3) + ')';
        ctx.stroke();
      }
    }
    // Cercle de l'atelier et bord de l'arène.
    [[3.9, 'rgba(160,200,240,.24)', 1.3], [ARENA, 'rgba(120,160,200,.13)', 1]].forEach((ring) => {
      ctx.strokeStyle = ring[1];
      ctx.lineWidth = ring[2];
      ctx.beginPath();
      let first = true;
      for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.07) {
        const p = project({ x: Math.cos(a) * ring[0], y: 0.01, z: Math.sin(a) * ring[0] });
        if (!p) continue;
        if (first) { ctx.moveTo(p.x, p.y); first = false; } else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    });
  }

  function drawGlow(x, y, radius, color, strength) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, hexToRgba(color, strength));
    g.addColorStop(0.45, hexToRgba(color, strength * 0.28));
    g.addColorStop(1, hexToRgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function hexToRgba(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  let t0 = performance.now();

  function frame(now) {
    const t = (now - t0) / 1000;
    resizeIfNeeded();

    // Caméra : approche douce de la cible, plus une légère parallaxe à la souris.
    trackCamera(reduced ? 0 : t);
    cam.px += (cam.targetPx - cam.px) * 0.06;
    cam.pz += (cam.targetPz - cam.pz) * 0.06;
    cam.yaw += (cam.targetYaw + cam.mouseX * 0.12 - cam.yaw) * 0.07;
    cam.pitch += (cam.targetPitch + cam.mouseY * 0.05 - cam.pitch) * 0.07;
    cam.dist += (cam.targetDist - cam.dist) * 0.07;
    cam.height += (cam.targetHeight - cam.height) * 0.07;
    if (!cam.drag && !selected && !reduced) cam.targetYaw -= 0.0012;

    ctx.clearRect(0, 0, W, H);

    // Halo central posé au sol
    const centre = project({ x: 0, y: 0, z: 0 });
    if (centre) drawGlow(centre.x, centre.y, Math.max(190, centre.scale * 3.4), '#10d18a', 0.30);

    drawGrid();

    // Halos sous chaque appareil, puis les faces triées par profondeur.
    const devices = SERVICES.map((s) => buildDevice(s, reduced ? 0 : t));
    devices.forEach((d) => {
      const foot = project({ x: d.cx, y: 0.02, z: d.cz });
      if (!foot) return;
      // Ombre portée d'abord, puis le halo coloré : l'appareil se pose sur le sol.
      ctx.fillStyle = 'rgba(0,0,0,.42)';
      ctx.beginPath();
      ctx.ellipse(foot.x, foot.y, foot.scale * 0.5, foot.scale * 0.19, 0, 0, Math.PI * 2);
      ctx.fill();
      if (selected && !d.lifted) return;
      const strength = selected ? 0.38 : 0.3;
      drawGlow(foot.x, foot.y, Math.max(90, foot.scale * (d.lifted ? 1.9 : 1.25)), d.accent, strength);
    });

    const faces = [];
    devices.forEach((d) => {
      if (selected && !d.lifted) return;
      d.faces.forEach((f) => {
        const pts = f.pts.map(project);
        if (pts.some((p) => p === null)) return;
        let depth = 0;
        for (let i = 0; i < pts.length; i++) depth += pts[i].depth;
        depth /= pts.length;
        if (f.decal) depth -= 0.4;
        // Faces arrière ignorées : aire signée à l'écran.
        if (!f.noCull) {
          const area = (pts[1].x - pts[0].x) * (pts[2].y - pts[0].y) - (pts[2].x - pts[0].x) * (pts[1].y - pts[0].y);
          if (area <= 0) return;
        }
        faces.push({ pts: pts, depth: depth, face: f, dim: selected ? 1.2 : 1 });
      });
    });
    faces.sort((a, b) => b.depth - a.depth);

    faces.forEach((item) => {
      const f = item.face;
      const n = f.normal;
      const lambert = Math.max(0, n.x * LIGHT.x + n.y * LIGHT.y + n.z * LIGHT.z);
      const fog = Math.max(0.45, Math.min(1, 1.35 - item.depth / 26));
      const light = (0.5 + lambert * 0.72) * fog * item.dim;

      ctx.beginPath();
      ctx.moveTo(item.pts[0].x, item.pts[0].y);
      for (let i = 1; i < item.pts.length; i++) ctx.lineTo(item.pts[i].x, item.pts[i].y);
      ctx.closePath();
      ctx.fillStyle = shade(f.color, light);
      ctx.fill();

      if (f.glow) {
        ctx.fillStyle = hexToRgba(f.glow, (0.3 + lambert * 0.22) * Math.min(1, item.dim));
        ctx.fill();
        ctx.strokeStyle = hexToRgba(f.glow, 0.55);
        ctx.lineWidth = 1.1;
        ctx.stroke();
      } else {
        // Liseré clair sur les faces tournées vers la lumière : les arêtes se lisent.
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.05 + lambert * 0.16).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    });

    // Poussière lumineuse : quelques points qui flottent.
    for (let i = 0; i < 26; i++) {
      const a = i * 1.7 + t * 0.05;
      const p = project({
        x: Math.cos(a) * (2 + (i % 7)),
        y: 0.6 + ((i * 37) % 100) / 30,
        z: Math.sin(a * 1.3) * (2 + (i % 5)),
      });
      if (!p) continue;
      ctx.fillStyle = 'rgba(200,225,255,' + (0.05 + ((i % 4) * 0.03)) + ')';
      ctx.fillRect(p.x, p.y, 1.6, 1.6);
    }

    requestAnimationFrame(frame);
  }

  let lastW = 0, lastH = 0;
  function resizeIfNeeded() {
    const rect = canvas.getBoundingClientRect();
    if (Math.round(rect.width) !== lastW || Math.round(rect.height) !== lastH) {
      lastW = Math.round(rect.width);
      lastH = Math.round(rect.height);
      resize();
    }
  }

  /**
   * Focalisation : le pivot de la caméra rejoint l'appareil, l'angle de vue
   * est conservé. Recalculé à chaque image, car les appareils tournent.
   */
  function trackCamera(t) {
    const service = SERVICES.find((x) => x.id === selected);
    if (!service) {
      cam.targetPx = 0;
      cam.targetPz = 0;
      cam.targetPitch = 0.34;
      cam.targetDist = 12.2;
      cam.targetHeight = 1.25;
      return;
    }
    const pos = devicePosition(service, t);
    cam.targetPx = pos.x;
    cam.targetPz = pos.z;
    cam.targetPitch = 0.33;
    cam.targetDist = 6.9;
    cam.targetHeight = 1.5;
  }

  function focusCamera() { /* le suivi se fait dans la boucle de rendu */ }

  /* ---------- Manipulation directe ---------- */

  canvas.addEventListener('pointerdown', (e) => {
    cam.drag = { x: e.clientX, y: e.clientY, yaw: cam.targetYaw, pitch: cam.targetPitch };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    cam.mouseX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
    cam.mouseY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
    if (!cam.drag) return;
    cam.targetYaw = cam.drag.yaw - (e.clientX - cam.drag.x) * 0.006;
    cam.targetPitch = Math.max(-0.15, Math.min(1.0, cam.drag.pitch + (e.clientY - cam.drag.y) * 0.004));
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => {
    canvas.addEventListener(ev, () => { cam.drag = null; cam.mouseX = 0; cam.mouseY = 0; });
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.targetDist = Math.max(5, Math.min(20, cam.targetDist + e.deltaY * 0.01));
  }, { passive: false });

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-service]');
    if (btn) selectService(btn.dataset.service);
  });

  /* ---------- Démarrage ---------- */

  renderServices();
  renderKpis();
  renderBars(null);
  renderOrders(null);
  countUp();
  requestAnimationFrame(() => { $('#perf-bar').style.width = '78%'; });
  resize();
  requestAnimationFrame(frame);
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>

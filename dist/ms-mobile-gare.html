        + '<section class="finish-block"><h3>' + ui.icon('sms') + ' Prévenir le client</h3>'
        + '<label class="field wide"><span>Message</span><textarea id="sms-body" rows="3">' + esc(message) + '</textarea></label>'
        + '<label class="field"><span>Numéro</span><input id="sms-phone" value="' + esc(phone) + '" placeholder="06 12 34 56 78"></label>'
        + '<div class="row-btns"><button type="button" class="btn" data-act="sms">Ouvrir l’application SMS</button>'
        + '<button type="button" class="btn ghost" data-act="copy">Copier le message</button></div>'
        + '<p class="muted small">Dépend d’une application de messagerie sur l’appareil : sur un ordinateur sans relais de messages, l’envoi n’est pas possible. Le message reste copiable.</p>'
        + '</section>'

        + '<section class="finish-block"><h3>' + ui.icon('euro') + ' Encaisser le solde</h3>'
        + '<p class="lead">Reste à régler : <b>' + esc(ui.money(balance)) + '</b></p>'
        + (balance > 0
          ? '<div class="row-btns"><button type="button" class="btn primary" data-act="cash">Encaisser ' + esc(ui.money(balance)) + '</button></div>'
          : '<p class="muted">Rien à encaisser.</p>')
        + '</section>'

        + '<section class="finish-block"><h3>' + ui.icon('box') + ' Pièces</h3>'
        + (parts.length
          ? '<ul class="finish-parts">' + parts.map((p) =>
              '<li><span>' + esc(p.name) + ' ×' + I(p.qty, 1, 0) + '</span>'
              + (p.fromStock ? ui.badge('Décomptée', 'good') : ui.badge('Non décomptée', 'warn'))
              + (S(p.productId) ? '<button type="button" class="btn small ghost" data-toggle="' + esc(p.id) + '">'
                + (p.fromStock ? 'Remettre' : 'Décompter') + '</button>' : '') + '</li>').join('') + '</ul>'
          : '<p class="muted">Aucune pièce sur cette fiche.</p>')
        + (pending.length ? '<p class="warn-text">' + ui.icon('alert') + ' ' + pending.length
          + ' pièce(s) non décomptée(s) du stock.</p>' : '')
        + '</section>'

        + '<section class="finish-block"><h3>' + ui.icon('print') + ' Documents</h3>'
        + '<div class="row-btns"><button type="button" class="btn" data-act="ticket">Ticket de prise en charge</button>'
        + '<button type="button" class="btn" data-act="invoice">Facture</button></div></section>'
        + '</div>',
      footer: '<button type="button" class="btn ghost" data-close>Fermer</button>'
        + '<button type="button" class="btn primary" data-act="deliver">Marquer comme livré</button>',
    });
    if (!m) return;

    ui.on(m.el, '[data-act="sms"]', 'click', () => {
      const body = S(ui.$('#sms-body', m.el).value);
      const to = S(ui.$('#sms-phone', m.el).value).replace(/[^\d+]/g, '');
      if (!to) { ui.toast('Renseignez un numéro de téléphone.', 'info'); return; }
      const href = 'sms:' + to + '?&body=' + encodeURIComponent(body);
      try {
        window.location.href = href;
        store.log('SMS client', repair.number + ' — ' + to, 'sms');
        store.save({ reason: 'repairs', silent: true });
      } catch (e) {
        ui.toast("Aucune application de messagerie n’a pu être ouverte. Copiez le message.", 'error');
      }
    });
    ui.on(m.el, '[data-act="copy"]', 'click', async () => {
      const body = S(ui.$('#sms-body', m.el).value);
      try {
        await navigator.clipboard.writeText(body);
        ui.toast('Message copié.', 'success');
      } catch (e) {
        const ta = ui.$('#sms-body', m.el);
        ta.select();
        ui.toast('Copiez le message sélectionné (Ctrl+C).', 'info');
      }
    });
    ui.on(m.el, '[data-act="cash"]', 'click', () => { m.close(); openCash(ops.findRepair(repair.id)); });
    ui.on(m.el, '[data-toggle]', 'click', (e, el) => {
      const res = ops.togglePartStock(repair.id, el.dataset.toggle);
      if (!res.ok) { ui.toast(res.error, 'error'); return; }
      m.close();
      openFinish(ops.findRepair(repair.id));
      MS.app.render();
    });
    ui.on(m.el, '[data-act="ticket"]', 'click', () => MS.print.ticket(ops.findRepair(repair.id)));
    ui.on(m.el, '[data-act="invoice"]', 'click', () => MS.print.invoice(ops.findRepair(repair.id)));
    ui.on(m.el, '[data-act="deliver"]', 'click', () => {
      ops.setRepairStatus(repair.id, 'Livré', 'Appareil remis au client');
      m.close();
      ui.toast('Fiche marquée comme livrée.', 'success');
      MS.app.render();
    });
  }

  /* -------------------- Signature -------------------- */

  function openSignature(repair) {
    const m = ui.modal({
      title: 'Signature du client',
      body: '<p class="muted">Faites signer dans le cadre ci-dessous.</p>'
        + '<canvas id="sign-pad" class="sign-pad" width="600" height="220" aria-label="Zone de signature"></canvas>',
      footer: '<button type="button" class="btn ghost" data-act="clear">Effacer</button>'
        + '<button type="button" class="btn ghost" data-close>Annuler</button>'
        + '<button type="button" class="btn primary" data-act="ok">Enregistrer</button>',
    });
    if (!m) return;
    const canvas = ui.$('#sign-pad', m.el);
    const ctx = canvas.getContext('2d');
    let drawing = false, dirty = false;
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    const pos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches && e.touches[0] ? e.touches[0] : e;
      return { x: (src.clientX - rect.left) * (canvas.width / rect.width), y: (src.clientY - rect.top) * (canvas.height / rect.height) };
    };
    const start = (e) => { drawing = true; dirty = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
    const move = (e) => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
    const end = () => { drawing = false; };
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointerleave', end);
    ui.on(m.el, '[data-act="clear"]', 'click', () => { ctx.clearRect(0, 0, canvas.width, canvas.height); dirty = false; });
    ui.on(m.el, '[data-act="ok"]', 'click', () => {
      if (!dirty) { ui.toast('La zone de signature est vide.', 'info'); return; }
      let data = '';
      try { data = canvas.toDataURL('image/png'); } catch (e) { data = ''; }
      if (!data) { ui.toast("La signature n’a pas pu être enregistrée.", 'error'); return; }
      ops.updateRepair(repair.id, { signature: data });
      m.close();
      ui.toast('Signature enregistrée.', 'success');
      MS.app.render();
    });
  }

  MS.screens.repair = { render, openFinish, openCash, smsText };
})();

(function () {

    ui.$('#client-form', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit(); });

  /* -------------------- Données -------------------- */

  function dataHtml() {
    const backups = store.listBackups();

    const counts = model.countRecords(store.state);
    return '<section class="card"><h2>Données</h2>'
      + '<p class="muted">' + counts.products + ' article(s), ' + counts.clients + ' client(s), '
      + counts.repairs + ' réparation(s), ' + counts.cash + ' opération(s) de caisse.</p>'
      + '<div class="row-btns">'
      + '<button type="button" class="btn" data-act="export-json">' + ui.icon('download') + ' Export de sauvegarde</button>'

      + '<button type="button" class="btn" data-act="import">' + ui.icon('upload') + ' Import / restauration</button>'

      + (snap
        ? '<h3>Copie avant remplacement</h3><p class="muted">Prise le ' + esc(fmtDateTime(snap.date))
          + ' (' + esc(snap.reason) + ') — ' + I(O(snap.counts).repairs, 0, 0) + ' réparation(s).'
          + ' <button type="button" class="btn small" data-act="restore-snap">Restaurer cette copie</button></p>'

  /* -------------------- Interactions -------------------- */

  function bind(host) {
    const identity = ui.$('#identity-form', host);
    if (identity) identity.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(identity).entries());
      Object.assign(store.state.settings, model.normSettings(Object.assign({}, store.state.settings, data)));
      store.log('Paramètres modifiés', 'Identité de la boutique', 'settings');
      store.save({ reason: 'settings' });
      ui.toast('Identité enregistrée.', 'success');
      MS.app.render();
    });

    const docs = ui.$('#docs-form', host);
    if (docs) docs.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(docs).entries());
      store.state.settings.smsTemplate = S(data.smsTemplate);
      store.state.settings.cgv = S(data.cgv);
      store.log('Paramètres modifiés', 'Documents', 'settings');
      store.save({ reason: 'settings' });
      ui.toast('Documents enregistrés.', 'success');
      MS.app.render();
    });

    ui.on(host, '[data-act="pick-logo"]', 'click', () => ui.$('#logo-file', host).click());
    const logoFile = ui.$('#logo-file', host);
    if (logoFile) logoFile.addEventListener('change', () => {
      const file = logoFile.files && logoFile.files[0];
      if (!file) return;
      if (file.size > 400000) { ui.toast('Image trop lourde (400 Ko maximum).', 'error'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        store.state.settings.logo = S(reader.result);
        store.log('Logo modifié', '', 'settings');
        store.save({ reason: 'settings' });
        ui.toast('Logo enregistré.', 'success');
        MS.app.render();
      };
      reader.onerror = () => ui.toast("L’image n’a pas pu être lue.", 'error');
      reader.readAsDataURL(file);
    });
    ui.on(host, '[data-act="clear-logo"]', 'click', () => {
      store.state.settings.logo = '';
      store.save({ reason: 'settings' });
      MS.app.render();
    });

    ui.on(host, '[data-theme]', 'click', (e, el) => {
      store.state.settings.theme = el.dataset.theme === 'dark' ? 'dark' : 'light';
      store.save({ reason: 'settings' });
      MS.app.render();
    });

    const scope = ui.$('#auth-scope', host);
    if (scope) scope.addEventListener('change', () => {
      if (scope.value !== 'off' && !MS.auth.hasAccounts()) {
        ui.toast('Créez d’abord un compte : sans compte, la protection resterait inactive.', 'info', 6000);
        scope.value = 'off';
        return;
      }
      store.state.settings.authScope = scope.value;
      store.log('Protection modifiée', scope.options[scope.selectedIndex].text, 'shield');
      store.save({ reason: 'settings' });
      MS.app.render();
    });
    const lock = ui.$('#auth-lock', host);
    if (lock) lock.addEventListener('change', () => {
      store.state.settings.autolockMinutes = I(lock.value, 0, 0);
      store.save({ reason: 'settings' });
    });
    const attempts = ui.$('#auth-attempts', host);
    if (attempts) attempts.addEventListener('change', () => {
      store.state.settings.maxAttempts = I(attempts.value, 5, 1);
      store.save({ reason: 'settings' });
    });

    ui.on(host, '[data-act="add-account"]', 'click', openAccountForm);
    ui.on(host, '[data-act="passwd"]', 'click', (e, el) => openPasswordForm(el.closest('tr').dataset.account));
    ui.on(host, '[data-act="del-account"]', 'click', async (e, el) => {
      const id = el.closest('tr').dataset.account;
      const ok = await ui.confirm({ title: 'Supprimer le compte', danger: true, confirmLabel: 'Supprimer', message: 'Supprimer ce compte ?' });
      if (!ok) return;
      const res = MS.auth.removeAccount(id);
      if (!res.ok) { ui.toast(res.error, 'error'); return; }
      ui.toast('Compte supprimé.', 'success');
      MS.app.render();
    });
    ui.on(host, '[data-act="recovery"]', 'click', async () => {
      const key = await MS.auth.generateRecovery();
      ui.modal({
        title: 'Clé de secours',
        size: 'sm',
        body: '<p class="lead mono big">' + esc(key) + '</p>'
          + '<p class="muted">Notez cette clé maintenant : elle ne sera plus affichée. '
          + 'Elle permet de reprendre la main si tous les mots de passe sont perdus.</p>',
        footer: '<button type="button" class="btn primary" data-close>J’ai noté</button>',
      });
      MS.app.render();
    });

    const syncForm = ui.$('#sync-form', host);
    if (syncForm) syncForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(syncForm).entries());
      MS.sync.writeConfig(data);
      ui.toast('Configuration enregistrée.', 'success');
      MS.app.render();
    });
    ui.on(host, '[data-act="sync-in"]', 'click', () => MS.app.openSyncLogin());
    ui.on(host, '[data-act="sync-out"]', 'click', () => { MS.sync.signOut(); MS.app.render(); });

    ui.on(host, '[data-act="export-json"]', 'click', exportBackup);
    ui.on(host, '[data-act="import"]', 'click', () => ui.$('#import-file', host).click());
    const importFile = ui.$('#import-file', host);
    if (importFile) importFile.addEventListener('change', () => {
      const file = importFile.files && importFile.files[0];
      if (!file) return;
      MS.import.openFromFile(file);
      importFile.value = '';
    });
    ui.on(host, '[data-act="demo"]', 'click', async () => {
      const ok = await ui.confirm({
        title: 'Jeu de démonstration',
        message: 'Charger des données de démonstration ?',
        detail: 'Vos données actuelles seront remplacées. Une copie est mise de côté avant.',
        confirmLabel: 'Charger',
      });
      if (!ok) return;
      MS.demo.load();
      ui.toast('Jeu de démonstration chargé.', 'success');
      MS.app.go('dashboard');
      MS.app.render();
    });
    ui.on(host, '[data-act="erase"]', 'click', async () => {
      const ok = await ui.confirm({
        title: 'Effacement total', danger: true, confirmLabel: 'Tout effacer',
        message: 'Effacer toutes les données de cette boutique ?',
        detail: 'Articles, clients, réparations, caisse et grilles seront supprimés. Les paramètres de la boutique sont conservés. Une copie est mise de côté avant.',
      });
      if (!ok) return;
      store.eraseAll();
      ui.toast('Données effacées.', 'success');
      MS.app.render();
    });
    ui.on(host, '[data-restore]', 'click', async (e, el) => {
      const ok = await ui.confirm({
        title: 'Restaurer la sauvegarde',
        message: 'Remplacer les données actuelles par cette sauvegarde ?',
        detail: 'Une copie de l’état actuel est mise de côté avant le remplacement.',
        confirmLabel: 'Restaurer',
      });
      if (!ok) return;
      if (store.restoreBackup(el.dataset.restore)) {
        store.log('Sauvegarde restaurée', el.dataset.restore, 'refresh');
        store.save({ reason: 'restore' });
        ui.toast('Sauvegarde restaurée.', 'success');
      } else ui.toast('Cette sauvegarde est illisible.', 'error');
      MS.app.render();
    });
    ui.on(host, '[data-act="restore-snap"]', 'click', async () => {
      const ok = await ui.confirm({ title: 'Restaurer la copie', message: 'Revenir à la copie prise avant le dernier remplacement ?', confirmLabel: 'Restaurer' });
      if (!ok) return;
      store.restoreSnapshot();
      ui.toast('Copie restaurée.', 'success');
      MS.app.render();
    });
  }

  function openAccountForm() {
    const m = ui.modal({
      title: 'Nouveau compte',
      body: '<form id="account-form" class="form-grid">'
        + '<label class="field"><span>Identifiant *</span><input name="login" autocomplete="off" required autofocus></label>'
        + '<label class="field"><span>Nom affiché</span><input name="name" autocomplete="off"></label>'
        + '<label class="field"><span>Rôle</span><select name="role">' + ui.selectOptions(model.ROLES, 'Vendeur') + '</select></label>'
        + '<label class="field"><span>Mot de passe *</span><input name="password" type="password" autocomplete="new-password" required></label>'
        + '<p class="form-error wide" id="account-error" role="alert"></p></form>',
      footer: '<button type="button" class="btn ghost" data-close>Annuler</button>'
        + '<button type="button" class="btn primary" data-act="ok">Créer</button>',
    });
    if (!m) return;
    const submit = async () => {
      const data = Object.fromEntries(new FormData(ui.$('#account-form', m.el)).entries());
      const res = await MS.auth.addAccount(data);
      if (!res.ok) { ui.$('#account-error', m.el).textContent = res.error; return; }
      m.close();
      ui.toast('Compte créé.', 'success');
      MS.app.render();
    };
    ui.on(m.el, '[data-act="ok"]', 'click', submit);
    ui.$('#account-form', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  }

  function openPasswordForm(id) {
    const m = ui.modal({
      title: 'Changer le mot de passe',
      size: 'sm',
      body: '<form id="pwd-form"><label class="field"><span>Nouveau mot de passe</span>'
        + '<input name="password" type="password" autocomplete="new-password" autofocus></label>'
        + '<p class="form-error" id="pwd-error" role="alert"></p></form>',
      footer: '<button type="button" class="btn ghost" data-close>Annuler</button>'
        + '<button type="button" class="btn primary" data-act="ok">Enregistrer</button>',
    });
    if (!m) return;
    const submit = async () => {
      const data = Object.fromEntries(new FormData(ui.$('#pwd-form', m.el)).entries());
      const res = await MS.auth.setPassword(id, S(data.password));
      if (!res.ok) { ui.$('#pwd-error', m.el).textContent = res.error; return; }
      m.close();
      ui.toast('Mot de passe modifié.', 'success');
    };
    ui.on(m.el, '[data-act="ok"]', 'click', submit);
    ui.$('#pwd-form', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  }

  function exportBackup() {
    const payload = JSON.stringify(Object.assign({}, store.state, {
      _app: 'MS-MOBILE', _shop: MS.config.shopId, _exportedAt: new Date().toISOString(),
    }), null, 2);
    ui.download('ms-mobile-' + MS.config.shopId + '-' + dayKey(new Date()) + '.json', payload, 'application/json');
    store.log('Export de sauvegarde', dayKey(new Date()), 'download');
    store.save({ reason: 'export', silent: true });
  }

  MS.screens.settings = { render, exportBackup };
})();

/* ============================================================
   19 — Journal d'activité
   ============================================================ */
(function () {
  const MS = globalThis.MS;
  const { S, A, esc, fmtDateTime, norm } = MS.util;
  const ui = MS.ui, store = MS.store, model = MS.model;

  const view = { q: '' };

  function render(host) {
    const needle = norm(view.q);
    const logs = A(store.state.logs)
      .filter((l) => !needle || norm([l.action, l.detail, l.user].join(' ')).indexOf(needle) > -1)
      .slice(0, 300);

    host.innerHTML =
      '<section class="card filters"><div class="filter-row">'
      + '<label class="field grow"><span>Rechercher</span>'
      + '<input data-keep="log-q" id="log-q" value="' + esc(view.q) + '" placeholder="Action, détail, utilisateur…"></label>'
      + '<button type="button" class="btn small danger-ghost" data-act="purge">' + ui.icon('trash') + ' Purger le journal</button>'
      + '</div><p class="muted">Les 300 dernières actions sont affichées ; le journal en conserve ' + model.LOG_CAP + '.</p></section>'
      + (logs.length
        ? '<section class="card"><ul class="logs">' + logs.map((l) =>
            '<li><span class="log-icon">' + ui.icon(iconFor(l.icon)) + '</span>'
            + '<div class="log-body"><b>' + esc(l.action) + '</b>'
            + (l.detail ? '<span class="log-detail">' + esc(l.detail) + '</span>' : '') + '</div>'
            + '<span class="log-meta">' + esc(fmtDateTime(l.date)) + (l.user ? ' · ' + esc(l.user) : '') + '</span></li>').join('')
          + '</ul></section>'
        : '<section class="card">' + ui.empty('Le journal est vide.') + '</section>');

    const q = ui.$('#log-q', host);
    if (q) q.addEventListener('input', MS.util.debounce(() => { view.q = S(q.value); MS.app.render(); }, 200));
    ui.on(host, '[data-act="purge"]', 'click', async () => {
      const ok = await ui.confirm({
        title: 'Purger le journal', danger: true, confirmLabel: 'Purger',
        message: 'Effacer toutes les lignes du journal ?',
        detail: 'Les données métier ne sont pas touchées.',
      });
      if (!ok) return;
      store.state.logs = [];
      store.log('Journal purgé', '', 'trash');
      store.save({ reason: 'logs' });
      ui.toast('Journal purgé.', 'success');
      MS.app.render();
    });
  }

  function iconFor(name) {
    return ui.ICONS[S(name)] ? S(name) : 'dot';
  }

  MS.screens.logs = { render, view };
})();

    { key: 'invoiceNo', exact: ['facture', 'numerofacture', 'nofacture', 'invoice', 'invoiceno'], patterns: ['facture', 'invoice'] },
  ];

  /** Nom de champ aplati -> champ canonique, ou null. */
  function matchField(rawKey) {
    const f = flat(rawKey);
    if (!f) return null;
    for (const field of FIELDS) if (field.exact.includes(f)) return field.key;
    for (const field of FIELDS) {
      for (const p of field.patterns) if (f.indexOf(p) > -1) return field.key;
    }
    return null;
  }

  /**
   * Projette un enregistrement brut sur les champs canoniques.
   * Deux passes : les valeurs renseignees d'abord, puis les colonnes
   * presentes mais vides. Une colonne « montant » laissee vide doit rester
   * une operation de caisse sans montant, pas un enregistrement inconnu ;
   * mais elle ne doit pas non plus masquer un « total » renseigne a cote.
   */
  function mapRecord(raw, seenKeys) {
    const out = {};
    const record = O(raw);
    const keys = Object.keys(record);
    keys.forEach((key) => {
      if (seenKeys) seenKeys.add(S(key));
      const canonical = matchField(key);
      if (!canonical) return;
      const value = record[key];
      if (value === null || value === undefined || value === '') return;
      // Le premier champ reconnu gagne : les synonymes sont ordonnes du plus precis au plus vague.
      if (out[canonical] === undefined) out[canonical] = value;
    });
    keys.forEach((key) => {
      const canonical = matchField(key);
      if (canonical && out[canonical] === undefined) out[canonical] = '';
    });
    return out;
  }

  /* -------------------- Correspondance des valeurs -------------------- */

  const STATUS_MAP = [
    [['enattente', 'attente', 'recu', 'depose', 'nouveau', 'apriseencharge', 'encours'], 'En attente'],
    [['diagnostic', 'devis', 'endiagnostic', 'expertise', 'attentedevis', 'attenteaccord'], 'Diagnostic'],
    [['attentepieces', 'attentedepieces', 'commandepiece', 'commandepieces', 'piececommandee', 'attentepiece', 'attentefournisseur'], 'Attente pièces'],
    [['enreparation', 'encoursdereparation', 'encoursreparation', 'entravaux', 'atelier', 'reparationencours'], 'En réparation'],
    [['termine', 'pret', 'reparee', 'repare', 'fini', 'aretirer', 'pretaretirer', 'disponible', 'ok'], 'Terminé'],
    [['livre', 'rendu', 'recupere', 'remis', 'restitue', 'cloture', 'clos'], 'Livré'],
  ];

  const TYPE_MAP = [
    [['retrait', 'prelevement', 'sortie', 'sortiecaisse', 'retraitcaisse', 'depense'], 'Retrait'],
    [['vente', 'ventes', 'sale', 'venteproduit', 'ventecomptoir'], 'Vente'],
    [['reparation', 'sav', 'main', 'maindoeuvre', 'intervention'], 'Réparation'],
    [['accessoire', 'accessoires', 'access'], 'Accessoire'],
    [['diagnostic', 'devis', 'expertise'], 'Diagnostic'],
    [['service', 'prestation', 'forfait', 'divers'], 'Service'],
  ];

  const METHOD_CASH = ['especes', 'espece', 'liquide', 'cash', 'numeraire', 'especessonnantes'];

  function mapValue(value, table, fallback) {
    const f = flat(value);
    if (!f) return fallback;
    for (const [keys, target] of table) if (keys.includes(f)) return target;
    for (const [keys, target] of table) {
      for (const k of keys) if (f.indexOf(k) > -1 || k.indexOf(f) > -1) return target;
    }
    return fallback;
  }

  function mapStatus(value) { return mapValue(value, STATUS_MAP, model.REPAIR_STATUSES[0]); }
  function mapType(value) { return mapValue(value, TYPE_MAP, 'Vente'); }
  function mapMethod(value) {
    const f = flat(value);
    if (!f) return 'Espèces';
    if (METHOD_CASH.some((k) => f.indexOf(k) > -1)) return 'Espèces';
    // « CB », « virement », « cheque » : tout ce qui n'est pas especes est traite en carte.
    return 'Carte bancaire';
  }

  /* -------------------- Lecture des fichiers -------------------- */

  /** Analyse CSV : delimiteur devine, guillemets doubles geres. */
  function parseCsv(text) {
    const raw = S(text).replace(/^﻿/, '');
    if (!raw.trim()) return [];
    const firstLine = raw.split(/\r?\n/)[0] || '';
    const counts = { ';': (firstLine.match(/;/g) || []).length, ',': (firstLine.match(/,/g) || []).length, '\t': (firstLine.match(/\t/g) || []).length };
    const delim = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || ';';
    const rows = [];
    let row = [], cell = '', quoted = false;
    for (let i = 0; i < raw.length; i++) {
      const ch = raw[i];
      if (quoted) {
        if (ch === '"') {
          if (raw[i + 1] === '"') { cell += '"'; i++; }
          else quoted = false;
        } else cell += ch;
        continue;
      }
      if (ch === '"') { quoted = true; continue; }
      if (ch === delim) { row.push(cell); cell = ''; continue; }
      if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; continue; }
      if (ch === '\r') continue;
      cell += ch;
    }
    row.push(cell);
    if (row.length > 1 || S(row[0]).trim()) rows.push(row);
    if (rows.length < 2) return [];
    const headers = rows[0].map((h) => S(h).trim());
    return rows.slice(1)
      .filter((r) => r.some((c) => S(c).trim()))
      .map((r) => {
        const obj = {};
        headers.forEach((h, i) => { if (h) obj[h] = S(r[i]); });
        return obj;
      });
  }

  /** Detection automatique du type de fichier. */
  function detect(text, filename) {
    const raw = S(text).trim();
    if (raw.startsWith('{') || raw.startsWith('[')) {
      let parsed = null;
      try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
      if (parsed === null) return { kind: 'illisible', data: null };
      const o = O(parsed);
      const internal = S(o._app) === 'MS-MOBILE'
        || (Array.isArray(o.products) && Array.isArray(o.repairs) && Array.isArray(o.cash));
      return internal ? { kind: 'backup', data: parsed } : { kind: 'foreign', data: parsed };
    }
    const rows = parseCsv(raw);
    if (!rows.length) return { kind: 'illisible', data: null };
    return { kind: 'foreign', data: rows };
  }

  /* -------------------- Classement des enregistrements -------------------- */

  /** Devine le type d'un enregistrement d'apres les champs reconnus. */
  function guessKind(mapped, hintKey) {
    const hint = flat(hintKey);
    if (hint) {
      if (hint.indexOf('reparation') > -1 || hint.indexOf('fiche') > -1 || hint.indexOf('repair') > -1) return 'repair';
      if (hint.indexOf('caisse') > -1 || hint.indexOf('vente') > -1 || hint.indexOf('cash') > -1 || hint.indexOf('operation') > -1) return 'cash';
      if (hint.indexOf('stock') > -1 || hint.indexOf('produit') > -1 || hint.indexOf('article') > -1 || hint.indexOf('inventaire') > -1) return 'product';
      if (hint.indexOf('client') > -1 || hint.indexOf('customer') > -1) return 'client';
    }
    const m = O(mapped);
    if (m.device !== undefined || m.issue !== undefined || m.status !== undefined) return 'repair';
    if (m.qty !== undefined && (m.price !== undefined || m.ref !== undefined || m.supplier !== undefined || m.category !== undefined)) return 'product';
    if (m.amount !== undefined || m.method !== undefined || (m.type !== undefined && m.date !== undefined)) return 'cash';
    if (m.phone !== undefined || m.email !== undefined || m.clientName !== undefined) return 'client';
    if (m.name !== undefined && m.qty !== undefined) return 'product';
    return 'inconnu';
  }

  /** Aplati une structure quelconque en une liste de {record, hint}. */
  function collect(data) {
    const out = [];
    if (Array.isArray(data)) {
      data.forEach((r) => { if (r && typeof r === 'object' && !Array.isArray(r)) out.push({ record: r, hint: '' }); });
      return out;
    }
    const o = O(data);
    Object.keys(o).forEach((key) => {
      const value = o[key];
      if (Array.isArray(value)) {
        value.forEach((r) => { if (r && typeof r === 'object' && !Array.isArray(r)) out.push({ record: r, hint: key }); });
      } else if (value && typeof value === 'object') {
        Object.keys(value).forEach((k2) => {
          const r = value[k2];
          if (r && typeof r === 'object' && !Array.isArray(r)) out.push({ record: r, hint: key });
        });
      }
    });
    if (!out.length && Object.keys(o).length) out.push({ record: o, hint: '' });
    return out;
  }

  /* ---------------------------------------------------------
     Analyse complete : renvoie un rapport et l'etat a importer.
     Fonction pure : testable sans navigateur.
     --------------------------------------------------------- */

  function analyze(text, filename) {
    const detected = detect(text, filename);
    const report = {
      kind: detected.kind,
      filename: S(filename),
      counts: { products: 0, clients: 0, repairs: 0, cash: 0, sales: 0, pricing: 0 },
      cashTotal: 0,
      missingAmount: 0,
      badDates: 0,
      badDateSamples: [],
      unknownRecords: 0,
      fieldsSeen: [],
      mergedClients: 0,
      errors: [],
    };

    if (detected.kind === 'illisible') {
      report.errors.push("Le fichier n’est ni une sauvegarde interne, ni un tableau exploitable.");
      return { report, state: null };
    }

    if (detected.kind === 'backup') {
      const state = model.normState(detected.data);
      report.counts = model.countRecords(state);
      report.cashTotal = A(state.cash).reduce((s, op) => s + model.cashRevenue(op), 0);
      report.fieldsSeen = Object.keys(O(detected.data)).slice(0, 60);
      return { report, state };
    }

    // --- Export tiers ---
    const seen = new Set();
    const products = [], clients = [], repairs = [], cash = [];
    collect(detected.data).forEach((entry) => {
      const mapped = mapRecord(entry.record, seen);
      if (!Object.keys(mapped).length) { report.unknownRecords += 1; return; }
      const kind = guessKind(mapped, entry.hint);
      switch (kind) {
        case 'repair': repairs.push(mapped); break;
        case 'product': products.push(mapped); break;
        case 'cash': cash.push(mapped); break;
        case 'client': clients.push(mapped); break;
        default: report.unknownRecords += 1;
      }
    });

    const outProducts = products.map((m, i) => model.normProduct({
      id: uid('prd'), name: m.name || m.label, category: mapCategory(m.category), condition: m.condition,
      ref: m.ref, supplier: m.supplier, variant: m.variant, qty: m.qty, minQty: m.minQty,
      cost: m.cost, price: m.price, notes: m.notes, createdAt: readDate(m.date, report),
    }, i));

    const outClients = clients.map((m, i) => model.normClient({
      id: uid('cli'), name: m.clientName || m.name, phone: m.phone, email: m.email,
      address: m.address, notes: m.notes, createdAt: readDate(m.date, report),
    }, i));

    const outRepairs = repairs.map((m, i) => {
      const created = readDate(m.date, report);
      return model.normRepair({
        id: uid('rep'), number: S(m.number) || ('REP-' + String(i + 1).padStart(4, '0')),
        clientName: S(m.clientName) || S(m.name), clientPhone: S(m.phone),
        device: S(m.device), imei: S(m.imei), issue: S(m.issue), deviceState: S(m.deviceState),
        passcode: S(m.passcode), price: m.price, deposit: m.deposit,
        status: mapStatus(m.status), invoiceNo: S(m.invoiceNo), notes: S(m.notes),
        createdAt: created, updatedAt: created,
        history: [{ status: mapStatus(m.status), date: created, note: 'Importé' }],
      }, i);
    });

    const cashOwners = [];
    const outCash = cash.map((m) => {
      const type = mapType(m.type !== undefined ? m.type : m.label);
      if (m.amount === undefined || M(m.amount, 0) <= 0) report.missingAmount += 1;
      const op = model.normCash({
        id: uid('csh'), date: readDate(m.date, report), amount: m.amount,
        type, method: type === 'Retrait' ? model.WITHDRAW_METHOD : mapMethod(m.method),
        label: S(m.label) || S(m.name) || S(m.issue), items: [],
      });
      // Une operation qui nomme son client garde ce lien : rien ne se perd.
      const name = S(m.clientName).trim();
      const phone = S(m.phone).trim();
      if (name || phone) cashOwners.push({ op, name, phone });
      return op;
    });

    // Clients recrees depuis les fiches (et les operations qui les nomment),
    // doublons fusionnes par telephone.
    const merged = mergeClients(outClients, outRepairs, cashOwners);
    report.mergedClients = merged.mergedCount;

    const state = model.emptyState();
    state.products = outProducts;
    state.clients = merged.clients;
    state.repairs = merged.repairs;
    state.cash = outCash;
    state.counters.repair = outRepairs.length;

    report.counts = model.countRecords(state);
    report.cashTotal = Math.round(outCash.reduce((s, op) => s + model.cashRevenue(op), 0) * 100) / 100;
    report.fieldsSeen = Array.from(seen).sort();
    return { report, state };
  }

  function mapCategory(value) {
    const f = flat(value);
    if (!f) return model.DEFAULT_CATEGORY;
    const hit = model.CATEGORIES.find((c) => flat(c) === f);
    if (hit) return hit;
    const loose = model.CATEGORIES.find((c) => flat(c).indexOf(f) > -1 || f.indexOf(flat(c)) > -1);
    return loose || model.DEFAULT_CATEGORY;
  }

  /** Date illisible : comptee dans le rapport plutot que transformee en silence. */
  function readDate(value, report) {
    if (value === undefined || value === null || value === '') return new Date().toISOString();
    const iso = parseDateLoose(value);
    if (iso) return iso;
    if (report) {
      report.badDates += 1;
      if (report.badDateSamples.length < 8) report.badDateSamples.push(S(value).slice(0, 40));
    }
    return new Date().toISOString();
  }

  /** Fusionne les doublons par telephone et rattache fiches et operations. */
  function mergeClients(clients, repairs, cashOwners) {
    const byPhone = new Map();
    const byName = new Map();
    const out = [];
    let mergedCount = 0;

    const push = (client) => {
      const phone = digits(client.phone);
      const nameKey = flat(client.name);
      if (phone.length >= 6 && byPhone.has(phone)) { mergedCount += 1; return byPhone.get(phone); }
      if (phone.length < 6 && nameKey && byName.has(nameKey)) { mergedCount += 1; return byName.get(nameKey); }
      out.push(client);
      if (phone.length >= 6) byPhone.set(phone, client);
      if (nameKey) byName.set(nameKey, client);
      return client;
    };

    A(clients).forEach((c) => push(c));

    A(repairs).forEach((r) => {
      const name = S(r.clientName).trim();
      const phone = S(r.clientPhone).trim();
      if (!name && !phone) return;
      const existing = push(model.normClient({
        id: uid('cli'), name: name || ('Client ' + digits(phone).slice(-4)), phone, createdAt: r.createdAt,
      }, out.length));
      r.clientId = existing.id;
      if (!S(r.clientName)) r.clientName = existing.name;
      if (!S(r.clientPhone)) r.clientPhone = existing.phone;
      // Complete la fiche client avec ce que la reparation apporte.
      if (!S(existing.phone) && phone) existing.phone = phone;
    });

    A(cashOwners).forEach((entry) => {
      const owner = O(entry);
      const name = S(owner.name).trim();
      const phone = S(owner.phone).trim();
      if (!name && !phone) return;
      const client = push(model.normClient({
        id: uid('cli'), name: name || ('Client ' + digits(phone).slice(-4)), phone,
        createdAt: S(O(owner.op).date),
      }, out.length));
      if (owner.op) owner.op.clientId = client.id;
      if (!S(client.phone) && phone) client.phone = phone;
    });

    return { clients: out, repairs, mergedCount };
  }

  /* ---------------------------------------------------------
     Regle 6.1 — importer un stock n'efface jamais l'identite
     de la boutique. Un champ personnalise ici est conserve ;
     un champ reste au reglage d'usine prend la valeur qui arrive.
     --------------------------------------------------------- */

  const INSTALL_FIELDS = ['shopName', 'docName', 'address', 'phone', 'email', 'siret', 'vatRate',
    'currency', 'lowStock', 'warrantyMonths', 'smsTemplate', 'cgv', 'logo', 'theme'];

  function mergeSettings(current, incoming) {
    const cur = model.normSettings(current);
    const inc = model.normSettings(incoming);
    const factory = model.normSettings({});
    const out = Object.assign({}, cur);
    INSTALL_FIELDS.forEach((field) => {
      const isFactory = String(cur[field]) === String(factory[field]);
      const incomingHasValue = S(inc[field]) !== '' && String(inc[field]) !== String(factory[field]);
      if (isFactory && incomingHasValue) out[field] = inc[field];
    });
    // Les comptes et la protection appartiennent a l'installation : jamais ecrases par un import.
    out.accounts = cur.accounts;
    out.authScope = cur.authScope;
    out.autolockMinutes = cur.autolockMinutes;
    out.maxAttempts = cur.maxAttempts;
    out.recovery = cur.recovery;
    return model.normSettings(out);
  }

  /** Fusionne un etat importe dans l'etat courant (ajout). */
  function mergeInto(currentState, incomingState) {
    const cur = model.normState(currentState);
    const inc = model.normState(incomingState);
    const next = model.normState(cur);
    next.settings = mergeSettings(cur.settings, inc.settings);
    next.products = A(cur.products).concat(A(inc.products));
    next.cash = A(inc.cash).concat(A(cur.cash));
    next.sales = A(inc.sales).concat(A(cur.sales));
    next.repairs = A(inc.repairs).concat(A(cur.repairs));

    // Doublons de clients fusionnes par telephone, y compris avec l'existant.
    const merged = mergeClients(A(cur.clients).concat(A(inc.clients)), next.repairs);
    next.clients = merged.clients;

    if (A(inc.pricing.tabs).length) {
      next.pricing = model.normPricing({ tabs: A(cur.pricing.tabs).concat(A(inc.pricing.tabs)) });
    }
    return model.normState(next);
  }

  /* -------------------- Interface -------------------- */

  function openFromFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onerror = () => ui.toast("Le fichier n’a pas pu être lu.", 'error');
    reader.onload = () => {
      const text = S(reader.result);
      let result;
      try { result = analyze(text, S(file.name)); }
      catch (e) {
        ui.toast("Le fichier n’a pas pu être analysé : " + S(e.message), 'error');
        return;
      }
      openReport(result);
    };
    reader.readAsText(file, 'utf-8');
  }

  /** Rapport detaille avant validation : sans lui, un import a moitie rate passe inapercu. */
  function openReport(result) {
    const { report, state } = result;
    const isBackup = report.kind === 'backup';
    if (!state) {
      ui.modal({
        title: 'Import impossible', size: 'sm',
        body: '<p class="lead">Ce fichier ne peut pas être exploité.</p>'
          + '<ul class="report-errors">' + A(report.errors).map((e) => '<li>' + esc(e) + '</li>').join('') + '</ul>',
        footer: '<button type="button" class="btn primary" data-close>Fermer</button>',
      });
      return;
    }

    const body = '<p class="lead">' + (isBackup ? 'Sauvegarde interne MS-MOBILE' : 'Export d’un logiciel tiers') + '</p>'
      + '<p class="muted">' + esc(report.filename) + '</p>'
      + '<div class="grid stats-grid">'
      + ui.statCard('Articles', String(report.counts.products), '', 'neutral', 'box')
      + ui.statCard('Clients', String(report.counts.clients), report.mergedClients ? report.mergedClients + ' doublon(s) fusionné(s)' : '', 'neutral', 'users')
      + ui.statCard('Réparations', String(report.counts.repairs), '', 'neutral', 'wrench')
      + ui.statCard('Opérations de caisse', String(report.counts.cash), 'total ' + ui.money(report.cashTotal), 'primary', 'euro')
      + '</div>'
      + '<ul class="report-list">'
      + '<li>Montant total de caisse : <b>' + esc(ui.money(report.cashTotal)) + '</b></li>'
      + '<li>Opérations sans montant : <b>' + report.missingAmount + '</b></li>'
      + '<li>Dates illisibles : <b>' + report.badDates + '</b>'
      + (report.badDateSamples.length ? ' <span class="muted">(' + esc(report.badDateSamples.join(', ')) + ')</span>' : '') + '</li>'
      + '<li>Enregistrements non reconnus : <b>' + report.unknownRecords + '</b></li>'
      + '</ul>'
      + (report.fieldsSeen.length
        ? '<details class="report-fields"><summary>Noms de champs rencontrés (' + report.fieldsSeen.length + ')</summary>'
          + '<p class="mono small">' + esc(report.fieldsSeen.join(' · ')) + '</p></details>'
        : '')
      + '<p class="muted small">Une copie de vos données actuelles est mise de côté avant tout remplacement.</p>';

    const footer = '<button type="button" class="btn ghost" data-close>Annuler</button>'
      + (isBackup
        ? '<button type="button" class="btn primary" data-act="replace">Restaurer cette sauvegarde</button>'
        : '<button type="button" class="btn ghost" data-act="replace">Remplacer</button>'
          + '<button type="button" class="btn primary" data-act="merge">Ajouter aux données actuelles</button>');

    const m = ui.modal({ title: 'Rapport d’import', size: 'lg', body, footer });
    if (!m) return;
    ui.on(m.el, '[data-act="replace"]', 'click', () => apply(state, false, report, m));
    ui.on(m.el, '[data-act="merge"]', 'click', () => apply(state, true, report, m));
  }

  function apply(incoming, merge, report, m) {
    const next = merge ? mergeInto(store.state, incoming) : (() => {
      const st = model.normState(incoming);
      // Importer un stock ne doit jamais effacer le nom ou l'adresse de la boutique.
      st.settings = mergeSettings(store.state.settings, st.settings);
      return st;
    })();
    store.replaceState(next, { reason: 'import' });
    store.log('Import de données', S(report.filename) + ' — ' + report.counts.repairs + ' réparation(s), '
      + report.counts.cash + ' opération(s), ' + report.counts.products + ' article(s)', 'upload');
    store.save({ reason: 'import' });
    if (m) m.close();
    // Se placer sur une periode qui montre les donnees : « Jour » afficherait une caisse vide.
    if (MS.screens.cash && MS.screens.cash.showPeriod) MS.screens.cash.showPeriod('all');
    ui.toast('Import terminé.', 'success');
    MS.app.go('cash');
    MS.app.render();
  }

  MS.import = {
    analyze, detect, parseCsv, matchField, mapRecord, guessKind,
    mapStatus, mapType, mapMethod, mapCategory, mergeClients, mergeSettings, mergeInto,
    openFromFile, openReport, FIELDS,
  };
})();

/* ============================================================
   21 — Impression : ticket de prise en charge et facture
   Calibré pour le papier, pas pour l'écran.
   ============================================================ */
(function () {
  const MS = globalThis.MS;
  const { S, I, M, A, O, esc, fmtDate, fmtDateTime } = MS.util;
  const ui = MS.ui, store = MS.store, model = MS.model, ops = MS.ops;

  /** Le nom porté par les documents ne comporte pas le nom de ville. */
  function docName() {
    const s = O(store.state.settings);
    return S(s.docName) || S(MS.config.docName) || S(s.shopName) || S(MS.config.shopName);
  }

  function logoHtml() {
    const custom = S(O(store.state.settings).logo);
    if (custom) return '<img class="p-logo" src="' + esc(custom) + '" alt="">';
    return '<div class="p-logo p-logo-default" aria-hidden="true">' + esc(initials()) + '</div>';
  }

  function initials() {
    return S(docName()).split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || 'MS';
  }

  function headerHtml(title, reference, date) {
    const s = O(store.state.settings);
    return '<header class="p-head">'
      + '<div class="p-brand">' + logoHtml()
      + '<div class="p-ident"><h1>' + esc(docName()) + '</h1>'
      + '<p>' + esc(s.address) + '</p>'
      + '<p>' + [S(s.phone), S(s.email)].filter(Boolean).map(esc).join(' — ') + '</p>'
      + (s.siret ? '<p>SIRET ' + esc(s.siret) + '</p>' : '')
      + '</div></div>'
      + '<div class="p-doc"><h2>' + esc(title) + '</h2>'
      + '<p class="p-ref">' + esc(reference) + '</p>'
      + '<p class="p-date">' + esc(fmtDate(date)) + '</p></div>'
      + '</header>';
  }

  function footerHtml() {
    const s = O(store.state.settings);
    return '<footer class="p-foot"><p>' + esc(docName())
      + (s.siret ? ' — SIRET ' + esc(s.siret) : '')
      + (s.vatRate > 0 ? ' — TVA ' + esc(String(M(s.vatRate, 20))) + ' %' : '')
      + '</p><p>' + esc(s.address) + (s.phone ? ' — ' + esc(s.phone) : '') + '</p></footer>';
  }

  function fieldRow(label, value) {
    return '<div class="p-field"><span class="p-label">' + esc(label) + '</span>'
      + '<span class="p-value">' + esc(S(value) || '—') + '</span></div>';
  }

  function clientOf(repair) {
    const client = ops.findClient(repair.clientId);
    return {
      name: S(client ? client.name : repair.clientName) || 'Client de passage',
      phone: S(client ? client.phone : repair.clientPhone),
      email: S(O(client).email),
      address: S(O(client).address),
    };
  }

  /* -------------------- Ticket de prise en charge -------------------- */

  function ticketHtml(repair) {
    const s = O(store.state.settings);
    const client = clientOf(repair);
    const balance = model.repairBalance(repair);
    const cgv = S(s.cgv).replace(/\{garantie\}/gi, String(I(s.warrantyMonths, 3, 0)));
    return '<article class="p-page">'
      + headerHtml('Ticket de prise en charge', repair.number, repair.createdAt)
      + '<section class="p-cols">'
      + '<div class="p-box"><h3>Client</h3>'
      + fieldRow('Nom', client.name) + fieldRow('Téléphone', client.phone)
      + (client.email ? fieldRow('E-mail', client.email) : '')
      + (client.address ? fieldRow('Adresse', client.address) : '')
      + '</div>'
      + '<div class="p-box"><h3>Appareil</h3>'
      + fieldRow('Appareil', repair.device) + fieldRow('IMEI / n° de série', repair.imei)
      + fieldRow('Code de déverrouillage', repair.passcode ? '••••' : '—')
      + '</div></section>'
      + '<section class="p-box"><h3>Panne déclarée</h3><p class="p-text">' + esc(repair.issue || '—') + '</p></section>'
      + '<section class="p-box"><h3>État constaté à la réception</h3><p class="p-text">' + esc(repair.deviceState || 'Aucune remarque particulière.') + '</p></section>'
      + '<section class="p-amounts"><table class="p-table"><tbody>'
      + '<tr><th>Montant estimé</th><td class="p-num">' + esc(ui.money(repair.price)) + '</td></tr>'
      + '<tr><th>Acompte versé</th><td class="p-num">' + esc(ui.money(repair.deposit)) + '</td></tr>'
      + '<tr class="p-total"><th>Reste à régler</th><td class="p-num">' + esc(ui.money(balance)) + '</td></tr>'
      + '</tbody></table>'
      + '<p class="p-vat">' + (M(s.vatRate, 0) > 0
        ? 'Montants exprimés TTC — TVA ' + esc(String(M(s.vatRate, 20))) + ' %.'
        : 'TVA non applicable.') + '</p></section>'
      + '<section class="p-box p-cgv"><h3>Conditions de dépôt</h3><p class="p-text">' + esc(cgv) + '</p>'
      + '<p class="p-text"><b>Garantie : ' + I(s.warrantyMonths, 3, 0) + ' mois</b> sur la pièce remplacée.</p></section>'
      + '<section class="p-signs">'
      + '<div class="p-sign"><span>Signature du client</span>'
      + (repair.signature ? '<img class="p-sign-img" src="' + esc(repair.signature) + '" alt="">' : '<div class="p-sign-box"></div>')
      + '</div>'
      + '<div class="p-sign"><span>Cachet et signature du magasin</span><div class="p-sign-box"></div></div>'
      + '</section>'
      + footerHtml()
      + '</article>';
  }

  /* -------------------- Facture -------------------- */

  function invoiceHtml(repair) {
    const s = O(store.state.settings);
    const client = clientOf(repair);
    const lines = [];
    if (M(repair.price, 0) > 0) {
      lines.push({ label: 'Intervention — ' + S(repair.issue || repair.device), qty: 1, price: M(repair.price, 0) });
    }
    A(repair.parts).forEach((p) => lines.push({ label: 'Pièce — ' + S(p.name), qty: I(p.qty, 1, 0), price: M(p.price, 0) }));
    if (!lines.length) lines.push({ label: 'Intervention — ' + S(repair.device), qty: 1, price: 0 });
    const total = model.repairTotal(repair);
    const net = model.repairBalance(repair);
    return '<article class="p-page">'
      + headerHtml('Facture', S(repair.invoiceNo) || repair.number, repair.updatedAt)
      + '<section class="p-cols">'
      + '<div class="p-box"><h3>Client</h3>'
      + fieldRow('Nom', client.name) + fieldRow('Téléphone', client.phone)
      + (client.address ? fieldRow('Adresse', client.address) : '')
      + '</div>'
      + '<div class="p-box"><h3>Références</h3>'
      + fieldRow('Fiche', repair.number)
      + fieldRow('Appareil', repair.device)
      + fieldRow('IMEI', repair.imei)
      + fieldRow('Déposé le', fmtDate(repair.createdAt))
      + '</div></section>'
      + '<section><table class="p-table p-lines"><thead><tr>'
      + '<th>Désignation</th><th class="p-num">Qté</th><th class="p-num">P.U.</th><th class="p-num">Montant</th>'
      + '</tr></thead><tbody>'
      + lines.map((l) => '<tr><td>' + esc(l.label) + '</td><td class="p-num">' + l.qty + '</td>'
        + '<td class="p-num">' + esc(ui.money(l.price)) + '</td>'
        + '<td class="p-num">' + esc(ui.money(l.price * l.qty)) + '</td></tr>').join('')
      + '</tbody><tfoot>'
      + '<tr><th colspan="3">Total</th><td class="p-num">' + esc(ui.money(total)) + '</td></tr>'
      + '<tr><th colspan="3">Acompte déduit</th><td class="p-num">− ' + esc(ui.money(repair.deposit)) + '</td></tr>'
      + '<tr class="p-total"><th colspan="3">Net à payer</th><td class="p-num">' + esc(ui.money(net)) + '</td></tr>'
      + '</tfoot></table></section>'
      + '<section class="p-box"><p class="p-text">' + (M(s.vatRate, 0) > 0
        ? 'Montants exprimés TTC — TVA ' + esc(String(M(s.vatRate, 20))) + ' %.'
        : 'TVA non applicable.')
      + ' Garantie de <b>' + I(s.warrantyMonths, 3, 0) + ' mois</b> sur la pièce remplacée, hors casse, oxydation et mauvaise utilisation.</p></section>'
      + '<section class="p-signs">'
      + '<div class="p-sign"><span>Signature du client</span>'
      + (repair.signature ? '<img class="p-sign-img" src="' + esc(repair.signature) + '" alt="">' : '<div class="p-sign-box"></div>')
      + '</div>'
      + '<div class="p-sign"><span>Cachet et signature du magasin</span><div class="p-sign-box"></div></div>'
      + '</section>'
      + footerHtml()
      + '</article>';
  }

  /* -------------------- Lancement -------------------- */

  function ticket(repair) {
    if (!repair) { ui.toast('Fiche introuvable : rien à imprimer.', 'error'); return; }
    run(ticketHtml(repair), 'ticket');
  }

  function invoice(repair) {
    if (!repair) { ui.toast('Fiche introuvable : rien à imprimer.', 'error'); return; }
    // Numero de facture attribue a la premiere emission.
    if (!S(repair.invoiceNo)) {
      const { number, counter } = model.nextInvoiceNumber(store.state);
      repair.invoiceNo = number;
      store.state.counters.invoice = counter;
      store.log('Facture émise', repair.number + ' → ' + number, 'doc');
      store.save({ reason: 'repairs' });
    }
    run(invoiceHtml(repair), 'facture');
    MS.app.render();
  }

  /**
   * Attend le chargement des images et le calcul de la mise en page :
   * sans cela, les appareils lents produisent des pages blanches.
   */
  function run(html, kind) {
    const root = ui.$('#print-root');
    if (!root) { ui.toast("La zone d’impression est introuvable.", 'error'); return; }
    root.innerHTML = html;
    root.hidden = false;
    document.body.classList.add('printing');

    const images = Array.from(root.querySelectorAll('img'));
    const waits = images.map((img) => (img.complete && img.naturalWidth
      ? Promise.resolve()
      : new Promise((resolve) => {
          const done = () => resolve();
          img.addEventListener('load', done, { once: true });
          img.addEventListener('error', done, { once: true });
          setTimeout(done, 2500);
        })));

    Promise.all(waits).then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))))
      .then(() => {
        fitToPage(root);
        return new Promise((r) => requestAnimationFrame(r));
      })
      .then(() => {
        const cleanup = () => {
          document.body.classList.remove('printing');
          root.hidden = true;
          root.innerHTML = '';
          root.classList.remove('tight-1', 'tight-2', 'tight-3', 'measuring');
        };
        window.addEventListener('afterprint', cleanup, { once: true });
        setTimeout(() => { if (!root.hidden) cleanup(); }, 60000);
        try { window.print(); }
        catch (e) {
          cleanup();
          ui.toast("L’impression n’a pas pu démarrer sur cet appareil.", 'error');
        }
      });
  }

  /**
   * Une page chacun : si le document deborde, on resserre les espacements,
   * jamais les tailles de texte.
   */
  const PAGE_HEIGHT_PX = 1122; // A4 : 297 mm a 96 ppp
  const TIGHT_LEVELS = ['tight-1', 'tight-2', 'tight-3'];

  /**
   * Hauteur reellement occupee par le contenu. La page porte une hauteur
   * minimale d'une feuille A4 et pousse les signatures en bas : mesurer
   * telle quelle ferait croire que tout deborde, et resserrerait toujours.
   */
  function naturalHeight(root) {
    const host = root || (globalThis.document && document.getElementById('print-root'));
    const page = host && host.querySelector('.p-page');
    if (!page) return 0;
    const wasMeasuring = host.classList.contains('measuring');
    host.classList.add('measuring');
    const height = page.scrollHeight;
    if (!wasMeasuring) host.classList.remove('measuring');
    return height;
  }

  function fitToPage(root) {
    const page = root && root.querySelector('.p-page');
    if (!page) return '';
    root.classList.remove.apply(root.classList, TIGHT_LEVELS);
    root.classList.add('measuring');
    let applied = '';
    if (page.scrollHeight > PAGE_HEIGHT_PX) {
      for (let i = 0; i < TIGHT_LEVELS.length; i++) {
        root.classList.remove.apply(root.classList, TIGHT_LEVELS);
        root.classList.add(TIGHT_LEVELS[i]);
        applied = TIGHT_LEVELS[i];
        if (page.scrollHeight <= PAGE_HEIGHT_PX) break;
      }
    }
    root.classList.remove('measuring');
    return applied;
  }

  MS.print = { ticket, invoice, ticketHtml, invoiceHtml, docName, fitToPage, naturalHeight, PAGE_HEIGHT_PX, TIGHT_LEVELS };
})();

/* ============================================================
   99 — Amorçage
   ============================================================ */
(function () {
  const MS = globalThis.MS;
  function start() {
    try { MS.app.boot(); }
    catch (e) {
      console.error(e);
      const host = document.getElementById('screen');
      if (host) {
        host.innerHTML = '<div class="card"><h2>Démarrage impossible</h2>'
          + '<p class="muted">L’application n’a pas pu démarrer. Vos données restent enregistrées dans ce navigateur.</p></div>';
      }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

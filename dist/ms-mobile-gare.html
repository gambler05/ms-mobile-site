    el.innerHTML = icon(kind === 'error' ? 'alert' : kind === 'success' ? 'check' : 'dot') + '<span>' + esc(message) + '</span>';
    root.appendChild(el);
    const delay = I(ms, kind === 'error' ? 6000 : 3500, 800);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, delay);
  }

  /* -------------------- Modales -------------------- */

  let modalStack = [];

  function modal(opts) {
    const o = O(opts);
    const root = $('#modal-root');
    if (!root) return null;
    const id = uid('mod');
    const wrap = document.createElement('div');
    wrap.className = 'modal-back';
    wrap.dataset.modal = id;
    const size = S(o.size) || 'md';
    wrap.innerHTML =
      '<div class="modal modal-' + esc(size) + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title || 'Fenêtre') + '">'
      + '<header class="modal-head"><h2>' + esc(o.title || '') + '</h2>'
      + '<button type="button" class="icon-btn" data-close aria-label="Fermer">' + icon('x') + '</button></header>'
      + '<div class="modal-body">' + (S(o.body) || '') + '</div>'
      + (o.footer === false ? '' : '<footer class="modal-foot">' + (S(o.footer) || '') + '</footer>')
      + '</div>';
    root.appendChild(wrap);
    document.body.classList.add('modal-open');
    const close = () => {
      wrap.remove();
      modalStack = modalStack.filter((m) => m.id !== id);
      if (!modalStack.length) document.body.classList.remove('modal-open');
      if (typeof o.onClose === 'function') o.onClose();
    };
    modalStack.push({ id, close });
    on(wrap, '[data-close]', 'click', close);
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap && o.dismissible !== false) close(); });
    const api = { el: wrap, close, body: $('.modal-body', wrap), foot: $('.modal-foot', wrap) };
    if (typeof o.onOpen === 'function') o.onOpen(api);
    const focusable = wrap.querySelector('[autofocus], input, select, textarea, button:not([data-close])');
    if (focusable) setTimeout(() => { try { focusable.focus(); } catch (e) {} }, 30);
    return api;
  }

  function closeTopModal() {
    const top = modalStack[modalStack.length - 1];
    if (top) top.close();
  }

  function confirm(opts) {
    const o = O(opts);
    return new Promise((resolve) => {
      const m = modal({
        title: S(o.title) || 'Confirmer',
        size: 'sm',
        body: '<p class="lead">' + esc(o.message) + '</p>' + (o.detail ? '<p class="muted">' + esc(o.detail) + '</p>' : ''),
        footer: '<button type="button" class="btn ghost" data-no>' + esc(o.cancelLabel || 'Annuler') + '</button>'
          + '<button type="button" class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-yes>' + esc(o.confirmLabel || 'Confirmer') + '</button>',
        onClose: () => resolve(false),
      });
      if (!m) { resolve(false); return; }
      on(m.el, '[data-no]', 'click', () => m.close());
      on(m.el, '[data-yes]', 'click', () => { resolve(true); m.close(); });
    });
  }

  function prompt(opts) {
    const o = O(opts);
    return new Promise((resolve) => {
      const m = modal({
        title: S(o.title) || 'Saisie',
        size: 'sm',
        body: '<label class="field"><span>' + esc(o.label || '') + '</span>'
          + '<input type="' + esc(o.type || 'text') + '" id="prompt-input" value="' + esc(o.value || '') + '" autofocus></label>'
          + (o.help ? '<p class="muted">' + esc(o.help) + '</p>' : ''),
        footer: '<button type="button" class="btn ghost" data-no>Annuler</button>'
          + '<button type="button" class="btn primary" data-yes>' + esc(o.confirmLabel || 'Valider') + '</button>',
        onClose: () => resolve(null),
      });
      if (!m) { resolve(null); return; }
      const input = $('#prompt-input', m.el);
      const done = () => { const v = input ? input.value : ''; resolve(v); m.el.remove(); document.body.classList.remove('modal-open'); };
      on(m.el, '[data-no]', 'click', () => m.close());
      on(m.el, '[data-yes]', 'click', done);
      if (input) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); done(); } });
    });
  }

  /* -------------------- Telechargement -------------------- */

  function download(filename, content, mime) {
    try {
      const blob = new Blob([content], { type: S(mime) || 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = S(filename) || 'export.txt';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
      return true;
    } catch (e) {
      toast("Le téléchargement n’a pas pu démarrer.", 'error');
      return false;
    }
  }

  function exportCsv(filename, rows) {
    return download(filename, csvDoc(rows), 'text/csv;charset=utf-8');
  }

  /* -------------------- Fragments d'interface -------------------- */

  function money(v) { return fmtMoney(v, O(store.state.settings).currency); }

  function badge(text, kind) {
    return '<span class="badge badge-' + esc(kind || 'neutral') + '">' + esc(text) + '</span>';
  }

  function empty(message, action) {
    return '<div class="empty">' + icon('box') + '<p>' + esc(message) + '</p>' + (S(action) || '') + '</div>';
  }

  function statCard(label, value, hint, kind, iconName) {
    return '<div class="stat stat-' + esc(kind || 'neutral') + '">'
      + '<div class="stat-top"><span class="stat-label">' + esc(label) + '</span>'
      + (iconName ? '<span class="stat-chip">' + icon(iconName) + '</span>' : '') + '</div>'
      + '<strong class="stat-value">' + esc(value) + '</strong>'
      + (hint ? '<span class="stat-hint">' + esc(hint) + '</span>' : '') + '</div>';
  }

  function selectOptions(list, selected) {
    return A(list).map((v) => {
      const val = typeof v === 'object' ? S(O(v).value) : S(v);
      const lab = typeof v === 'object' ? S(O(v).label) : S(v);
      return '<option value="' + esc(val) + '"' + (String(val) === String(selected) ? ' selected' : '') + '>' + esc(lab) + '</option>';
    }).join('');
  }

  /**
   * Repli d'une ligne de tableau : le contenu des colonnes effacees
   * reapparait sous le nom. Chaque element porte la cle de sa colonne
   * pour n'apparaitre que lorsque cette colonne a disparu.
   */
  const FOLD_KEYS = {
    categorie: 'cat', prix: 'price', seuil: 'min', fournisseur: 'sup', ref: 'ref',
    etat: 'state', client: 'client', tel: 'phone', appareil: 'device', panne: 'issue',
    restedu: 'due', articles: 'items', mode: 'method', email: 'email', reparations: 'count',
  };

  function foldout(pairs) {
    const items = A(pairs).filter((p) => S(O(p).value)).map((p) => {
      const key = FOLD_KEYS[MS.util.flat(O(p).label)] || 'x';
      return '<span class="fold-item" data-k="' + esc(key) + '"><b>' + esc(O(p).label) + '</b> ' + esc(O(p).value) + '</span>';
    }).join('');
    return items ? '<div class="foldout">' + items + '</div>' : '';
  }

  MS.ui = {
    ICONS, icon, $, $$, on, toast, modal, closeTopModal, confirm, prompt,
    download, exportCsv, money, badge, empty, statCard, selectOptions, foldout,
    captureFocus, restoreFocus,
  };
})();

/* ===== 07-app.js ===== */
/* ============================================================
   07 — Coquille applicative : routage, navigation, garde d'acces
   ============================================================ */
(function () {
  const MS = globalThis.MS;
  const { S, A, O, esc } = MS.util;
  const store = MS.store;
  const ui = MS.ui;

  MS.screens = MS.screens || {};

  const NAV = [
    { section: 'Pilotage', items: [
      { id: 'dashboard', label: 'Tableau de bord', icon: 'dashboard', mobile: true },
      { id: 'cash', label: 'Caisse', icon: 'cash', mobile: true },
    ] },
    { section: 'Boutique', items: [
      { id: 'stock', label: 'Stock', icon: 'box', mobile: true },
      { id: 'alerts', label: 'Ruptures', icon: 'alert', mobile: false },
      { id: 'repairs', label: 'Réparations', icon: 'wrench', mobile: true },
      { id: 'clients', label: 'Clients', icon: 'users', mobile: false },
      { id: 'pricing', label: 'Grilles tarifaires', icon: 'tags', mobile: false },
    ] },
    { section: 'Gestion', items: [
      { id: 'settings', label: 'Paramètres', icon: 'settings', mobile: false },
      { id: 'logs', label: 'Journal', icon: 'list', mobile: false },
    ] },
  ];

  const ALL_ITEMS = NAV.reduce((acc, g) => acc.concat(g.items), []);
  const KNOWN = ALL_ITEMS.map((i) => i.id).concat(['repair', 'client']);

  const route = { screen: 'dashboard', param: '' };

  function parseHash(hash) {
    const raw = S(hash).replace(/^#\/?/, '').trim();
    const parts = raw.split('/').filter(Boolean);
    const screen = parts[0] || 'dashboard';
    if (!KNOWN.includes(screen)) return { screen: 'dashboard', param: '' };
    if ((screen === 'repair' || screen === 'client') && !parts[1]) {
      return { screen: screen === 'repair' ? 'repairs' : 'clients', param: '' };
    }
    return { screen, param: S(parts[1]) };
  }

  function go(path) {
    const next = '#/' + S(path).replace(/^#\/?/, '');
    if (location.hash === next) render();
    else location.hash = next;
  }

  function currentRoute() { return { screen: route.screen, param: route.param }; }

  /* -------------------- Navigation -------------------- */

  function navHtml() {
    const admin = MS.auth.isAdmin();
    return NAV.map((group) => {
      const items = group.items.filter((it) => admin || !MS.model.ADMIN_SCREENS.includes(it.id));
      if (!items.length) return '';
      return '<div class="nav-group"><span class="nav-section">' + esc(group.section) + '</span>'
        + items.map((it) => navLink(it)).join('') + '</div>';
    }).join('');
  }

  function navLink(item) {
    const active = route.screen === item.id
      || (item.id === 'repairs' && route.screen === 'repair')
      || (item.id === 'clients' && route.screen === 'client');
    const alerts = item.id === 'alerts' ? alertCount() : 0;
    return '<a class="nav-link' + (active ? ' active' : '') + '" href="#/' + esc(item.id) + '">'
      + ui.icon(item.icon) + '<span>' + esc(item.label) + '</span>'
      + (alerts ? '<em class="pill">' + alerts + '</em>' : '') + '</a>';
  }

  function alertCount() {
    const settings = O(store.state.settings);
    return A(store.state.products).filter((p) => MS.model.stockLevel(p, settings) !== 'ok').length;
  }

  function mobileBarHtml() {
    const admin = MS.auth.isAdmin();
    const items = ALL_ITEMS.filter((i) => i.mobile);
    const links = items.map((it) => {
      const active = route.screen === it.id
        || (it.id === 'repairs' && route.screen === 'repair');
      return '<a class="mob-link' + (active ? ' active' : '') + '" href="#/' + esc(it.id) + '">'
        + ui.icon(it.icon) + '<span>' + esc(it.label.split(' ')[0]) + '</span></a>';
    }).join('');
    const rest = ALL_ITEMS.filter((i) => !i.mobile && (admin || !MS.model.ADMIN_SCREENS.includes(i.id)));
    const more = '<button type="button" class="mob-link" data-more aria-haspopup="menu">'
      + ui.icon('menu') + '<span>Plus</span></button>';
    return links + (rest.length ? more : '');
  }

  function openMore() {
    const admin = MS.auth.isAdmin();
    const rest = ALL_ITEMS.filter((i) => !i.mobile && (admin || !MS.model.ADMIN_SCREENS.includes(i.id)));
    const m = ui.modal({
      title: 'Plus',
      size: 'sm',
      body: '<nav class="more-nav">' + rest.map((it) =>
        '<a class="more-link" href="#/' + esc(it.id) + '">' + ui.icon(it.icon) + '<span>' + esc(it.label) + '</span></a>').join('') + '</nav>',
      footer: false,
    });
    if (m) ui.on(m.el, '.more-link', 'click', () => m.close());
  }

  /* -------------------- Bandeaux permanents -------------------- */

  function bannersHtml() {
    const out = [];
    if (store.lastError) {
      out.push('<div class="banner banner-danger">' + ui.icon('alert')
        + '<span>' + esc(store.lastError) + '</span>'
        + '<a class="btn small" href="#/settings">Exporter une sauvegarde</a></div>');
    }
    // Un appareil non connecte travaille en solo sans que personne ne s'en apercoive.
    if (MS.sync.shouldWarn()) {
      out.push('<div class="banner banner-warn" data-banner="sync">' + ui.icon('cloud')
        + '<span><b>Non connecté.</b> Cet appareil fonctionne en solo : ses saisies ne sont pas partagées avec l’autre poste.</span>'
        + '<button type="button" class="btn small" data-act="sync-login">Se connecter</button></div>');
    }
    const snap = store.getSnapshot();
    if (snap && MS.model.isEmptyState(store.state)) {
      out.push('<div class="banner banner-info">' + ui.icon('refresh')
        + '<span>Une copie de vos données prise le ' + esc(MS.util.fmtDateTime(snap.date)) + ' est disponible.</span>'
        + '<button type="button" class="btn small" data-act="restore-snapshot">Restaurer</button></div>');
    }
    return out.join('');
  }

  /* -------------------- Barre haute -------------------- */

  function topbarHtml() {
    const st = MS.sync.status();
    const user = MS.auth.currentUser();
    const settings = O(store.state.settings);
    return '<div class="top-left">'
      + '<button type="button" class="icon-btn only-mobile" data-act="more" aria-label="Menu">' + ui.icon('menu') + '</button>'
      + '<h1 class="screen-title">' + esc(screenTitle()) + '</h1></div>'
      + '<div class="top-right">'
      + '<button type="button" class="sync-pill sync-' + esc(st.code) + '" data-act="sync-panel" title="' + esc(st.help) + '">'
      + ui.icon('cloud') + '<span>' + esc(st.label) + '</span></button>'
      + '<button type="button" class="icon-btn" data-act="theme" aria-label="Changer le thème">'
      + ui.icon(settings.theme === 'dark' ? 'sun' : 'moon') + '</button>'
      + (MS.auth.enabled()
        ? '<button type="button" class="icon-btn user-btn" data-act="account" aria-label="Compte">'
          + ui.icon('user') + (user ? '<span class="only-desk">' + esc(user.name) + '</span>' : '') + '</button>'
        : '')
      + '</div>';
  }

  function screenTitle() {
    const item = ALL_ITEMS.find((i) => i.id === route.screen);
    if (item) return item.label;
    if (route.screen === 'repair') return 'Fiche de réparation';
    if (route.screen === 'client') return 'Fiche client';
    return 'MS MOBILE';
  }

  /* -------------------- Rendu -------------------- */

  let rendering = false;

  function render() {
    if (typeof document === 'undefined') return;
    if (rendering) return;
    rendering = true;
    try { renderInner(); } catch (e) {
      console.error(e);
      const host = ui.$('#screen');
      if (host) {
        host.innerHTML = '<div class="card"><h2>Écran indisponible</h2>'
          + '<p class="muted">Une donnée inattendue a empêché l’affichage de cet écran. Les autres écrans restent accessibles.</p>'
          + '<p class="mono small">' + esc(S(e && e.message)) + '</p></div>';
      }
    } finally { rendering = false; }
  }

  function renderInner() {
    const focus = ui.captureFocus();
    document.documentElement.dataset.theme = O(store.state.settings).theme === 'dark' ? 'dark' : 'light';

    const navHost = ui.$('#nav-links');
    if (navHost) navHost.innerHTML = navHtml();
    const mobHost = ui.$('#mobile-bar');
    if (mobHost) mobHost.innerHTML = mobileBarHtml();
    const topHost = ui.$('#topbar');
    if (topHost) topHost.innerHTML = topbarHtml();
    const bannerHost = ui.$('#banners');
    if (bannerHost) bannerHost.innerHTML = bannersHtml();
    const brand = ui.$('#brand-name');
    if (brand) brand.textContent = S(O(store.state.settings).shopName) || MS.config.shopName;
    const brandLogo = ui.$('#brand-logo');
    if (brandLogo) {
      const logo = S(O(store.state.settings).logo) || S(MS.config.logo);
      if (logo) {
        if (brandLogo.dataset.src !== logo) {
          brandLogo.innerHTML = '<img alt="" src="' + esc(logo) + '">';
          brandLogo.dataset.src = logo;
        }
        brandLogo.classList.add('has-logo');
      } else {
        brandLogo.classList.remove('has-logo');
      }
    }

    const previous = ui.$('#screen');
    if (!previous) return;
    /*
     * Chaque écran rattache ses écouteurs à son conteneur à chaque rendu.
     * On repart d'un nœud vierge : sans cela, les écouteurs s'empilent et
     * un seul clic finit par déclencher plusieurs fois la même action.
     */
    const host = previous.cloneNode(false);
    previous.parentNode.replaceChild(host, previous);

    const guard = MS.auth.canView(route.screen);
    if (!guard.ok) {
      host.innerHTML = guard.reason === 'admin' ? adminOnlyHtml() : lockedHtml();
      if (guard.reason !== 'admin') mountLogin(host);
      return;
    }

    const screen = MS.screens[route.screen];
    if (!screen || typeof screen.render !== 'function') {
      host.innerHTML = '<div class="card"><h2>Écran inconnu</h2></div>';
      return;
    }
    host.dataset.screen = route.screen;
    screen.render(host, route.param);
    ui.restoreFocus(focus);
  }

  function adminOnlyHtml() {
    return '<div class="card locked"><h2>' + ui.icon('shield') + ' Réservé à l’administrateur</h2>'
      + '<p class="muted">Cet écran n’est accessible qu’avec un compte administrateur. '
      + 'Connectez-vous avec un autre compte depuis le bouton en haut à droite.</p></div>';
  }

  function lockedHtml() {
    const logo = S(O(store.state.settings).logo) || S(MS.config.logo);
    return '<div class="card locked" id="login-card">'
      + (logo ? '<img class="login-logo" alt="" src="' + esc(logo) + '">' : '')
      + '<h2>' + ui.icon('key') + ' Connexion requise</h2>'
      + '<form class="login-form" id="login-form">'
      + '<label class="field"><span>Identifiant</span><input name="login" autocomplete="username" data-keep="login-user" autofocus></label>'
      + '<label class="field"><span>Mot de passe</span><input name="password" type="password" autocomplete="current-password" data-keep="login-pass"></label>'
      + '<p class="form-error" id="login-error" role="alert"></p>'
      + '<div class="row-end"><button type="button" class="btn ghost" data-act="recovery">Clé de secours</button>'
      + '<button type="submit" class="btn primary">Se connecter</button></div>'
      + '</form></div>';
  }

  function mountLogin(host) {
    const form = ui.$('#login-form', host);
    if (!form) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const res = await MS.auth.login(S(data.get('login')), S(data.get('password')));
      const err = ui.$('#login-error', host);
      if (!res.ok) { if (err) err.textContent = res.error; return; }
      render();
    });
    ui.on(host, '[data-act="recovery"]', 'click', askRecovery);
  }

  async function askRecovery() {
    const key = await ui.prompt({
      title: 'Clé de secours',
      label: 'Saisissez la clé de secours',
      help: 'La protection sera désactivée et vous reprendrez la main sur l’application.',
      confirmLabel: 'Reprendre la main',
    });
    if (key === null) return;
    const res = await MS.auth.useRecovery(key);
    if (!res.ok) { ui.toast(res.error, 'error'); return; }
    ui.toast('Protection désactivée. Reconfigurez les comptes dans Paramètres.', 'success');
    render();
  }

  /* -------------------- Panneaux du bandeau haut -------------------- */

  function accountPanel() {
    const user = MS.auth.currentUser();
    const body = user
      ? '<p class="lead">' + esc(user.name) + '</p><p class="muted">' + esc(user.role) + ' — identifiant ' + esc(user.login) + '</p>'
      : '<p class="lead">Aucun compte connecté.</p><p class="muted">La caisse reste accessible ; les écrans de gestion demandent une connexion.</p>';
    const m = ui.modal({
      title: 'Compte',
      size: 'sm',
      body,
      footer: (user
        ? '<button type="button" class="btn ghost" data-act="logout">Se déconnecter</button>'
        : '<button type="button" class="btn primary" data-act="dologin">Se connecter</button>'),
    });
    if (!m) return;
    ui.on(m.el, '[data-act="logout"]', 'click', () => { MS.auth.logout('manuelle'); m.close(); go('dashboard'); render(); });
    ui.on(m.el, '[data-act="dologin"]', 'click', () => { m.close(); openLoginModal(); });
  }

  function openLoginModal() {
    const m = ui.modal({
      title: 'Connexion',
      size: 'sm',
      body: '<form id="modal-login">'
        + '<label class="field"><span>Identifiant</span><input name="login" autocomplete="username" autofocus></label>'
        + '<label class="field"><span>Mot de passe</span><input name="password" type="password" autocomplete="current-password"></label>'
        + '<p class="form-error" id="modal-login-error" role="alert"></p></form>',
      footer: '<button type="button" class="btn ghost" data-close>Annuler</button>'
        + '<button type="button" class="btn primary" data-act="ok">Se connecter</button>',
    });
    if (!m) return;
    const submit = async () => {
      const form = ui.$('#modal-login', m.el);
      const data = new FormData(form);
      const res = await MS.auth.login(S(data.get('login')), S(data.get('password')));
      if (!res.ok) { ui.$('#modal-login-error', m.el).textContent = res.error; return; }
      m.close();
      ui.toast('Connecté.', 'success');
      render();
    };
    ui.on(m.el, '[data-act="ok"]', 'click', submit);
    ui.$('#modal-login', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  }

  function syncPanel() {
    const st = MS.sync.status();
    const connected = MS.sync.connected;
    const body = '<p class="lead">' + esc(st.label) + '</p><p class="muted">' + esc(st.help) + '</p>'
      + (connected && st.email ? '<p class="muted">Compte : ' + esc(st.email) + '</p>' : '')
      + '<p class="muted small">L’état entier est envoyé à chaque enregistrement : si deux personnes enregistrent dans la même seconde sur deux appareils, la dernière écriture écrase l’autre.</p>';
    const footer = connected
      ? '<button type="button" class="btn ghost" data-act="signout">Se déconnecter</button>'
        + '<button type="button" class="btn primary" data-act="resync">Resynchroniser</button>'
      : '<a class="btn ghost" href="#/settings" data-close>Configurer</a>'
        + '<button type="button" class="btn primary" data-act="signin">Se connecter</button>';
    const m = ui.modal({ title: 'Synchronisation', size: 'sm', body, footer });
    if (!m) return;
    ui.on(m.el, '[data-act="signin"]', 'click', () => { m.close(); openSyncLogin(); });
    ui.on(m.el, '[data-act="signout"]', 'click', () => { MS.sync.signOut(); m.close(); ui.toast('Déconnecté de la synchronisation.', 'info'); render(); });
    ui.on(m.el, '[data-act="resync"]', 'click', async () => { await MS.sync.reconcile(); ui.toast('Synchronisation relancée.', 'success'); });
  }

  /** Aucun bouton muet : si la fenetre ne peut pas s'ouvrir, on dit pourquoi. */
  function openSyncLogin() {
    const blocked = MS.sync.loginBlockedReason();
    if (blocked) { ui.toast(blocked, 'info', 7000); return; }
    const m = ui.modal({
      title: 'Connexion à la synchronisation',
      size: 'sm',

    window.addEventListener('hashchange', () => {
      Object.assign(route, parseHash(location.hash));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ui.closeTopModal();

  /**
   * Premier demarrage : l'identite gravee dans le fichier renseigne les

   */
  function applyConfigDefaults() {
    const defaults = O(MS.configDefaults);
    const factory = MS.model.normSettings({});
    let changed = false;
    Object.keys(defaults).forEach((field) => {
      const value = S(defaults[field]);
      if (!value) return;
      const current = S(O(store.state.settings)[field]);
      if (current === S(factory[field])) { store.state.settings[field] = value; changed = true; }

  function boot() {

  MS.app = { boot, render, go, currentRoute, parseHash, NAV, ALL_ITEMS, openSyncLogin, openLoginModal, alertCount, applyConfigDefaults };
})();

/* ============================================================
   08 — Operations metier : stock, ventes, caisse, pieces
   L'integrite du stock se joue ici, sur tout le cycle.

(function () {
  const MS = globalThis.MS;

  /* -------------------- Stock -------------------- */

  /**
   * Ajuste la quantite d'un article. Le stock ne devient jamais negatif.
   * Le journal coalesce : dix clics tiennent une ligne, un retour au depart l'efface.
   */
  function adjustStock(productId, delta, opts) {
    const o = O(opts);
    const product = findProduct(productId);
    if (!product) return { ok: false, error: 'Article introuvable.' };
    const before = I(product.qty, 0, 0);
    const after = Math.max(0, before + I(delta, 0));
    if (after === before && !o.force) return { ok: true, product, changed: false };
    product.qty = after;
    if (o.silent !== true) {
      store.log('Stock ajusté', product.name + ' : ' + before + ' → ' + after,
        after > before ? 'plus' : 'minus', {
          key: 'stock:' + product.id,
          meta: { from: before, to: after },
          dropIfSame: true,
          merge: (from, meta) => product.name + ' : ' + from + ' → ' + meta.to,
        });
    }
    if (o.save !== false) store.save({ reason: 'stock' });
    return { ok: true, product, changed: true, before, after };
  }

    return adjustStock(productId, I(qty, 0, 0) - I(product.qty, 0, 0), opts);

  /** Retire une quantite en respectant le stock disponible. Renvoie ce qui a pu etre retiré. */

    const taken = Math.min(want, I(product.qty, 0, 0));
    if (taken > 0) adjustStock(productId, -taken, Object.assign({ save: false }, O(opts)));
    return taken;
  }

    store.save({ reason: 'cash' });

  /* -------------------- Reparations -------------------- */

  function deleteRepair(id) {

  /* -------------------- Pieces d'une reparation -------------------- */

  /**
   * Ajoute une piece. Si elle vient du stock et que l'on decompte,
   * la quantite est retiree immediatement et `fromStock` en garde la trace.
   */
  function addPart(repairId, data) {
    const repair = findRepair(repairId);
    if (!repair) return { ok: false, error: 'Fiche introuvable.' };
    const d = O(data);
    const part = model.normPart({
      id: uid('prt'), productId: d.productId, name: d.name, qty: I(d.qty, 1, 0) || 1,
      price: d.price, cost: d.cost, fromStock: false,

      if (!product) return { ok: false, error: "Cet article n’existe plus dans le stock." };

      part.fromStock = taken > 0;
      part.qty = taken > 0 ? taken : part.qty;

      }

    repair.parts = A(repair.parts).concat([part]);
    repair.updatedAt = new Date().toISOString();

      + (part.fromStock ? ' (décomptée du stock)' : ''), 'plus');

  /** Basculer le decompte reajuste le stock dans le bon sens. */
  function togglePartStock(repairId, partId) {

    if (!repair) return { ok: false, error: 'Fiche introuvable.' };
    const part = A(repair.parts).find((p) => S(p.id) === S(partId));
    if (!part) return { ok: false, error: 'Pièce introuvable.' };
    if (!S(part.productId)) return { ok: false, error: "Cette pièce n’est rattachée à aucun article du stock." };
    const product = findProduct(part.productId);
    if (!product) return { ok: false, error: "Cet article n’existe plus dans le stock." };

    if (part.fromStock) {
      giveBackToStock(part.productId, part.qty, { silent: true });
      part.fromStock = false;
      store.log('Pièce remise en stock', repair.number + ' — ' + part.name + ' ×' + part.qty, 'refresh');
    } else {
      const taken = takeFromStock(part.productId, part.qty, { silent: true });
      if (taken <= 0) {

        return { ok: false, error: 'Stock épuisé pour ' + product.name + '.' };
      }
      part.qty = taken;

  function removePart(repairId, partId) {

    repair.parts = A(repair.parts).filter((p) => S(p.id) !== S(partId));

  /**
   * Recherche client : classement par pertinence, insensible aux accents,
   * insensible aux espaces dans les numeros, et jusqu'au milieu d'un numero.
   */
  function searchClients(query, limit) {
    const raw = S(query).trim();
    if (!raw) return [];
    const q = MS.util.norm(raw);
    const qDigits = MS.util.digits(raw);
    const out = [];
    A(store.state.clients).forEach((c) => {
      const name = MS.util.norm(c.name);
      const phone = MS.util.digits(c.phone);
      let score = -1;
      if (q && name.indexOf(q) === 0) score = 100;                                  // commence par
      else if (q && new RegExp('(^|\\s)' + escapeRe(q)).test(name)) score = 80;      // debut de mot
      else if (q && name.indexOf(q) > -1) score = 60;                               // milieu
      if (qDigits.length >= 2 && phone) {
        if (phone.indexOf(qDigits) === 0) score = Math.max(score, 95);
        else if (phone.indexOf(qDigits) > -1) score = Math.max(score, 70);           // milieu d'un numero
      }
      if (q && MS.util.norm(c.email).indexOf(q) === 0) score = Math.max(score, 50);
      if (score >= 0) out.push({ client: c, score, repairs: countRepairs(c.id) });
    });
    out.sort((a, b) => b.score - a.score || MS.util.norm(a.client.name).localeCompare(MS.util.norm(b.client.name)));
    return out.slice(0, I(limit, 8, 1));
  }

  function escapeRe(s) { return S(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  /* -------------------- Tarifs depuis la grille -------------------- */

  /**
   * Cherche le modele le plus precis : « iPhone 16 Pro Max » avant « iPhone 16 ».
   * Renvoie null si l'appareil est absent : on le dit, on ne devine pas.
   */
  function findPricing(device) {
    const target = MS.util.norm(device);
    if (!target) return null;
    let best = null;
    A(O(store.state.pricing).tabs).forEach((tab) => {
      A(tab.rows).forEach((row) => {
        const modelName = MS.util.norm(row.model);
        if (!modelName) return;
        const contained = target.indexOf(modelName) > -1 || modelName.indexOf(target) > -1;
        if (!contained) return;
        const exact = modelName === target;
        const score = (exact ? 1000 : 0) + modelName.length + (target.indexOf(modelName) > -1 ? 50 : 0);
        if (!best || score > best.score) {
          best = {
            score, tab, row,
            prices: A(tab.cols).map((col) => ({ label: col.name, value: S(O(row.cells)[col.id]) }))
              .filter((p) => S(p.value).trim()),

/* ============================================================
   09 — Agregats : periodes, chiffre d'affaires, repartitions
   ============================================================ */
(function () {
  const MS = globalThis.MS;
  const { S, N, M, A, O, I, toDate, dayKey, monthKey, startOfDay, endOfDay, addDays } = MS.util;
  const model = MS.model;
  const store = MS.store;

  const PERIODS = [
    { id: 'day', label: 'Jour' },
    { id: 'yesterday', label: 'Hier' },
    { id: 'week', label: 'Semaine' },
    { id: 'month', label: 'Mois' },
    { id: 'all', label: 'Tout' },
  ];

  /** Bornes d'une periode nommee. `all` ne borne rien. */
  function periodRange(period, ref) {
    const now = ref ? toDate(ref) : new Date();
    switch (S(period)) {
      case 'yesterday': {
        const d = addDays(now, -1);
        return { from: startOfDay(d), to: endOfDay(d) };
      }
      case 'week': {
        const d = new Date(now);
        const dow = (d.getDay() + 6) % 7; // lundi = 0
        return { from: startOfDay(addDays(d, -dow)), to: endOfDay(now) };
      }
      case 'month': {
        const d = new Date(now.getFullYear(), now.getMonth(), 1);
        return { from: startOfDay(d), to: endOfDay(now) };
      }
      case 'all':
        return { from: null, to: null };
      case 'day':
      default:
        return { from: startOfDay(now), to: endOfDay(now) };
    }
  }

  function inRange(date, range) {
    const r = O(range);
    if (!r.from && !r.to) return true;
    const t = toDate(date).getTime();
    if (r.from && t < r.from.getTime()) return false;
    if (r.to && t > r.to.getTime()) return false;
    return true;
  }

  /** Operations de caisse d'une periode, filtre de type optionnel. */
  function cashIn(range, type) {
    const wanted = S(type);
    return A(store.state.cash).filter((op) => inRange(op.date, range) && (!wanted || S(op.type) === wanted));
  }

  /** Totaux : encaisse (hors retraits), especes, carte, retraits. */
  function totals(ops) {
    const out = { revenue: 0, cash: 0, card: 0, withdrawals: 0, count: 0 };
    A(ops).forEach((op) => {
      const amount = Math.max(0, M(O(op).amount, 0));
      out.count += 1;
      if (S(op.type) === 'Retrait') { out.withdrawals += amount; return; }
      out.revenue += amount;
      if (S(op.method) === 'Espèces') out.cash += amount;
      else if (S(op.method) === 'Carte bancaire') out.card += amount;
    });
    const round = (v) => Math.round(v * 100) / 100;
    out.revenue = round(out.revenue); out.cash = round(out.cash);
    out.card = round(out.card); out.withdrawals = round(out.withdrawals);
    return out;
  }

  function revenueBetween(from, to) {
    return totals(A(store.state.cash).filter((op) => inRange(op.date, { from, to }))).revenue;
  }

  function revenueToday() {
    const r = periodRange('day');
    return revenueBetween(r.from, r.to);
  }

  function revenueThisMonth() {
    const r = periodRange('month');
    return revenueBetween(r.from, r.to);
  }

  function revenuePreviousMonth() {
    const now = new Date();
    const from = startOfDay(new Date(now.getFullYear(), now.getMonth() - 1, 1));
    const to = endOfDay(new Date(now.getFullYear(), now.getMonth(), 0));
    return revenueBetween(from, to);
  }

  /** Courbe du chiffre d'affaires sur N jours (le dernier point est aujourd'hui). */
  function revenueSeries(days) {
    const n = I(days, 14, 1);
    const buckets = new Map();
    for (let i = n - 1; i >= 0; i--) buckets.set(dayKey(addDays(new Date(), -i)), 0);
    A(store.state.cash).forEach((op) => {
      const key = dayKey(op.date);
      if (!buckets.has(key)) return;
      buckets.set(key, buckets.get(key) + model.cashRevenue(op));
    });
    return Array.from(buckets.entries()).map(([day, value]) => ({ day, value: Math.round(value * 100) / 100 }));
  }

  /** Repartition du chiffre d'affaires du mois par type d'operation. */
  function breakdownByType(range) {
    const map = new Map();
    cashIn(range).forEach((op) => {
      const revenue = model.cashRevenue(op);
      if (!revenue) return;
      const type = S(op.type) || 'Autre';
      map.set(type, (map.get(type) || 0) + revenue);
    });
    const rows = Array.from(map.entries())
      .map(([type, value]) => ({ type, value: Math.round(value * 100) / 100 }))
      .sort((a, b) => b.value - a.value);
    const total = rows.reduce((s, r) => s + r.value, 0);
    rows.forEach((r) => { r.share = total > 0 ? r.value / total : 0; });
    return { rows, total: Math.round(total * 100) / 100 };
  }

  function stockStats() {
    const settings = O(store.state.settings);
    const products = A(store.state.products);
    let units = 0, low = 0, out = 0, value = 0;
    products.forEach((p) => {
      const qty = I(p.qty, 0, 0);
      units += qty;
      value += qty * Math.max(0, M(p.cost, 0));
      const level = model.stockLevel(p, settings);
      if (level === 'out') out += 1;
      else if (level === 'low') low += 1;
    });
    return { units, refs: products.length, low, out, value: Math.round(value * 100) / 100 };
  }

  function repairStats() {
    const repairs = A(store.state.repairs);
    const open = repairs.filter((r) => ['En attente', 'Diagnostic', 'Attente pièces', 'En réparation'].includes(S(r.status)));
    const ready = repairs.filter((r) => S(r.status) === 'Terminé');
    return { total: repairs.length, open: open.length, ready: ready.length };
  }

  /** Y a-t-il des operations hors de la periode affichee ? (bandeau d'information) */
  function outsideCount(range) {
    if (!O(range).from && !O(range).to) return 0;
    return A(store.state.cash).filter((op) => !inRange(op.date, range)).length;
  }

  MS.stats = {
    PERIODS, periodRange, inRange, cashIn, totals, revenueBetween, revenueToday,
    revenueThisMonth, revenuePreviousMonth, revenueSeries, breakdownByType,
    stockStats, repairStats, outsideCount,
  };
})();

        const withdraw = S(op.type) === 'Retrait';
        const client = ops.findClient(op.clientId);
        const details = A(op.items).map((i) => i.name + ' ×' + i.qty).join(', ');
        return '<tr class="' + (withdraw ? 'row-withdraw' : '') + '">'
          + '<td data-label="Date">' + esc(fmtDateTime(op.date)) + '</td>'
          + '<td data-label="Type">' + ui.badge(op.type, withdraw ? 'warn' : 'neutral') + '</td>'
          + '<td data-label="Libellé"><span class="cell-main">' + esc(op.label || (withdraw ? 'Retrait de caisse' : '—')) + '</span>'
          + ui.foldout([
            { label: 'Client', value: client ? client.name : '' },
            { label: 'Articles', value: details },
            { label: 'Mode', value: op.method },
          ]) + '</td>'
          + '<td data-label="Mode">' + esc(op.method) + '</td>'
          + '<td data-label="Montant" class="num ' + (withdraw ? 'neg' : '') + '">'
          + esc((withdraw ? '−' : '') + ui.money(op.amount)) + '</td></tr>';
      }).join('')
      + '</tbody><tfoot><tr><th colspan="4">Total encaissé (retraits déduits)</th>'
      + '<td class="num"><b>' + esc(ui.money(totals.revenue - totals.withdrawals)) + '</b></td></tr></tfoot>'
      + '</table></div></section>';
  }

  /* -------------------- Interactions -------------------- */

  function bind(host, list, totals) {
    ui.on(host, '[data-mode]', 'click', (e, el) => {
      view.mode = el.dataset.mode === 'out' ? 'out' : 'in';
      MS.app.render();
    });
    ui.on(host, '[data-period]', 'click', (e, el) => {
      // Les deux filtres sont exclusifs : cliquer un bouton efface la date.
      view.period = el.dataset.period;
      view.date = '';
      MS.app.render();
    });
    ui.on(host, '[data-act="clear-date"]', 'click', () => { view.date = ''; MS.app.render(); });
    ui.on(host, '[data-act="show-all"]', 'click', () => { view.period = 'all'; view.date = ''; MS.app.render(); });

    const dateInput = ui.$('#cash-date', host);
    if (dateInput) dateInput.addEventListener('change', () => {
      // Choisir une date eteint les boutons de periode.
      view.date = S(dateInput.value);
      MS.app.render();
    });
    const typeInput = ui.$('#cash-typef', host);
    if (typeInput) typeInput.addEventListener('change', () => { view.type = S(typeInput.value); MS.app.render(); });

    ui.on(host, '[data-act="cart-add"]', 'click', () => {
      const pick = ui.$('#cart-pick', host);
      const product = ops.findProduct(pick ? pick.value : '');
      if (!product) { ui.toast('Choisissez un article du stock.', 'info'); return; }
      if (I(product.qty, 0, 0) <= 0) { ui.toast(product.name + ' est en rupture.', 'error'); return; }
      keepForm(host);
      const existing = view.cart.find((i) => S(i.productId) === S(product.id));
      if (existing) {
        if (I(existing.qty, 1, 0) >= I(product.qty, 0, 0)) { ui.toast('Stock disponible atteint pour ' + product.name + '.', 'info'); return; }
        existing.qty = I(existing.qty, 1, 0) + 1;
      } else {
        view.cart.push({ productId: product.id, name: product.name, qty: 1, price: M(product.price, 0) });
      }
      MS.app.render();
    });
    ui.on(host, '[data-cart-inc]', 'click', (e, el) => {
      const item = view.cart[I(el.dataset.cartInc, 0, 0)];
      const product = ops.findProduct(O(item).productId);
      if (item && (!product || I(item.qty, 1, 0) < I(product.qty, 0, 0))) { item.qty = I(item.qty, 1, 0) + 1; keepForm(host); MS.app.render(); }
    });
    ui.on(host, '[data-cart-dec]', 'click', (e, el) => {
      const idx = I(el.dataset.cartDec, 0, 0);
      const item = view.cart[idx];
      if (!item) return;
      item.qty = I(item.qty, 1, 0) - 1;
      if (item.qty <= 0) view.cart.splice(idx, 1);
      keepForm(host);
      MS.app.render();
    });
    ui.on(host, '[data-cart-del]', 'click', (e, el) => {
      view.cart.splice(I(el.dataset.cartDel, 0, 0), 1);
      keepForm(host);
      MS.app.render();
    });

    ui.on(host, '[data-act="export"]', 'click', () => exportCsv(list, totals));

    const formIn = ui.$('#cash-in', host);
    if (formIn) formIn.addEventListener('submit', (e) => { e.preventDefault(); submitIn(formIn); });
    const formOut = ui.$('#cash-out', host);
    if (formOut) formOut.addEventListener('submit', (e) => { e.preventDefault(); submitOut(formOut); });
  }

  /** Conserve la saisie en cours quand le panier change. */
  function keepForm(host) {
    const form = ui.$('#cash-in', host);
    if (!form) return;
    const data = new FormData(form);
    view.form = {
      amount: S(data.get('amount')), type: S(data.get('type')), method: S(data.get('method')),
      label: S(data.get('label')), clientId: S(data.get('clientId')),
    };
  }

  function submitIn(form) {
    const data = new FormData(form);
    const res = ops.recordCash({
      amount: view.cart.length ? undefined : S(data.get('amount')),
      type: S(data.get('type')),
      method: S(data.get('method')),
      label: S(data.get('label')),
      clientId: S(data.get('clientId')),
      items: view.cart.slice(),
    });
    if (!res.ok) { ui.toast(res.error, 'error'); return; }
    view.cart = [];
    view.form = {};
    // Apres un encaissement, la periode affichee doit montrer l'operation.
    if (view.date && view.date !== dayKey(new Date())) view.date = '';
    ui.toast('Encaissement enregistré : ' + ui.money(res.op.amount), 'success');
    MS.app.render();
  }

  function submitOut(form) {
    const data = new FormData(form);
    const res = ops.recordWithdraw({ amount: S(data.get('amount')), label: S(data.get('label')) });
    if (!res.ok) { ui.toast(res.error, 'error'); return; }
    ui.toast('Retrait enregistré : ' + ui.money(res.op.amount), 'success');
    // La carte reste sur « Retrait ».
    view.mode = 'out';
    MS.app.render();
  }

  function exportCsv(list, totals) {
    const rows = [['Date', 'Type', 'Libellé', 'Mode de paiement', 'Client', 'Articles', 'Montant']];
    A(list).forEach((op) => {
      const client = ops.findClient(op.clientId);
      rows.push([
        fmtDateTime(op.date), op.type, op.label, op.method,
        client ? client.name : '',
        A(op.items).map((i) => i.name + ' x' + i.qty).join(' | '),
        (S(op.type) === 'Retrait' ? '-' : '') + M(op.amount, 0).toFixed(2),
      ]);
    });
    rows.push([]);
    rows.push(['Total encaissé', '', '', '', '', '', (totals.revenue - totals.withdrawals).toFixed(2)]);
    rows.push(['dont espèces', '', '', '', '', '', totals.cash.toFixed(2)]);
    rows.push(['dont carte', '', '', '', '', '', totals.card.toFixed(2)]);
    rows.push(['Retraits', '', '', '', '', '', totals.withdrawals.toFixed(2)]);
    ui.exportCsv('caisse-' + dayKey(new Date()) + '.csv', rows);
  }

  /** Utilise par l'import : se placer sur une periode qui montre les donnees. */
  function showPeriod(period) { view.period = S(period) || 'all'; view.date = ''; }

  MS.screens.cash = { render, showPeriod, view };
})();

/* ============================================================

   ============================================================ */
(function () {
  const MS = globalThis.MS;
  const { S, N, I, M, A, O, esc, norm, fmtDate, dayKey } = MS.util;
  const ui = MS.ui, store = MS.store, model = MS.model, ops = MS.ops, stats = MS.stats;

  const view = { q: '', category: '', sort: 'recent' };

  const SORTS = [
    { value: 'recent', label: 'Plus récents' },
    { value: 'name', label: 'Nom (A → Z)' },
    { value: 'qty', label: 'Quantité croissante' },
    { value: 'price', label: 'Prix décroissant' },
  ];

  function filtered() {
    const settings = O(store.state.settings);
    const q = norm(view.q);
    const cat = S(view.category);
    let list = A(store.state.products).filter((p) => {
      if (cat && S(p.category) !== cat) return false;
      if (!q) return true;
      const hay = norm([p.name, p.ref, p.supplier, p.category, p.condition, p.variant, p.notes].join(' '));
      return hay.indexOf(q) > -1;
    });
    const by = {
      recent: (a, b) => (S(b.createdAt) > S(a.createdAt) ? 1 : -1),
      name: (a, b) => norm(a.name).localeCompare(norm(b.name)),
      qty: (a, b) => I(a.qty, 0, 0) - I(b.qty, 0, 0),
      price: (a, b) => M(b.price, 0) - M(a.price, 0),
    };
    return list.sort(by[view.sort] || by.recent);
  }

  function render(host) {
    const st = stats.stockStats();
    const list = filtered();
    host.innerHTML =
      '<div class="grid stats-grid">'
      + ui.statCard('Articles en stock', String(st.units), 'unités', 'primary', 'box')
      + ui.statCard('Références', String(st.refs), '', 'neutral', 'list')
      + ui.statCard('Stock faible', String(st.low), 'sous le seuil', st.low ? 'warn' : 'neutral', 'alert')
      + ui.statCard('Ruptures', String(st.out), 'à zéro', st.out ? 'bad' : 'neutral', 'alert')
      + '</div>'
      + '<section class="card filters"><div class="filter-row">'
      + '<label class="field grow"><span>Rechercher</span>'
      + '<input data-keep="stock-q" id="stock-q" value="' + esc(view.q) + '" placeholder="Nom, référence, IMEI, catégorie, fournisseur, état…"></label>'
      + '<label class="field inline"><span>Catégorie</span><select data-keep="stock-cat" id="stock-cat">'
      + '<option value="">Toutes</option>' + ui.selectOptions(model.CATEGORIES, view.category) + '</select></label>'
      + '<label class="field inline"><span>Tri</span><select data-keep="stock-sort" id="stock-sort">'
      + ui.selectOptions(SORTS, view.sort) + '</select></label>'
      + '</div><div class="filter-row">'
      + '<button type="button" class="btn primary" data-act="new">' + ui.icon('plus') + ' Nouvel article</button>'
      + '<button type="button" class="btn small" data-act="export">' + ui.icon('download') + ' Export CSV</button>'
      + '</div></section>'
      + tableHtml(list);
    bind(host, list);
  }

  function tableHtml(list) {
    if (!list.length) {
      return '<section class="card">'
        + ui.empty(A(store.state.products).length ? 'Aucun article ne correspond à cette recherche.' : 'Le stock est vide.',
          '<button type="button" class="btn primary" data-act="new">Ajouter un article</button>')
        + '</section>';
    }
    const settings = O(store.state.settings);
    return '<section class="card"><div class="table-wrap"><table class="table stock-table">'
      + '<thead><tr>'
      + '<th class="col-name">Produit</th><th class="col-cat">Catégorie</th><th class="col-price num">Prix</th>'
      + '<th class="col-qty num">Quantité</th><th class="col-state">État</th><th class="col-min num">Seuil</th>'
      + '<th class="col-sup">Fournisseur</th><th class="col-act">Actions</th>'
      + '</tr></thead><tbody>'
      + list.map((p) => rowHtml(p, settings)).join('')
      + '</tbody></table></div></section>';
  }

  function rowHtml(p, settings) {
    const level = model.stockLevel(p, settings);
    const qty = I(p.qty, 0, 0);
    const kind = level === 'out' ? 'bad' : level === 'low' ? 'warn' : 'good';
    return '<tr data-id="' + esc(p.id) + '" class="lvl-' + level + '">'
      + '<td class="col-name" data-label="Produit"><span class="cell-main">' + esc(p.name) + '</span>'
      + (p.variant ? '<span class="cell-sub">' + esc(p.variant) + '</span>' : '')
      // Le contenu des colonnes effacees se replie sous le nom : rien n'est perdu.
      + ui.foldout([
        { label: 'Catégorie', value: p.category },
        { label: 'Prix', value: ui.money(p.price) },
        { label: 'Seuil', value: I(p.minQty, 0, 0) ? String(p.minQty) : 'général (' + I(settings.lowStock, 2, 0) + ')' },
        { label: 'Fournisseur', value: p.supplier },
        { label: 'Réf.', value: p.ref },
        { label: 'État', value: p.condition },
      ]) + '</td>'
      + '<td class="col-cat" data-label="Catégorie">' + esc(p.category) + '</td>'
      + '<td class="col-price num" data-label="Prix">' + esc(ui.money(p.price)) + '</td>'
      + '<td class="col-qty num" data-label="Quantité"><b class="qty qty-' + level + '">' + qty + '</b></td>'
      + '<td class="col-state" data-label="État">' + ui.badge(model.STOCK_LEVEL_LABEL[level], kind) + '</td>'
      + '<td class="col-min num" data-label="Seuil">' + (I(p.minQty, 0, 0) || '—') + '</td>'
      + '<td class="col-sup" data-label="Fournisseur">' + esc(p.supplier || '—') + '</td>'
      + '<td class="col-act" data-label="Actions"><div class="row-btns">'
      + '<button type="button" class="icon-btn" data-act="inc" title="Ajouter une unité" aria-label="Ajouter une unité">' + ui.icon('plus') + '</button>'
      + '<button type="button" class="icon-btn" data-act="dec"' + (qty <= 0 ? ' disabled' : '') + ' title="Retirer une unité" aria-label="Retirer une unité">' + ui.icon('minus') + '</button>'
      + '<button type="button" class="icon-btn" data-act="edit" title="Modifier" aria-label="Modifier">' + ui.icon('edit') + '</button>'
      + '<button type="button" class="icon-btn danger-ghost" data-act="del" title="Supprimer" aria-label="Supprimer">' + ui.icon('trash') + '</button>'
      + '</div></td></tr>';

  function bind(host, list) {
    const q = ui.$('#stock-q', host);
    if (q) q.addEventListener('input', MS.util.debounce(() => { view.q = S(q.value); MS.app.render(); }, 180));
    const cat = ui.$('#stock-cat', host);
    if (cat) cat.addEventListener('change', () => { view.category = S(cat.value); MS.app.render(); });
    const sort = ui.$('#stock-sort', host);
    if (sort) sort.addEventListener('change', () => { view.sort = S(sort.value); MS.app.render(); });

    ui.on(host, '[data-act="new"]', 'click', () => openForm());
    ui.on(host, '[data-act="export"]', 'click', () => exportCsv(list));
    ui.on(host, '[data-act="inc"]', 'click', (e, el) => {
      const id = el.closest('tr').dataset.id;
      ops.adjustStock(id, 1);
      MS.app.render();
    });
    ui.on(host, '[data-act="dec"]', 'click', (e, el) => {
      const id = el.closest('tr').dataset.id;
      ops.adjustStock(id, -1);
      MS.app.render();
    });
    ui.on(host, '[data-act="edit"]', 'click', (e, el) => openForm(el.closest('tr').dataset.id));
    ui.on(host, '[data-act="del"]', 'click', async (e, el) => {
      const id = el.closest('tr').dataset.id;
      const product = ops.findProduct(id);
      if (!product) return;
      const ok = await ui.confirm({
        title: 'Supprimer l’article', danger: true, confirmLabel: 'Supprimer',
        message: 'Supprimer « ' + product.name +' » du stock ?',
        detail: 'Les ventes et réparations déjà enregistrées conservent leur trace.',
      });
      if (!ok) return;
      ops.deleteProduct(id);
      ui.toast('Article supprimé.', 'success');
      MS.app.render();
    });
  }

  /* -------------------- Fiche article -------------------- */

  function openForm(id, preset) {
    const product = id ? ops.findProduct(id) : null;
    const p = product || model.normProduct(O(preset), A(store.state.products).length);
    const m = ui.modal({
      title: product ? 'Modifier l’article' : 'Nouvel article',
      body: '<form id="product-form" class="form-grid">'
        + '<label class="field wide"><span>Nom *</span><input name="name" value="' + esc(p.name) + '" required autofocus></label>'
        + '<label class="field"><span>Catégorie</span><select name="category">' + ui.selectOptions(model.CATEGORIES, p.category) + '</select></label>'
        + '<label class="field"><span>État</span><select name="condition">' + ui.selectOptions(model.CONDITIONS, p.condition) + '</select></label>'
        + '<label class="field"><span>Référence / IMEI</span><input name="ref" value="' + esc(p.ref) + '"></label>'
        + '<label class="field"><span>Variante</span><input name="variant" value="' + esc(p.variant) + '" placeholder="Couleur, capacité…"></label>'
        + '<label class="field"><span>Fournisseur</span><input name="supplier" value="' + esc(p.supplier) + '"></label>'
        + '<label class="field"><span>Quantité</span><input name="qty" inputmode="numeric" value="' + esc(String(I(p.qty, 0, 0))) + '"></label>'
        + '<label class="field"><span>Seuil d’alerte</span><input name="minQty" inputmode="numeric" value="' + esc(String(I(p.minQty, 0, 0))) + '" placeholder="0 = seuil général"></label>'
        + '<label class="field"><span>Prix d’achat</span><input name="cost" inputmode="decimal" value="' + esc(String(M(p.cost, 0))) + '"></label>'
        + '<label class="field"><span>Prix de vente</span><input name="price" inputmode="decimal" value="' + esc(String(M(p.price, 0))) + '"></label>'
        + '<label class="field wide"><span>Notes</span><textarea name="notes" rows="2">' + esc(p.notes) + '</textarea></label>'

    ui.$('#product-form', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit(); });

        + '<form id="restock-form"><label class="field"><span>Quantité à ajouter</span>'
        + '<input name="qty" inputmode="numeric" value="1" autofocus></label>'
        + '<div class="chips">' + [1, 2, 5, 10, 20, 50].map((n) =>
          '<button type="button" class="chip" data-quick="' + n + '">+' + n + '</button>').join('') + '</div></form>',
      footer: '<button type="button" class="btn ghost" data-close>Annuler</button>'
        + '<button type="button" class="btn primary" data-act="ok">Ajouter au stock</button>',

    const input = () => ui.$('input[name="qty"]', m.el);
    ui.on(m.el, '[data-quick]', 'click', (e, el) => { input().value = el.dataset.quick; });
    const submit = () => {
      const n = I(input().value, 0, 0);
      if (n <= 0) { ui.toast('Saisissez une quantité supérieure à zéro.', 'info'); return; }
      ops.adjustStock(product.id, n);
      m.close();
      ui.toast(product.name + ' : +' + n + ' en stock.', 'success');
      MS.app.render();
    };
    ui.on(m.el, '[data-act="ok"]', 'click', submit);
    ui.$('#restock-form', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  }

  function exportCsv(list) {
    const settings = O(store.state.settings);
    const rows = [['Produit', 'Variante', 'Catégorie', 'État', 'Référence', 'Fournisseur', 'Quantité', 'Seuil', 'Prix achat', 'Prix vente', 'Niveau', 'Créé le']];
    A(list).forEach((p) => rows.push([
      p.name, p.variant, p.category, p.condition, p.ref, p.supplier,
      String(I(p.qty, 0, 0)), String(I(p.minQty, 0, 0)),
      M(p.cost, 0).toFixed(2), M(p.price, 0).toFixed(2),
      model.STOCK_LEVEL_LABEL[model.stockLevel(p, settings)], fmtDate(p.createdAt),
    ]));
    ui.exportCsv('stock-' + dayKey(new Date()) + '.csv', rows);
  }

  MS.screens.stock = { render, openForm, openRestock, view };
})();

/* ============================================================

(function () {
  const MS = globalThis.MS;

  const ui = MS.ui, store = MS.store, model = MS.model, ops = MS.ops;

  function render(host) {
    const settings = O(store.state.settings);

  }

  function section(title, list, kind, emptyText) {

    const settings = O(store.state.settings);
    return '<section class="card"><h2>' + esc(title) + ' <span class="muted">— ' + list.length + '</span></h2>'
      + '<div class="table-wrap"><table class="table"><thead><tr>'
      + '<th>Produit</th><th>Catégorie</th><th class="num">Quantité</th><th class="num">Seuil</th><th>Fournisseur</th><th class="col-act">Actions</th>'
      + '</tr></thead><tbody>'
      + list.map((p) => '<tr>'
        + '<td data-label="Produit"><span class="cell-main">' + esc(p.name) + '</span>'
        + ui.foldout([
          { label: 'Catégorie', value: p.category },
          { label: 'Seuil', value: String(model.threshold(p, settings)) },
          { label: 'Fournisseur', value: p.supplier },
        ]) + '</td>'
        + '<td data-label="Catégorie">' + esc(p.category) + '</td>'

(function () {

  const view = { q: '', status: '' };

  function statusKind(status) {
    if (S(status) === 'Livré') return 'done';
    if (S(status) === 'Terminé') return 'good';
    if (S(status) === 'Attente pièces') return 'warn';
    if (S(status) === 'En réparation') return 'info';
    return 'neutral';
  }

  function filtered() {
    const q = norm(view.q);
    const qd = digits(view.q);
    return A(store.state.repairs).filter((r) => {
      if (view.status && S(r.status) !== view.status) return false;
      if (!q) return true;
      const hay = norm([r.number, r.device, r.issue, r.imei, r.clientName, r.notes, r.deviceState].join(' '));
      if (hay.indexOf(q) > -1) return true;
      if (qd.length >= 2 && digits(r.clientPhone).indexOf(qd) > -1) return true;
      if (qd.length >= 2 && digits(r.imei).indexOf(qd) > -1) return true;
      return false;
    });

  function render(host) {
    const list = filtered();

      + '<label class="field grow"><span>Rechercher</span>'

      + '</div><div class="chips" role="group" aria-label="Statut">'

      + A(store.state.repairs).length + ')</button>'
      + model.REPAIR_STATUSES.map((s) => '<button type="button" class="chip' + (view.status === s ? ' on' : '') + '" data-status="' + esc(s) + '">'
        + esc(s) + ' (' + (counts[s] || 0) + ')</button>').join('')
      + '</div></section>'
      + listHtml(list);

    const q = ui.$('#rep-q', host);
    if (q) q.addEventListener('input', MS.util.debounce(() => { view.q = S(q.value); MS.app.render(); }, 180));
    ui.on(host, '[data-status]', 'click', (e, el) => { view.status = S(el.dataset.status); MS.app.render(); });
    ui.on(host, '[data-act="new"]', 'click', () => openForm());

  function listHtml(list) {
    if (!list.length) {
      return '<section class="card">' + ui.empty(

        '<button type="button" class="btn primary" data-act="new">Créer une fiche</button>') + '</section>';

    return '<section class="card"><div class="table-wrap"><table class="table repairs-table"><thead><tr>'
      + '<th>N°</th><th>Client</th><th>Appareil</th><th>Panne</th><th>Statut</th><th class="num">Reste dû</th><th class="col-act">Actions</th>'
      + '</tr></thead><tbody>'
      + list.map((r) => {
        const balance = model.repairBalance(r);
        return '<tr data-id="' + esc(r.id) + '">'
          + '<td data-label="N°"><a class="cell-main link" href="#/repair/' + esc(r.id) + '">' + esc(r.number) + '</a>'
          + '<span class="cell-sub">' + esc(fmtDate(r.createdAt)) + '</span>'
          + ui.foldout([
            { label: 'Client', value: r.clientName || 'Passage' },
            { label: 'Tél.', value: r.clientPhone },
            { label: 'Appareil', value: r.device },
            { label: 'Panne', value: r.issue },
            { label: 'Reste dû', value: ui.money(balance) },
          ]) + '</td>'
          + '<td data-label="Client">' + esc(r.clientName || 'Client de passage')
          + (r.clientPhone ? '<span class="cell-sub">' + esc(r.clientPhone) + '</span>' : '') + '</td>'
          + '<td data-label="Appareil">' + esc(r.device || '—') + (r.imei ? '<span class="cell-sub">IMEI ' + esc(r.imei) + '</span>' : '') + '</td>'
          + '<td data-label="Panne" class="col-issue">' + esc(r.issue || '—') + '</td>'
          + '<td data-label="Statut">' + ui.badge(r.status, statusKind(r.status)) + '</td>'
          + '<td data-label="Reste dû" class="num">' + esc(ui.money(balance)) + '</td>'
          + '<td class="col-act" data-label="Actions"><div class="row-btns">'
          + '<a class="icon-btn" href="#/repair/' + esc(r.id) + '" aria-label="Ouvrir la fiche">' + ui.icon('doc') + '</a>'
          + '<button type="button" class="icon-btn" data-act="edit" aria-label="Modifier">' + ui.icon('edit') + '</button>'
          + '</div></td></tr>';
      }).join('')
      + '</tbody></table></div></section>';
  }

  /* ---------------------------------------------------------
     Formulaire de fiche (creation et modification)
     --------------------------------------------------------- */

  function openForm(id) {
    const repair = id ? ops.findRepair(id) : null;
    const r = repair || model.normRepair({}, A(store.state.repairs).length);
    const draft = {
      clientId: S(r.clientId),
      clientName: S(r.clientName),
      clientPhone: S(r.clientPhone),
    };

    const m = ui.modal({
      title: repair ? 'Modifier ' + r.number : 'Nouvelle réparation',
      size: 'lg',
      body: '<form id="repair-form" class="form-grid">'
        + clientPickerHtml(draft)
        + '<label class="field"><span>Appareil *</span><input name="device" id="rep-device" value="' + esc(r.device) + '" placeholder="Ex. iPhone 13 Pro" required></label>'
        + '<label class="field"><span>IMEI / n° de série</span><input name="imei" value="' + esc(r.imei) + '"></label>'
        + '<label class="field wide"><span>Panne déclarée *</span><input name="issue" value="' + esc(r.issue) + '" placeholder="Ex. écran cassé, ne charge plus" required></label>'
        + '<label class="field wide"><span>État constaté à la réception</span><textarea name="deviceState" rows="2" placeholder="Rayures, coque absente, vitre arrière fêlée…">' + esc(r.deviceState) + '</textarea></label>'
        + '<label class="field"><span>Code de déverrouillage</span><input name="passcode" value="' + esc(r.passcode) + '"></label>'
        + '<label class="field"><span>Statut</span><select name="status">' + ui.selectOptions(model.REPAIR_STATUSES, r.status) + '</select></label>'
        + '<label class="field"><span>Prix estimé</span><input name="price" inputmode="decimal" id="rep-price" value="' + esc(String(M(r.price, 0))) + '"></label>'
        + '<label class="field"><span>Acompte</span><input name="deposit" inputmode="decimal" value="' + esc(String(M(r.deposit, 0))) + '"></label>'
        + '<div class="field wide"><span class="field-label">Tarif de la grille</span>'
        + '<div id="tariff-zone" class="tariff-zone"><p class="muted">Saisissez l’appareil pour voir les tarifs correspondants.</p></div></div>'
        + '<label class="field wide"><span>Notes internes</span><textarea name="notes" rows="2">' + esc(r.notes) + '</textarea></label>'
        + '</form>',
      footer: '<button type="button" class="btn ghost" data-close>Annuler</button>'
        + '<button type="button" class="btn primary" data-act="save">' + (repair ? 'Enregistrer' : 'Créer la fiche') + '</button>',
    });
    if (!m) return;

    mountClientPicker(m.el, draft);
    mountTariff(m.el);

    const submit = () => {
      const form = ui.$('#repair-form', m.el);
      const data = Object.fromEntries(new FormData(form).entries());
      data.clientId = draft.clientId;
      data.clientName = S(data.clientQuery !== undefined ? draft.clientName : draft.clientName);
      data.clientPhone = draft.clientPhone;
      delete data.clientQuery;
      const res = repair ? ops.updateRepair(repair.id, data) : ops.createRepair(data);
      if (!res.ok) { ui.toast(res.error, 'error'); return; }
      m.close();
      ui.toast(repair ? 'Fiche mise à jour.' : 'Fiche ' + res.repair.number + ' créée.', 'success');
      if (!repair) MS.app.go('repair/' + res.repair.id);
      else MS.app.render();
    };
    ui.on(m.el, '[data-act="save"]', 'click', submit);
    ui.$('#repair-form', m.el).addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  }

  /* -------------------- Recherche de client integree -------------------- */

  function clientPickerHtml(draft) {
    const attached = draft.clientId ? ops.findClient(draft.clientId) : null;
    return '<div class="field wide client-picker">'
      + '<span class="field-label">Client</span>'
      + '<div class="picker-row">'
      + '<input id="client-q" name="clientQuery" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="client-results"'
      + ' value="' + esc(attached ? attached.name : draft.clientName) + '" placeholder="Nom, prénom ou téléphone…">'
      + '<button type="button" class="btn small ghost" id="client-detach"' + (attached ? '' : ' hidden') + '>Détacher</button>'
      + '<button type="button" class="btn small" id="client-create">' + ui.icon('plus') + ' Nouveau client</button>'
      + '</div>'
      + '<div id="client-state" class="picker-state">' + pickerStateHtml(draft) + '</div>'
      + '<ul id="client-results" class="picker-results" role="listbox" hidden></ul>'
      + '</div>';
  }

  function pickerStateHtml(draft) {
    const attached = draft.clientId ? ops.findClient(draft.clientId) : null;
    if (attached) {
      return '<span class="pill-ok">' + ui.icon('check') + ' Fiche rattachée : <b>' + esc(attached.name) + '</b>'
        + (attached.phone ? ' — ' + esc(attached.phone) : '')
        + ' · ' + ops.countRepairs(attached.id) + ' réparation(s)</span>';
    }
    if (S(draft.clientName)) {
      return '<span class="pill-info">Client de passage : <b>' + esc(draft.clientName) + '</b>'
        + (draft.clientPhone ? ' — ' + esc(draft.clientPhone) : '') + '</span>';
    }
    return '<span class="muted">Aucun client rattaché. Le texte saisi devient le nom du client de passage.</span>';
  }

  function mountClientPicker(root, draft) {
    const input = ui.$('#client-q', root);
    const results = ui.$('#client-results', root);
    const stateEl = ui.$('#client-state', root);
    const detach = ui.$('#client-detach', root);
    if (!input || !results) return;
    let items = [];
    let active = -1;

    const refreshState = () => {
      stateEl.innerHTML = pickerStateHtml(draft);
      if (detach) detach.hidden = !draft.clientId;
    };

    const closeList = () => {
      results.hidden = true;
      results.innerHTML = '';
      input.setAttribute('aria-expanded', 'false');
      active = -1;
    };

    const paint = () => {
      if (!items.length) { closeList(); return; }
      results.innerHTML = items.map((hit, i) =>
        '<li role="option" id="cli-opt-' + i + '" class="picker-item' + (i === active ? ' active' : '') + '" data-idx="' + i + '" aria-selected="' + (i === active) + '">'
        + '<span class="pi-name">' + esc(hit.client.name) + '</span>'
        + '<span class="pi-phone">' + esc(hit.client.phone || '—') + '</span>'
        + '<span class="pi-count">' + hit.repairs + ' rép.</span></li>').join('');
      results.hidden = false;
      input.setAttribute('aria-expanded', 'true');
    };

    const choose = (i) => {
      const hit = items[i];
      if (!hit) return;
      draft.clientId = hit.client.id;
      draft.clientName = hit.client.name;
      draft.clientPhone = hit.client.phone;
      input.value = hit.client.name;
      closeList();
      refreshState();
    };

    input.addEventListener('input', () => {
      const value = S(input.value);
      // Ne jamais bloquer : le texte saisi devient le nom du client de passage.
      if (draft.clientId) draft.clientId = '';
      draft.clientName = value;
      draft.clientPhone = '';
      items = ops.searchClients(value, 8);
      active = items.length ? 0 : -1;
      paint();
      refreshState();
    });

    input.addEventListener('keydown', (e) => {
      if (results.hidden) {
        if (e.key === 'ArrowDown') { items = ops.searchClients(S(input.value), 8); active = 0; paint(); e.preventDefault(); }
        return;
      }
      if (e.key === 'ArrowDown') { active = Math.min(items.length - 1, active + 1); paint(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { active = Math.max(0, active - 1); paint(); e.preventDefault(); }
      else if (e.key === 'Enter') { if (active > -1) { choose(active); e.preventDefault(); } }
      else if (e.key === 'Escape') { closeList(); }
    });

    input.addEventListener('blur', () => setTimeout(closeList, 150));
    ui.on(results, '.picker-item', 'mousedown', (e, el) => { e.preventDefault(); choose(I(el.dataset.idx, 0, 0)); });

    if (detach) detach.addEventListener('click', () => {
      // Detache la fiche sans effacer le nom.
      draft.clientId = '';
      draft.clientName = S(input.value);
      refreshState();
      input.focus();
    });

    const createBtn = ui.$('#client-create', root);
    if (createBtn) createBtn.addEventListener('click', () => {
      MS.screens.clients.openForm(null, { name: S(input.value) }, (client) => {
        draft.clientId = client.id;
        draft.clientName = client.name;
        draft.clientPhone = client.phone;
        input.value = client.name;
        refreshState();
      });
    });

    refreshState();
  }

  /* -------------------- Reprise d'un tarif depuis la grille -------------------- */

  function mountTariff(root) {
    const device = ui.$('#rep-device', root);
    const zone = ui.$('#tariff-zone', root);
    const price = ui.$('#rep-price', root);
    if (!device || !zone) return;

    const refresh = () => {
      const value = S(device.value).trim();
      if (!value) { zone.innerHTML = '<p class="muted">Saisissez l’appareil pour voir les tarifs correspondants.</p>'; return; }
      const hit = ops.findPricing(value);
      if (!hit) {
        // Un appareil absent de la grille le dit au lieu de deviner.
        zone.innerHTML = '<p class="muted">' + ui.icon('alert') + ' Aucun tarif pour « ' + esc(value) + ' » dans les grilles. '
          + '<a href="#/pricing" data-close>Compléter la grille</a></p>';
        return;
      }
      zone.innerHTML = '<p class="muted">Grille <b>' + esc(hit.tab.name) + '</b> — modèle <b>' + esc(hit.row.model) + '</b></p>'
        + '<div class="chips">' + hit.prices.map((p, i) =>
          '<button type="button" class="chip tariff" data-tariff="' + i + '"><b>' + esc(p.label) + '</b> ' + esc(p.value) + '</button>').join('')
        + '</div>';
      ui.on(zone, '[data-tariff]', 'click', (e, el) => {
        const chosen = hit.prices[I(el.dataset.tariff, 0, 0)];
        if (!chosen) return;
        const n = ops.priceFromText(chosen.value);
        if (n === null) {
          ui.toast('« ' + chosen.value +' » n’est pas un montant : reportez-le à la main.', 'info', 5000);
          return;
        }
        if (price) price.value = String(n);
        ui.toast(chosen.label + ' : ' + ui.money(n) + ' reporté dans le prix estimé.', 'success');
      });
    };

    device.addEventListener('input', MS.util.debounce(refresh, 250));
    refresh();
  }

  MS.screens.repairs = { render, openForm, view, statusKind };
})();

  /* -------------------- Interactions -------------------- */

  function bind(host, repair) {
    ui.on(host, '[data-act="edit"]', 'click', () => MS.screens.repairs.openForm(repair.id));
    ui.on(host, '[data-status]', 'click', (e, el) => changeStatus(repair, S(el.dataset.status)));

    ui.on(host, '[data-act="toggle-part"]', 'click', (e, el) => {

    });
    ui.on(host, '[data-act="del-part"]', 'click', async (e, el) => {

        title: 'Retirer la pièce', danger: true, confirmLabel: 'Retirer',

    ui.on(host, '[data-act="part-qty"]', 'click', async (e, el) => {

    if (S(status) === S(repair.status)) return;
    const note = await ui.prompt({
      title: 'Passer au statut « ' + status + ' »',
      label: 'Note (facultative)',
      confirmLabel: 'Changer le statut',
    });

    if (status === 'Terminé') openFinish(ops.findRepair(repair.id));

  /* -------------------- Pièces -------------------- */

  function openPartForm(repair) {
    const products = A(store.state.products);
    const m = ui.modal({
      title: 'Ajouter une pièce',
      body: '<form id="part-form" class="form-grid">'
        + '<label class="field wide"><span>Article du stock</span><select name="productId" id="part-product">'
        + '<option value="">— Pièce hors stock —</option>'
        + products.map((p) => '<option value="' + esc(p.id) + '" data-name="' + esc(p.name) + '" data-price="' + esc(String(M(p.price, 0)))
          + '" data-cost="' + esc(String(M(p.cost, 0))) + '">' + esc(p.name) + ' — ' + I(p.qty, 0, 0) + ' en stock</option>').join('')
        + '</select></label>'
        + '<label class="field wide"><span>Nom de la pièce *</span><input name="name" id="part-name" required></label>'
        + '<label class="field"><span>Quantité</span><input name="qty" inputmode="numeric" value="1"></label>'
        + '<label class="field"><span>Prix facturé (unité)</span><input name="price" id="part-price" inputmode="decimal" value="0"></label>'

      ui.$('#part-price', m.el).value = S(opt.dataset.price);
      ui.$('#part-cost', m.el).value = S(opt.dataset.cost);
      ui.$('#part-stock', m.el).checked = true;
    });

      const form = ui.$('#part-form', m.el);
      const data = Object.fromEntries(new FormData(form).entries());
      data.fromStock = !!ui.$('#part-stock', m.el).checked;
      const res = ops.addPart(repair.id, data);

  /* -------------------- Encaissement rattaché -------------------- */

  function openCash(repair) {
    const balance = model.repairBalance(repair);
    const m = ui.modal({
      title: 'Encaisser — ' + repair.number,
      size: 'sm',
      body: '<form id="repcash" class="form-grid">'
        + '<label class="field"><span>Montant</span><input name="amount" inputmode="decimal" value="' + esc(String(Math.max(0, balance))) + '" autofocus></label>'
        + '<label class="field"><span>Mode de paiement</span><select name="method">' + ui.selectOptions(model.PAY_METHODS, model.PAY_METHODS[0]) + '</select></label>'
        + '<label class="field check wide"><input type="checkbox" name="deliver"' + (S(repair.status) === 'Terminé' ? ' checked' : '') + '>'
        + '<span>Passer la fiche en « Livré »</span></label>'
        + '<p class="muted wide">L’opération sera rattachée à cette fiche dans le journal de caisse.</p>'
        + '</form>',
      footer: '<button type="button" class="btn ghost" data-close>Annuler</button>'
        + '<button type="button" class="btn primary" data-act="ok">Encaisser</button>',
    });
    if (!m) return;
    const submit = () => {
      const data = Object.fromEntries(new FormData(ui.$('#repcash', m.el)).entries());
      const res = ops.recordCash({
        amount: S(data.amount), type: 'Réparation', method: S(data.method),
        label: repair.number + ' — ' + repair.device, clientId: repair.clientId, repairId: repair.id,
      });
      if (!res.ok) { ui.toast(res.error, 'error'); return; }
      // L'acompte enregistre absorbe l'encaissement : le reste du est recalcule.
      const fresh = ops.findRepair(repair.id);
      if (fresh) ops.updateRepair(fresh.id, { deposit: M(fresh.deposit, 0) + M(res.op.amount, 0) });
      if (data.deliver) ops.setRepairStatus(repair.id, 'Livré', 'Appareil remis au client');
      m.close();
      ui.toast('Encaissement de ' + ui.money(res.op.amount) + ' enregistré.', 'success');
      MS.app.render();
    };

  }

  /* -------------------- Fin d'intervention -------------------- */

  function smsText(repair) {
    const settings = O(store.state.settings);
    const client = ops.findClient(repair.clientId);
    const name = S(client ? client.name : repair.clientName) || 'Bonjour';
    return S(settings.smsTemplate)
      .replace(/\{client\}/gi, name)
      .replace(/\{appareil\}/gi, S(repair.device))
      .replace(/\{boutique\}/gi, S(settings.shopName))
      .replace(/\{montant\}/gi, ui.money(model.repairBalance(repair)))
      .replace(/\{reference\}/gi, S(repair.number))
      .replace(/\{garantie\}/gi, String(I(settings.warrantyMonths, 3, 0)));
  }

  function openFinish(repair) {
    if (!repair) return;
    const balance = model.repairBalance(repair);
    const phone = S(repair.clientPhone) || S(O(ops.findClient(repair.clientId)).phone);
    const parts = A(repair.parts);
    const pending = parts.filter((p) => !p.fromStock && S(p.productId));

    const m = ui.modal({
      title: 'Fin d’intervention — ' + repair.number,

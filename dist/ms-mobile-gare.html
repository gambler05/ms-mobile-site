<style>
/* ============================================================
   MS-MOBILE — feuille de style unique
   Langage visuel institutionnel : canevas quasi blanc, indigo navy
   pour la structure, seafoam pour les chiffres et les données,
   orange en accent rare. Chrome plat, profondeur par ombres fines.
   Thème clair par défaut, thème sombre en inversion.
   ============================================================ */

:root {
  /* Marque (injectée au build) */
  --accent: #111a4a;
  --accent-2: #1e4199;
  --accent-ink: #ffffff;

  /* Palette */
  --navy: #111a4a;
  --midnight: #011821;
  --slate: #3b3e47;
  --steel: #7c7f88;
  --fog: #a9acb6;
  --mist: #cbcccf;
  --silver: #e3e4e8;
  --canvas: #f6f6f8;
  --charcoal: #232730;
  --orange: #ec652b;
  --peach: #f2936b;
  --seafoam: #44b48b;
  --seafoam-700: #167e6c;
  --seafoam-400: #94efb7;
  --sky: #88deeb;

  /* Surfaces et texte */
  --bg: var(--canvas);
  --bg-2: #eeeef1;
  --surface: #ffffff;
  --surface-solid: #ffffff;
  --surface-2: #f6f6f8;
  --border: #e3e4e8;
  --border-strong: #cbcccf;
  --ink: var(--navy);
  --ink-2: var(--steel);
  --ink-3: var(--fog);

  /* États. Le système n'a pas de rouge : l'orange de signal porte
     l'alerte, sa version douce la vigilance, le seafoam le positif. */
  --good: var(--seafoam-700);
  --good-bg: rgba(68, 180, 139, .14);
  --warn: #b4491d;
  --warn-bg: rgba(242, 147, 107, .18);
  --bad: var(--orange);
  --bad-bg: rgba(236, 101, 43, .12);
  --info: var(--navy);
  --info-bg: rgba(17, 26, 74, .07);

  /* Élévation */
  --shadow-card: rgba(18, 22, 30, .024) 0 1px 4px 0, rgba(18, 22, 30, .05) 0 1px 0 0, rgba(18, 22, 30, .024) 0 0 0 1px;
  --shadow-btn: rgba(17, 26, 74, .1) 0 1px 3px 0, rgba(17, 26, 74, .05) 0 1px 0 0,
                rgba(255, 255, 255, .5) 0 1px 0 0 inset, rgba(255, 255, 255, .5) 0 1px 4px 0 inset;
  --shadow-md: rgba(17, 26, 74, .05) 0 8px 16px 0, rgba(17, 26, 74, .05) 0 4px 8px 0;
  --shadow-float: rgba(30, 30, 44, .15) 24px 48px 64px 0, #fff 0 0 0 1px inset;
  --shadow: var(--shadow-card);

  /* Formes et rythme */
  --radius: 8px;
  --radius-lg: 8px;
  --radius-sm: 8px;
  --radius-pill: 9999px;
  --sidebar: 256px;
  --card-padding: 24px;

  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --blur: saturate(140%) blur(8px);
}

/* Inversion sombre. L'indigo disparaît sur fond sombre : le seafoam
   prend le relais comme couleur d'action. */
:root[data-theme="dark"] {
  /* Les alias de palette suivent le thème : sans cela, les composants qui
     appellent --slate ou --steel écrivent en gris foncé sur fond sombre. */
  --slate: #d5e3e7;
  --steel: #9fb3bb;
  --fog: #7e949b;
  --mist: #5f747b;
  --charcoal: #eaf3f5;
  --silver: rgba(255, 255, 255, .09);
  --canvas: #011821;
  --seafoam-700: #6fd4ae;

  --bg: #011821;
  --bg-2: #01131a;
  --surface: #04222d;
  --surface-solid: #062a37;
  --surface-2: rgba(255, 255, 255, .04);
  --border: rgba(255, 255, 255, .09);
  --border-strong: rgba(255, 255, 255, .18);
  --ink: #eaf3f5;
  --ink-2: #9fb3bb;
  --ink-3: #73898f;
  --accent: #44b48b;
  --accent-2: #94efb7;
  --accent-ink: #01222e;
  --good: #7ddcb4;
  --good-bg: rgba(68, 180, 139, .18);
  --warn: #f2936b;
  --warn-bg: rgba(242, 147, 107, .16);
  --bad: #ff8455;
  --bad-bg: rgba(236, 101, 43, .2);
  --info: #9fb3bb;
  --info-bg: rgba(255, 255, 255, .07);
  --shadow-card: rgba(0, 0, 0, .3) 0 1px 4px 0, rgba(255, 255, 255, .06) 0 0 0 1px;
  --shadow-btn: rgba(0, 0, 0, .35) 0 1px 3px 0;
  --shadow-md: rgba(0, 0, 0, .4) 0 8px 20px 0;
  --shadow-float: rgba(0, 0, 0, .5) 24px 48px 64px 0;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--slate);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  font-feature-settings: "cv11", "salt" 2;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
:root[data-theme="dark"] body { color: var(--ink-2); }

h1, h2, h3 { margin: 0 0 .4em; line-height: 1.1; color: var(--ink); font-weight: 500; }
h1 { font-size: 20px; letter-spacing: -.2px; }
h2 { font-size: 20px; letter-spacing: -.2px; }
h3 { font-size: 16px; letter-spacing: -.01em; }
p { margin: 0 0 .6em; }
a { color: var(--accent); }
a.link { text-decoration: none; font-weight: 500; }
a.link:hover { text-decoration: underline; }

/* Le monospace signale la donnée technique : identifiants, codes, clés. */
code, .mono { font-family: var(--mono); font-size: 14px; color: var(--seafoam-700); }
:root[data-theme="dark"] code, :root[data-theme="dark"] .mono { color: var(--accent); }
.small { font-size: 12px; }
.big { font-size: 28px; letter-spacing: -.28px; }
.muted { color: var(--ink-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.neg { color: var(--bad); }
.due { color: var(--bad); }
.paid { color: var(--good); }
.warn-text { color: var(--warn); display: flex; align-items: center; gap: .4em; }
[hidden] { display: none !important; }

.ic { width: 1.05em; height: 1.05em; fill: currentColor; flex: none; vertical-align: -.15em; }

/* -------------------- Coquille -------------------- */

#shell { display: flex; gap: 16px; padding: 16px; min-height: 100vh; }

.nav {
  width: var(--sidebar);
  flex: none;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 20px 12px;
  position: sticky;
  top: 16px;
  height: calc(100vh - 32px);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.nav::-webkit-scrollbar { width: 8px; }
.nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; }
.brand-logo {
  width: 38px; height: 48px; border-radius: var(--radius); flex: none;
  background: var(--navy); color: #fff; display: grid; place-items: center;
  font-weight: 500; font-size: 14px; letter-spacing: -.01em;
}
.brand-logo.has-logo { width: auto; height: auto; background: none; padding: 0; box-shadow: none; }
:root[data-theme="dark"] .brand-logo.has-logo { background: #fff; padding: 5px 7px; border-radius: var(--radius); }
.brand-logo img { height: 38px; width: auto; display: block; }
.brand-name { font-weight: 500; font-size: 16px; line-height: 1.3; letter-spacing: -.01em; color: var(--ink); }

.nav-group { margin-bottom: 24px; }
.nav-section {
  display: block; font-family: var(--mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--steel); padding: 0 10px 10px; font-weight: 400;
}
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 2px;
  border-radius: var(--radius); color: var(--slate); text-decoration: none;
  font-size: 14px; font-weight: 400;
  transition: background .15s ease, color .15s ease;
}
.nav-link .ic { width: 18px; height: 18px; color: var(--fog); transition: color .15s ease; }
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link:hover .ic { color: var(--charcoal); }
.nav-link.active {
  background: var(--accent); color: var(--accent-ink); font-weight: 500;
  box-shadow: var(--shadow-btn);
}
.nav-link.active .ic { color: var(--accent-ink); }
.nav-link .pill {
  margin-left: auto; background: var(--warn-bg); color: var(--warn); border-radius: var(--radius-pill);
  font-size: 10px; font-style: normal; padding: 2px 8px; font-weight: 500;
  font-family: var(--mono);
}
.nav-link.active .pill { background: rgba(255, 255, 255, .25); color: var(--accent-ink); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 20px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  position: sticky; top: 16px; z-index: 20;
}
.top-left, .top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.screen-title {
  font-size: 20px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-weight: 500; letter-spacing: -.2px; color: var(--ink);
}

.content { padding: 16px 0 100px; display: flex; flex-direction: column; gap: 16px; max-width: 1200px; width: 100%; }

.mobile-bar { display: none; }

/* -------------------- Boutons -------------------- */

.btn, .icon-btn, .chip, .tab, .switch-btn {
  font: inherit; cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--slate);
  border-radius: var(--radius);
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  padding: 12px 20px; text-decoration: none; font-weight: 500; font-size: 14px;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover, .icon-btn:hover, .chip:hover, .tab:hover { background: var(--surface-2); }
.btn:disabled, .icon-btn:disabled, .btn[disabled] { opacity: .45; cursor: not-allowed; }

/* Action principale : aplat indigo, jamais deux aplats côte à côte. */
.btn.primary {
  background: var(--accent); border-color: transparent; color: var(--accent-ink);
  box-shadow: var(--shadow-btn);
}
.btn.primary:hover { filter: brightness(1.12); }
/* Orange de signal : une seule surface saturée à la fois. */
.btn.danger { background: var(--orange); border-color: transparent; color: #fff; box-shadow: var(--shadow-btn); }
.btn.ghost { background: transparent; border-color: var(--accent); color: var(--accent); }
.btn.ghost:hover { background: var(--info-bg); }
.btn.small { padding: 7px 14px; font-size: 12px; }
.icon-btn { padding: 8px; border-color: transparent; background: transparent; color: var(--fog); }
.icon-btn:hover { background: var(--surface-2); color: var(--charcoal); }
.icon-btn.small { padding: 5px; }
.icon-btn.tiny { padding: 2px 5px; font-size: 12px; }
.danger-ghost { color: var(--fog); }
.danger-ghost:hover { background: var(--bad-bg); color: var(--orange); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.row-end { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.only-mobile { display: none; }

:where(.btn, .icon-btn, .chip, .tab, .switch-btn, .nav-link, input, select, textarea):focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.sync-pill {
  display: inline-flex; align-items: center; gap: .45em; border-radius: var(--radius-pill);
  padding: 6px 12px; font-size: 12px; font-weight: 500; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); cursor: pointer; font-family: inherit;
}
.sync-synced { background: var(--good-bg); color: var(--good); border-color: transparent; }
.sync-off { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.sync-offline { background: var(--info-bg); color: var(--info); border-color: transparent; }
.sync-denied { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.user-btn { gap: .4em; font-weight: 400; font-size: 14px; }

/* -------------------- Cartes et grilles -------------------- */

.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: var(--card-padding);
  box-shadow: var(--shadow-card);
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.card-head h2 { margin: 0; display: flex; align-items: center; gap: .5em; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.stats-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

/* Compteur : intitulé discret, chiffre en seafoam — la couleur des données. */
.stat {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  display: flex; flex-direction: column; gap: 4px;
  box-shadow: var(--shadow-card);
}
.stat-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.stat-chip {
  width: 32px; height: 32px; border-radius: var(--radius); flex: none; display: grid; place-items: center;
  background: var(--surface-2); color: var(--fog); box-shadow: rgba(0, 0, 0, .05) 0 0 0 1px inset;
}
.stat-chip .ic { width: 16px; height: 16px; }
.stat-label { font-size: 14px; color: var(--steel); font-weight: 400; max-width: 12em; }
.stat-value {
  font-size: 28px; font-weight: 500; line-height: 1.1; letter-spacing: -.28px;
  font-variant-numeric: tabular-nums; margin-top: 12px; color: var(--good);
}
.stat-hint { font-size: 12px; color: var(--steel); }
.stat-bad .stat-value { color: var(--bad); }
.stat-bad .stat-chip { background: var(--bad-bg); color: var(--bad); box-shadow: none; }
.stat-warn .stat-value { color: var(--warn); }
.stat-warn .stat-chip { background: var(--warn-bg); color: var(--warn); box-shadow: none; }
.stat-primary .stat-chip { background: var(--info-bg); color: var(--accent); box-shadow: none; }
.stat-neutral .stat-value { color: var(--ink); }

.badge {
  display: inline-block; padding: 4px 12px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 500;
  background: var(--surface-2); color: var(--slate); border: 1px solid var(--border);
  white-space: nowrap;
}
.badge-good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.badge-warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge-bad { background: var(--orange); color: #fff; border-color: transparent; }
.badge-info { background: var(--info-bg); color: var(--info); border-color: transparent; }
.badge-done { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.empty { text-align: center; padding: 48px 16px; color: var(--steel); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty .ic { width: 28px; height: 28px; color: var(--mist); }

.banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 20px; border-radius: var(--radius); font-size: 14px;
  background: var(--surface); box-shadow: var(--shadow-card);
}
.banner span { flex: 1; min-width: 200px; }
.banner .ic { color: currentColor; }
.banner-warn { color: var(--warn); background: var(--warn-bg); box-shadow: none; }
.banner-danger { color: var(--bad); background: var(--bad-bg); box-shadow: none; }
.banner-info { color: var(--info); background: var(--info-bg); box-shadow: none; }
#banners { display: flex; flex-direction: column; gap: 12px; }
#banners:empty { display: none; }

/* -------------------- Formulaires -------------------- */

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.form-grid .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field-label { font-size: 12px; font-weight: 500; color: var(--steel); }
.field.inline { flex-direction: column; }
.field.grow { flex: 1; min-width: 200px; }
.field.check { flex-direction: row; align-items: center; gap: 10px; }
.field.check span { font-size: 14px; color: var(--slate); }

input, select, textarea {
  font: inherit; font-size: 14px; color: var(--slate);
  background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 12px; width: 100%; min-width: 0;
  transition: border-color .15s ease, box-shadow .15s ease;
}
input:hover, select:hover, textarea:hover { border-color: var(--border-strong); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
input[readonly] { background: var(--surface-2); color: var(--steel); }
textarea { resize: vertical; }
.file-input { display: none; }
.form-error { color: var(--bad); font-size: 12px; font-weight: 500; min-height: 1em; margin: 0; }
::placeholder { color: var(--fog); opacity: 1; }

.filters { display: flex; flex-direction: column; gap: 16px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 16px; font-size: 12px; font-weight: 400; color: var(--charcoal); }
.chip.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 500; }
.chip.tariff { font-weight: 400; }
.chip.tariff b { font-weight: 500; color: var(--ink); }

.switch { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; gap: 3px; background: var(--surface-2); }
.switch-btn { border: none; background: transparent; border-radius: 6px; padding: 8px 16px; font-size: 14px; color: var(--steel); }
.switch-btn.on { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-btn); }

/* -------------------- Tableaux -------------------- */

.table-wrap { width: 100%; overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table thead th {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--fog); font-weight: 400; white-space: nowrap; padding-bottom: 10px;
}
.table tbody tr { transition: background .12s ease; }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:last-child td { border-bottom: none; }
.table tfoot th, .table tfoot td { border-top: 1px solid var(--border-strong); border-bottom: none; font-weight: 500; color: var(--ink); }
.cell-main { display: block; font-weight: 500; color: var(--ink); }
.cell-sub { display: block; font-size: 12px; color: var(--steel); }
/* Les identifiants sont de la donnée : monospace, teintés seafoam. */
.repairs-table td:first-child .cell-main, .repairs-table td:first-child .cell-sub { font-family: var(--mono); }
.repairs-table td:first-child .cell-main { color: var(--seafoam-700); font-weight: 400; }
:root[data-theme="dark"] .repairs-table td:first-child .cell-main { color: var(--accent); }
.col-act { width: 1%; white-space: nowrap; }
/* Dans une carte étroite, mieux vaut que les actions passent à la ligne
   que de sortir du cadre derrière un défilement horizontal. */
.parts-table .col-act .row-btns { flex-wrap: wrap; }
.col-act .row-btns { flex-wrap: nowrap; gap: 4px; }
.row-withdraw td { background: var(--warn-bg); }
.qty { font-size: 16px; font-variant-numeric: tabular-nums; font-weight: 500; color: var(--ink); }
.qty-out { color: var(--bad); }
.qty-low { color: var(--warn); }

.foldout { display: none; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 12px; color: var(--steel); }
.fold-item { white-space: nowrap; }
.fold-item b { color: var(--fog); font-weight: 400; }

.mini-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mini-list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.mini-list li:last-child { border-bottom: none; }
.mini-list a { text-decoration: none; color: inherit; flex: 1; min-width: 0; }
.mini-main { display: block; font-size: 14px; color: var(--slate); }
.mini-main b { color: var(--seafoam-700); font-family: var(--mono); font-weight: 400; white-space: nowrap; }
:root[data-theme="dark"] .mini-main b { color: var(--accent); }
.mini-sub { display: block; font-size: 12px; color: var(--steel); }

.deflist { margin: 0; display: flex; flex-direction: column; }
.def { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.def:last-child { border-bottom: none; }
.def dt { flex: 0 0 40%; max-width: 200px; color: var(--steel); font-size: 14px; font-weight: 400; }
.def dd { margin: 0; flex: 1; min-width: 0; word-break: break-word; color: var(--slate); }
.money-list .def dd { text-align: right; font-variant-numeric: tabular-nums; }

/* -------------------- Graphiques -------------------- */

.chart-wrap { width: 100%; overflow: hidden; }
.spark { width: 100%; height: auto; display: block; }
.spark-line { fill: none; stroke: var(--seafoam-700); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark-area { fill: var(--seafoam); opacity: .12; stroke: none; }
.spark-dot { fill: var(--seafoam-700); }
.spark-axis { stroke: var(--border); stroke-width: 1; }
.spark-label { font-size: 10px; fill: var(--fog); font-family: var(--mono); }
:root[data-theme="dark"] .spark-line, :root[data-theme="dark"] .spark-dot { stroke: var(--accent); fill: var(--accent); }
:root[data-theme="dark"] .spark-line { fill: none; }

.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.bars li { display: grid; grid-template-columns: minmax(90px, 1fr) 2fr auto; gap: 12px; align-items: center; font-size: 14px; }
.bar-label { color: var(--slate); }
.bar-track { background: var(--surface-2); border-radius: var(--radius-pill); height: 6px; overflow: hidden; box-shadow: rgba(0, 0, 0, .05) 0 0 0 1px inset; }
.bar-fill { display: block; height: 100%; background: var(--seafoam); border-radius: var(--radius-pill); }
.bar-value { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; color: var(--ink); }

/* -------------------- Fiche de réparation -------------------- */

.detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.status-line { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.step {
  font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface);
  color: var(--steel); border-radius: var(--radius); padding: 8px 14px; font-size: 12px; font-weight: 400;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.step:hover { background: var(--surface-2); color: var(--ink); }
.step.done { background: var(--good-bg); color: var(--good); border-color: transparent; }
.step.current { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: var(--shadow-btn); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 20px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; }
.timeline li { position: relative; font-size: 14px; }
.tl-dot { position: absolute; left: -25px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); }
.timeline b { color: var(--ink); font-weight: 500; }
.timeline p { margin: 4px 0 0; font-size: 12px; }

.sign-preview { margin: 16px 0 0; }
.sign-preview img { max-width: 240px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
.sign-pad { width: 100%; height: 200px; border: 1px dashed var(--border-strong); border-radius: var(--radius); background: #fff; touch-action: none; cursor: crosshair; }

.finish { display: flex; flex-direction: column; gap: 16px; }
.finish-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.finish-block h3 { display: flex; align-items: center; gap: .5em; }
.finish-parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.finish-parts li { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.finish-parts li span:first-child { flex: 1; min-width: 140px; }

/* -------------------- Recherche client -------------------- */

.client-picker { position: relative; }
.picker-row { display: flex; gap: 8px; flex-wrap: wrap; }
.picker-row input { flex: 1; min-width: 180px; }
.picker-state { font-size: 12px; margin-top: 6px; min-height: 1.3em; }
.pill-ok { color: var(--good); font-weight: 500; display: inline-flex; align-items: center; gap: .3em; flex-wrap: wrap; }
.pill-info { color: var(--accent); font-weight: 500; }
.picker-results {
  list-style: none; margin: 6px 0 0; padding: 6px; position: absolute; z-index: 30; left: 0; right: 0; top: 100%;
  background: var(--surface-solid); border-radius: var(--radius);
  box-shadow: var(--shadow-md), rgba(87, 90, 100, .12) 0 0 0 1px;
  max-height: 280px; overflow-y: auto;
}
.picker-item { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; align-items: center; }
.picker-item:hover, .picker-item.active { background: var(--accent); color: var(--accent-ink); }
.pi-phone { font-family: var(--mono); font-size: 12px; }
.picker-item.active .pi-phone, .picker-item:hover .pi-phone { color: var(--accent-ink); }
.pi-count { font-size: 12px; color: var(--steel); }
.picker-item.active .pi-count, .picker-item:hover .pi-count { color: var(--accent-ink); opacity: .8; }
.tariff-zone { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; background: var(--surface-2); }
.tariff-zone p { margin: 0 0 8px; }

/* -------------------- Panier -------------------- */

.cart { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.cart-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.cart-head h3 { margin: 0; }
.cart-add { display: flex; gap: 8px; flex: 1; min-width: 240px; }
.cart-add select { flex: 1; }
.cart-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; }
.cart-list li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.cart-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cart-qty { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.cart-price { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--ink); }
.cart-total { margin: 0; font-size: 14px; }

/* -------------------- Grilles tarifaires -------------------- */

.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { padding: 8px 16px; font-size: 14px; }
.tab.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); box-shadow: var(--shadow-btn); }
.pricing-wrap { max-height: 62vh; overflow: auto; }
.pricing-table { min-width: 560px; }
.pricing-table th, .pricing-table td { padding: 4px; }
.pricing-table thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; }
.pricing-table .sticky-col { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 150px; text-align: left; }
.pricing-table thead .sticky-col { z-index: 3; }
.col-head { display: flex; flex-direction: column; gap: 2px; }
.col-tools { display: flex; gap: 1px; }
.cell-input { padding: 8px; font-size: 14px; border-color: transparent; background: transparent; font-family: var(--mono); color: var(--seafoam-700); }
.cell-input:hover { border-color: var(--border); }
.cell-input:focus { border-color: var(--accent); background: var(--surface); }
.model-input { font-family: var(--font); font-weight: 500; color: var(--ink); }
:root[data-theme="dark"] .cell-input { color: var(--accent); }

/* -------------------- Journal, sauvegardes, rapports -------------------- */

.logs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.logs li { display: flex; gap: 16px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.logs li:last-child { border-bottom: none; }
.log-icon {
  color: var(--fog); flex: none; width: 32px; height: 32px; border-radius: var(--radius);
  display: grid; place-items: center; background: var(--surface-2);
  box-shadow: rgba(0, 0, 0, .05) 0 0 0 1px inset;
}
.log-body { flex: 1; min-width: 0; }
.log-body b { color: var(--ink); font-weight: 500; }
.log-detail { display: block; color: var(--steel); font-size: 12px; word-break: break-word; }
.log-meta { color: var(--fog); font-size: 10px; white-space: nowrap; font-family: var(--mono); }

.backup-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.backup-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; padding: 12px 16px; background: var(--surface-2); border-radius: var(--radius); }
.report-list { margin: 16px 0; padding-left: 18px; font-size: 14px; }
.report-errors { color: var(--bad); }
.report-fields summary { cursor: pointer; font-weight: 500; font-size: 14px; color: var(--ink); }
.report-fields p { word-break: break-word; margin-top: 8px; font-family: var(--mono); font-size: 12px; }
.logo-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo-preview { max-height: 48px; max-width: 160px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; padding: 4px; }
.locked { max-width: 440px; margin: 48px auto; }
.login-form { display: flex; flex-direction: column; gap: 16px; }
.login-logo { display: block; width: 58px; margin: 0 auto 20px; }
.more-nav { display: flex; flex-direction: column; gap: 4px; }
.more-link { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius); text-decoration: none; color: var(--slate); font-weight: 400; }
.more-link .ic { width: 18px; height: 18px; color: var(--fog); }
.more-link:hover { background: var(--surface-2); }

/* -------------------- Modales et messages -------------------- */

.modal-back {
  position: fixed; inset: 0; background: rgba(17, 26, 74, .28); z-index: 100;
  display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
}
:root[data-theme="dark"] .modal-back { background: rgba(1, 12, 17, .6); }
body.modal-open { overflow: hidden; }
.modal {
  background: var(--surface-solid); border-radius: var(--radius);
  box-shadow: var(--shadow-float);
  width: 100%; max-width: 620px; margin: auto;
}
.modal-sm { max-width: 440px; }
.modal-lg { max-width: 900px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; }
.modal-body { padding: 24px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 20px 24px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.lead { font-size: 18px; font-weight: 500; color: var(--ink); line-height: 1.33; }

#toast-root { position: fixed; z-index: 200; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; max-width: min(360px, calc(100vw - 48px)); }
.toast {
  display: flex; align-items: flex-start; gap: 10px; padding: 16px; border-radius: var(--radius);
  background: var(--surface-solid); color: var(--slate); font-size: 14px;
  box-shadow: var(--shadow-md), rgba(87, 90, 100, .12) 0 0 0 1px;
  animation: toast-in .18s ease-out;
}
.toast .ic { color: var(--fog); }
.toast-success .ic { color: var(--good); }
.toast-error .ic { color: var(--bad); }
.toast.out { opacity: 0; transform: translateY(6px); transition: opacity .22s, transform .22s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ============================================================
   Adaptation à la largeur — de 360 à 1600 px.
   Les colonnes s'effacent par ordre d'importance, leur contenu
   se replie sous le nom, puis chaque ligne devient un bloc.
   ============================================================ */

@media (max-width: 1240px) {
  .stock-table .col-sup, .table .col-sup { display: none; }
  .foldout { display: flex; }
  .fold-item { display: none; }
  .fold-item[data-k="sup"] { display: inline; }
}

@media (max-width: 1100px) {
  .stock-table .col-min { display: none; }
  .fold-item[data-k="min"] { display: inline; }
  .repairs-table .col-issue { display: none; }
  .fold-item[data-k="issue"] { display: inline; }
}

@media (max-width: 960px) {
  :root { --sidebar: 210px; }
  .stock-table .col-cat { display: none; }
  .fold-item[data-k="cat"] { display: inline; }
  .cash-table td:nth-child(4), .cash-table th:nth-child(4) { display: none; }
  .fold-item[data-k="method"] { display: inline; }
}

@media (max-width: 820px) {
  .nav { display: none; }
  .only-mobile { display: inline-flex; }
  .only-desk { display: none; }
  #shell { padding: 10px; gap: 0; }
  .content { padding: 10px 0 100px; }
  .topbar { padding: 8px 12px; top: 10px; }
  .stock-table .col-state, .stock-table .col-price { display: none; }
  .fold-item[data-k="state"], .fold-item[data-k="price"] { display: inline; }
  .mobile-bar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--surface);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-top: 1px solid var(--border);
    padding: 5px 2px calc(5px + env(safe-area-inset-bottom, 0px));
  }
  .mob-link {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 2px; font-size: .68rem; font-weight: 600; color: var(--ink-3);
    text-decoration: none; border: none; background: transparent; font-family: inherit; cursor: pointer;
    min-width: 0;
  }
  .mob-link span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
  .mob-link .ic { width: 20px; height: 20px; padding: 0; background: none; border-radius: 0; color: inherit; }
  .mob-link.active { color: var(--accent); }
  .mob-link.active .ic { color: var(--accent); }
}

/* Sous ce seuil, chaque ligne devient un bloc : rien n'est perdu. */
@media (max-width: 640px) {
  body { font-size: 14px; }
  /* Deux colonnes de compteurs : le contenu reste à portée de pouce. */
  .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 10px; }
  .stat-value { font-size: 1.25rem; }
  .table, .table tbody, .table tr, .table td, .table th { display: block; width: auto; }
  .table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .table tbody tr {
    border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px;
    padding: 8px 10px; background: var(--surface);
  }
  .table td, .table th { border-bottom: none; padding: 3px 0; text-align: left; }
  .table td[data-label]::before {
    content: attr(data-label) " "; display: inline-block; min-width: 92px;
    color: var(--ink-3); font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
  }
  .table td.num { text-align: left; }
  .table .col-act { width: auto; white-space: normal; }
  .table tfoot { display: block; }
  .table tfoot tr { display: flex; justify-content: space-between; gap: 10px; }
  .table tfoot th, .table tfoot td { border-top: none; }
  .stat-label { max-width: none; }
  /* En mode bloc, chaque champ porte déjà son intitulé : le repli n'a plus lieu d'être. */
  .foldout { display: none !important; }
  .stock-table .col-cat, .stock-table .col-price, .stock-table .col-state,
  .stock-table .col-min, .stock-table .col-sup, .repairs-table .col-issue,
  .cash-table td:nth-child(4) { display: block; }

      } catch (e) { return []; }
    },
  };

  const listeners = [];
  const store = {
    state: model.emptyState(),
    /** Vrai si cet appareil a deja enregistre quelque chose (regle anti-perte 2). */
    hasWritten: false,
    lastError: '',
  };

  function subscribe(fn) { if (typeof fn === 'function') listeners.push(fn); }
  function emit(reason) {
    listeners.forEach((fn) => { try { fn(store.state, reason); } catch (e) { console.error(e); } });
  }

  /* -------------------- Chargement -------------------- */

  function load() {
    const raw = LS.get(KEY);
    if (!raw) {
      store.state = model.emptyState();
      store.hasWritten = false;
      return store.state;
    }
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    if (!parsed) {
      // Fichier illisible : on ne perd rien, on le met de cote et on repart propre.
      LS.set(KEY + '.corrupt.' + Date.now(), raw.slice(0, 2000000));
      store.state = model.emptyState();
      store.hasWritten = false;
      return store.state;
    }
    store.state = model.normState(parsed);
    // Une base deja enregistree porte une date : cet appareil a donc ecrit.
    store.hasWritten = !!store.state.updatedAt;
    return store.state;
  }

  /* -------------------- Enregistrement -------------------- */

  /**
   * Enregistre l'etat. `opts.touch === false` conserve la date de mise a jour
   * (utile quand on applique une version distante : elle n'est pas plus recente
   * du fait de son arrivee).
   */

    const payload = JSON.stringify(store.state);
    if (!writeWithRoom(KEY, payload)) {
      store.lastError = "Le stockage du navigateur est plein : les données n’ont pas pu être enregistrées.";
      emit('save-failed');
      return false;
    }
    store.lastError = '';
    backupIfNeeded();
    if (o.silent !== true) emit(S(o.reason) || 'save');
    if (o.push !== false && MS.sync && MS.sync.onLocalSave) MS.sync.onLocalSave();
    return true;
  }

  /**
   * Ecrit en sacrifiant l'historique si la place manque.
   * L'enregistrement des donnees courantes ne doit jamais echouer a cause des sauvegardes.
   */
  function writeWithRoom(key, payload) {
    if (LS.set(key, payload)) return true;
    const backups = listBackups();
    for (let i = backups.length - 1; i >= 0; i--) {
      LS.del(backups[i].key);
      if (LS.set(key, payload)) return true;
    }
    LS.del(PRE_KEY);
    if (LS.set(key, payload)) return true;
    // Dernier recours : on allege le journal, jamais les donnees metier.
    if (A(store.state.logs).length) {
      store.state.logs = store.state.logs.slice(0, 50);
      const lighter = JSON.stringify(store.state);
      if (LS.set(key, lighter)) return true;
    }
    return false;
  }

  /**
   * Modification atomique : applique `fn` sur l'etat puis enregistre.
   * `fn` peut renvoyer false pour annuler.
   */
  function mutate(fn, opts) {
    if (typeof fn !== 'function') return false;
    let result;
    try { result = fn(store.state); }
    catch (e) { console.error(e); return false; }
    if (result === false) return false;
    return save(opts);
  }

  /* -------------------- Journal -------------------- */

  /**
   * Ajoute une ligne de journal. `opts.key` coalesce : une action repetee
   * sur la meme cible tient une seule ligne a jour au lieu d'en empiler dix.
   */
  function log(action, detail, icon, opts) {
    const o = O(opts);
    const user = MS.auth && MS.auth.currentUserName ? MS.auth.currentUserName() : '';
    const key = S(o.key);
    const logs = A(store.state.logs);
    if (key) {
      const idx = logs.findIndex((l) => S(O(l).key) === key);
      const WINDOW = 10 * 60 * 1000; // au-dela, c'est une nouvelle intention
      if (idx > -1 && Date.now() - new Date(logs[idx].date).getTime() < WINDOW) {
        const line = logs[idx];
        const meta = O(o.meta);
        const from = O(line.meta).from !== undefined ? O(line.meta).from : meta.from;
        // Retour au chiffre de depart : la ligne n'a plus lieu d'etre.
        if (o.dropIfSame && from !== undefined && String(from) === String(meta.to)) {
          logs.splice(idx, 1);
          store.state.logs = logs;
          return null;
        }
        line.action = S(action) || line.action;
        line.detail = typeof o.merge === 'function' ? S(o.merge(from, meta)) : S(detail);
        line.date = new Date().toISOString();
        line.user = user;
        line.meta = Object.assign({}, O(line.meta), meta, { from });
        logs.splice(idx, 1);
        logs.unshift(line);
        store.state.logs = logs;
        return line;
      }
      if (o.dropIfSame && O(o.meta).from !== undefined && String(O(o.meta).from) === String(O(o.meta).to)) return null;
    }
    const entry = model.normLog({
      id: uid('log'), action, detail, icon: icon || 'dot',
      date: new Date().toISOString(), user, key, meta: O(o.meta),
    });
    logs.unshift(entry);
    store.state.logs = logs.slice(0, model.LOG_CAP);
    return entry;
  }

  /* -------------------- Sauvegardes automatiques -------------------- */

  /** Une copie complete par jour, les trois dernieres conservees. */
  function backupIfNeeded() {
    const today = dayKey(new Date());
    const key = BAK_PREFIX + today;
    if (LS.get(key)) return false;
    const payload = JSON.stringify({
      date: new Date().toISOString(),
      counts: model.countRecords(store.state),
      state: store.state,
    });
    if (!LS.set(key, payload)) {
      // Pas de place : on sacrifie les plus anciennes, une a une.
      const backups = listBackups();
      for (let i = backups.length - 1; i >= 0; i--) {
        LS.del(backups[i].key);
        if (LS.set(key, payload)) break;
      }
    }
    pruneBackups();
    return true;
  }

  function listBackups() {
    return LS.keys()
      .filter((k) => k.indexOf(BAK_PREFIX) === 0)
      .map((k) => {
        let meta = {};
        try { meta = JSON.parse(LS.get(k)) || {}; } catch (e) { meta = {}; }
        return {
          key: k,
          day: k.slice(BAK_PREFIX.length),
          date: S(O(meta).date) || k.slice(BAK_PREFIX.length),
          counts: O(O(meta).counts),
        };
      })
      .sort((a, b) => (a.day < b.day ? 1 : -1));
  }

  function pruneBackups() {
    const backups = listBackups();
    backups.slice(BAK_KEEP).forEach((b) => LS.del(b.key));
  }

  function readBackup(key) {
    let parsed = null;
    try { parsed = JSON.parse(LS.get(key)); } catch (e) { parsed = null; }
    const st = O(parsed).state;
    return st ? model.normState(st) : null;
  }

  function restoreBackup(key) {
    const st = readBackup(key);
    if (!st) return false;
    snapshotCurrent('restauration');
    store.state = st;
    save({ reason: 'restore' });
    return true;
  }

  /**
   * Regle anti-perte 6 : avant tout remplacement, la version presente sur
   * l'appareil est copiee localement et proposee a la restauration.
   */
  function snapshotCurrent(reason) {
    if (model.isEmptyState(store.state)) return false;
    const payload = JSON.stringify({
      date: new Date().toISOString(),
      reason: S(reason),
      counts: model.countRecords(store.state),
      state: store.state,
    });
    return LS.set(PRE_KEY, payload);
  }

  function getSnapshot() {
    let parsed = null;
    try { parsed = JSON.parse(LS.get(PRE_KEY)); } catch (e) { parsed = null; }
    if (!parsed || !O(parsed).state) return null;
    return {
      date: S(parsed.date),
      reason: S(parsed.reason),
      counts: O(parsed.counts),
      state: model.normState(parsed.state),
    };
  }

  function restoreSnapshot() {
    const snap = getSnapshot();
    if (!snap) return false;
    store.state = snap.state;
    save({ reason: 'restore-snapshot' });
    LS.del(PRE_KEY);
    return true;
  }

  /** Remplace l'etat (import, restauration, reception distante). */
  function replaceState(next, opts) {
    const o = O(opts);
    if (o.snapshot !== false) snapshotCurrent(S(o.reason) || 'remplacement');
    store.state = model.normState(next);
    return save(o);
  }

  /** Effacement volontaire : marqueur pose au moment de l'action (regle 4). */
  function eraseAll() {
    snapshotCurrent('effacement');
    const settings = deepClone(store.state.settings);
    const fresh = model.emptyState();
    fresh.settings = model.normSettings(settings);
    fresh.erased = new Date().toISOString();
    store.state = fresh;
    log('Effacement total', 'Toutes les données ont été effacées', 'trash');
    return save({ reason: 'erase' });
  }

  MS.store = {
    get state() { return store.state; },
    set state(v) { store.state = v; },
    get hasWritten() { return store.hasWritten; },
    set hasWritten(v) { store.hasWritten = !!v; },
    get lastError() { return store.lastError; },
    KEY, PRE_KEY, BAK_PREFIX, LS,
    load, save, mutate, log, subscribe, emit,
    backupIfNeeded, listBackups, readBackup, restoreBackup, pruneBackups,
    snapshotCurrent, getSnapshot, restoreSnapshot, replaceState, eraseAll,
  };
})();

/* ===== 04-auth.js ===== */
/* ============================================================
   04 — Comptes, session, verrouillage
   Limite assumee : ce verrou protege l'interface, pas le fichier.
   ============================================================ */
(function () {
  const MS = globalThis.MS;
  const { S, I, A, O, uid, pick } = MS.util;
  const model = MS.model;
  const store = MS.store;

  const SESSION_KEY = MS.config.storageKey + '.session';
  const ATTEMPT_KEY = MS.config.storageKey + '.attempts';
  const LOCK_MS = 60 * 1000;

  const state = { user: null, lockedOut: 0, lastActivity: Date.now() };

  /* -------------------- Empreintes salees -------------------- */

  function randomHex(bytes) {
    const n = I(bytes, 16, 1);
    const arr = new Uint8Array(n);
    if (globalThis.crypto && globalThis.crypto.getRandomValues) globalThis.crypto.getRandomValues(arr);
    else for (let i = 0; i < n; i++) arr[i] = Math.floor(Math.random() * 256);
    return Array.from(arr).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  const ITERATIONS = 120000;

  /** PBKDF2-SHA256 quand le navigateur le propose ; repli interne sinon. */
  async function hashPassword(password, salt) {
    const pwd = S(password);
    const slt = S(salt);
    const subtle = globalThis.crypto && globalThis.crypto.subtle;
    if (subtle && globalThis.TextEncoder) {
      try {
        const enc = new TextEncoder();
        const key = await subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveBits']);
        const bits = await subtle.deriveBits(
          { name: 'PBKDF2', salt: enc.encode(slt), iterations: ITERATIONS, hash: 'SHA-256' },
          key, 256
        );
        return 'pbkdf2$' + Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, '0')).join('');
      } catch (e) { /* repli ci-dessous */ }
    }
    return 'weak$' + weakHash(slt + '|' + pwd);
  }

  /** Repli sans dependance : moins solide, jamais utilise si SubtleCrypto repond. */
  function weakHash(input) {
    const s = S(input);
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let round = 0; round < 1000; round++) {
      for (let i = 0; i < s.length; i++) {
        h1 ^= s.charCodeAt(i) + round;
        h1 = (h1 * 16777619) >>> 0;
        h2 = ((h2 << 5) - h2 + h1) >>> 0;
      }
    }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
  }

  async function makeCredentials(password) {
    const salt = randomHex(16);
    const hash = await hashPassword(password, salt);
    return { salt, hash };
  }

  async function verify(password, salt, hash) {
    if (!S(hash)) return false;
    const computed = await hashPassword(password, salt);
    return constantTimeEqual(computed, S(hash));
  }

  function constantTimeEqual(a, b) {
    const x = S(a), y = S(b);
    if (x.length !== y.length) return false;
    let diff = 0;
    for (let i = 0; i < x.length; i++) diff |= x.charCodeAt(i) ^ y.charCodeAt(i);
    return diff === 0;
  }

  /* -------------------- Comptes -------------------- */

  function accounts() { return A(O(store.state.settings).accounts); }
  function hasAccounts() { return accounts().length > 0; }
  function scope() { return pick(O(store.state.settings).authScope, ['off', 'app', 'sensitive'], 'off'); }
  function enabled() { return scope() !== 'off' && hasAccounts(); }

  function currentUser() { return state.user; }
  function currentUserName() { return S(O(state.user).name); }
  function isAdmin() { return !enabled() || S(O(state.user).role) === 'Administrateur'; }

  async function addAccount({ login, name, role, password }) {
    const cleanLogin = S(login).trim();
    if (!cleanLogin) return { ok: false, error: "L’identifiant est obligatoire." };
    if (accounts().some((a) => S(a.login).toLowerCase() === cleanLogin.toLowerCase())) {
      return { ok: false, error: 'Cet identifiant existe déjà.' };
    }
    if (S(password).length < 4) return { ok: false, error: 'Le mot de passe doit faire au moins 4 caractères.' };
    const creds = await makeCredentials(password);
    const account = model.normAccount({
      id: uid('usr'), login: cleanLogin, name: S(name).trim() || cleanLogin,
      role: pick(role, model.ROLES, 'Vendeur'), salt: creds.salt, hash: creds.hash,
    });
    store.state.settings.accounts = accounts().concat([account]);
    store.log('Compte créé', account.login + ' (' + account.role + ')', 'user');
    store.save({ reason: 'accounts' });
    return { ok: true, account };
  }

  async function setPassword(id, password) {
    const account = accounts().find((a) => S(a.id) === S(id));
    if (!account) return { ok: false, error: 'Compte introuvable.' };
    if (S(password).length < 4) return { ok: false, error: 'Le mot de passe doit faire au moins 4 caractères.' };
    const creds = await makeCredentials(password);
    account.salt = creds.salt;
    account.hash = creds.hash;
    store.log('Mot de passe modifié', account.login, 'key');
    store.save({ reason: 'accounts' });
    return { ok: true };
  }

  function removeAccount(id) {
    const list = accounts();
    const account = list.find((a) => S(a.id) === S(id));
    if (!account) return { ok: false, error: 'Compte introuvable.' };
    const admins = list.filter((a) => S(a.role) === 'Administrateur');
    if (S(account.role) === 'Administrateur' && admins.length <= 1) {
      return { ok: false, error: 'Impossible de supprimer le dernier administrateur.' };
    }
    store.state.settings.accounts = list.filter((a) => S(a.id) !== S(id));
    store.log('Compte supprimé', account.login, 'user');
    store.save({ reason: 'accounts' });
    if (S(O(state.user).id) === S(id)) logout('compte supprimé');
    return { ok: true };
  }

  /** Cle de secours : affichee une seule fois, seule son empreinte est conservee. */
  async function generateRecovery() {
    const key = (randomHex(3) + '-' + randomHex(3) + '-' + randomHex(3)).toUpperCase();
    const creds = await makeCredentials(key);
    store.state.settings.recovery = creds.salt + ':' + creds.hash;
    store.log('Clé de secours générée', '', 'key');
    store.save({ reason: 'accounts' });
    return key;
  }

  async function useRecovery(key) {
    const stored = S(O(store.state.settings).recovery);
    if (!stored || stored.indexOf(':') < 0) return { ok: false, error: "Aucune clé de secours n’a été générée." };
    const [salt, hash] = stored.split(':');
    const ok = await verify(S(key).trim().toUpperCase(), salt, hash);
    if (!ok) return { ok: false, error: 'Clé de secours incorrecte.' };
    store.state.settings.authScope = 'off';
    store.state.settings.recovery = '';
    clearAttempts();
    state.user = null;
    persistSession();
    store.log('Protection désactivée', 'Reprise en main par clé de secours', 'shield');
    store.save({ reason: 'accounts' });
    return { ok: true };
  }

  /* -------------------- Tentatives -------------------- */

  function readAttempts() {
    let parsed = null;
    try { parsed = JSON.parse(store.LS.get(ATTEMPT_KEY)); } catch (e) { parsed = null; }
    return { count: I(O(parsed).count, 0, 0), until: I(O(parsed).until, 0, 0) };
  }

  function writeAttempts(v) { store.LS.set(ATTEMPT_KEY, JSON.stringify(v)); }
  function clearAttempts() { store.LS.del(ATTEMPT_KEY); }

  function lockRemaining() {
    const { until } = readAttempts();
    const left = until - Date.now();
    return left > 0 ? Math.ceil(left / 1000) : 0;
  }

  /* -------------------- Connexion -------------------- */

  async function login(loginName, password) {
    const wait = lockRemaining();
    if (wait > 0) {
      return { ok: false, error: 'Trop de tentatives. Réessayez dans ' + wait + ' seconde' + (wait > 1 ? 's' : '') + '.' };
    }
    const account = accounts().find((a) => S(a.login).toLowerCase() === S(loginName).trim().toLowerCase());
    const ok = account ? await verify(password, account.salt, account.hash) : false;
    if (!ok) {
      const att = readAttempts();
      const max = I(O(store.state.settings).maxAttempts, 5, 1);
      const count = att.count + 1;
      const until = count >= max ? Date.now() + LOCK_MS * Math.min(5, count - max + 1) : 0;
      writeAttempts({ count, until });
      store.log('Connexion refusée', S(loginName).trim() || '(identifiant vide)', 'shield');
      store.save({ reason: 'auth', silent: true, touch: false });
      if (until) return { ok: false, error: 'Trop de tentatives. Réessayez dans ' + Math.ceil(LOCK_MS / 1000) + ' secondes.' };
      return { ok: false, error: 'Identifiant ou mot de passe incorrect.' };
    }
    clearAttempts();
    state.user = { id: account.id, login: account.login, name: account.name, role: account.role };
    state.lastActivity = Date.now();
    persistSession();
    store.log('Connexion', account.login, 'user');
    store.save({ reason: 'auth', touch: false });
    return { ok: true, user: state.user };
  }

  function logout(reason) {
    const was = currentUserName();
    state.user = null;
    persistSession();
    if (was) {
      store.log('Déconnexion', S(reason), 'user');
      store.save({ reason: 'auth', touch: false, silent: true });
    }
    store.emit('auth');
  }

  /** Session par onglet : un rafraichissement la conserve, la fermeture la referme. */
  function persistSession() {
    try {
      if (state.user) globalThis.sessionStorage.setItem(SESSION_KEY, JSON.stringify({ user: state.user, at: Date.now() }));
      else globalThis.sessionStorage.removeItem(SESSION_KEY);
    } catch (e) { /* stockage indisponible : la session ne survit pas au rafraichissement */ }
  }

  function restoreSession() {
    let parsed = null;
    try { parsed = JSON.parse(globalThis.sessionStorage.getItem(SESSION_KEY)); } catch (e) { parsed = null; }
    const user = O(O(parsed).user);
    if (!S(user.id)) return;
    // Le compte doit toujours exister.
    const account = accounts().find((a) => S(a.id) === S(user.id));
    if (!account) { try { globalThis.sessionStorage.removeItem(SESSION_KEY); } catch (e) {} return; }
    state.user = { id: account.id, login: account.login, name: account.name, role: account.role };
    state.lastActivity = I(O(parsed).at, Date.now(), 0);
    if (isExpired()) logout('inactivité');
  }

  function isExpired() {
    const minutes = I(O(store.state.settings).autolockMinutes, 0, 0);
    if (!minutes) return false;
    return Date.now() - state.lastActivity > minutes * 60000;
  }

  function touch() {
    state.lastActivity = Date.now();
    persistSession();
  }

  /** Un ecran est-il accessible en l'etat ? */
  function canView(screen) {
    if (!enabled()) return { ok: true };
    const name = S(screen);
    if (state.user && isExpired()) logout('inactivité');
    const admin = model.ADMIN_SCREENS.includes(name);
    const sensitive = model.SENSITIVE_SCREENS.includes(name);
    if (scope() === 'app') {
      if (!state.user) return { ok: false, reason: 'login' };
    } else if (scope() === 'sensitive') {
      if (sensitive && !state.user) return { ok: false, reason: 'login' };
    }
    if (admin && state.user && S(state.user.role) !== 'Administrateur') {
      return { ok: false, reason: 'admin' };
    }
    if (admin && !state.user && scope() !== 'off') return { ok: false, reason: 'login' };
    return { ok: true };
  }

  function startWatchdog() {
    if (!globalThis.document) return;
    ['click', 'keydown', 'pointerdown'].forEach((ev) => {
      globalThis.document.addEventListener(ev, () => { if (state.user) touch(); }, { passive: true });
    });
    setInterval(() => {
      if (state.user && isExpired()) {
        logout('inactivité');
        if (MS.ui && MS.ui.toast) MS.ui.toast('Session verrouillée après inactivité.', 'info');
        if (MS.app && MS.app.render) MS.app.render();
      }
    }, 15000);
  }

  MS.auth = {
    hashPassword, makeCredentials, verify, randomHex,
    accounts, hasAccounts, scope, enabled, currentUser, currentUserName, isAdmin,
    addAccount, setPassword, removeAccount, generateRecovery, useRecovery,
    login, logout, restoreSession, touch, canView, isExpired, lockRemaining,
    clearAttempts, startWatchdog,
  };
})();

/* ===== 05-sync.js ===== */
/* ============================================================
   05 — Synchronisation entre appareils (optionnelle)
   Le coeur du sujet : les regles anti-perte du chapitre 9.2.
   ============================================================ */
(function () {
  const MS = globalThis.MS;
  const { S, O, A, I, D } = MS.util;
  const model = MS.model;
  const store = MS.store;

  const CFG_KEY = MS.config.storageKey + '.syncconfig';
  const TOKEN_KEY = MS.config.storageKey + '.synctoken';

  /* ---------------------------------------------------------
     9.2 — Decision anti-perte. Fonction pure, testable seule.
     --------------------------------------------------------- */

  /**
   * Compare l'etat local et l'etat distant et dit quoi faire.
   * @returns {{action:'pull'|'push'|'noop', reason:string}}
   */
  function decide(local, remote, opts) {
    const o = O(opts);
    const l = O(local);
    const r = remote === null || remote === undefined ? null : O(remote);

    const localTime = l.updatedAt ? new Date(D(l.updatedAt)).getTime() : 0;
    const remoteTime = r && r.updatedAt ? new Date(D(r.updatedAt)).getTime() : 0;
    const localErased = l.erased ? new Date(D(l.erased)).getTime() : 0;
    const remoteErased = r && r.erased ? new Date(D(r.erased)).getTime() : 0;
    const localEmpty = model.isEmptyState(l);
    const remoteEmpty = r ? model.isEmptyState(r) : true;

    // Regle 2 : un appareil qui n'a jamais rien enregistre n'ecrit pas, il ecoute.
    const neverWrote = !l.updatedAt;

    if (!r) {
      if (neverWrote || localEmpty) return { action: 'noop', reason: 'jamais-ecrit' };
      return { action: 'push', reason: 'serveur-vide' };
    }

    if (neverWrote) {
      // Rien a defendre : on prend ce qui vient, meme un serveur vide (base neuve partagee).
      return remoteEmpty ? { action: 'noop', reason: 'deux-bases-neuves' } : { action: 'pull', reason: 'appareil-neuf' };
    }
